<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">로그인 | 우산</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
    <!-- 로그인 페이지는 검색 인덱싱 불필요 -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/login.css(t=${#dates.createNow().time})}">
</th:block>

<section class="login-page">
    <div class="common-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <h1 class="common-header__title">로그인</h1>
        <div class="common-header__right"></div>
    </div>

    <div class="login-wrapper">

        <form th:action="@{/login}" method="post" class="login-form">
            <div class="login-wrapper--id">
                <div class="email__text">이메일</div>
                <div class="common-input-wrapper target__clear-wrapper">
                    <input type="text"
                           placeholder="이메일을 입력해 주세요"
                           class="common-input target--clear-input"
                           name="loginId"
                           autocomplete="username"
                           oninput="__toggleClearBtn(this)"/>
                    <button type="button"
                            class="common-input-btn common-input__clear-btn target--clear-btn"
                            onclick="__clearInput(this)"></button>
                </div>
            </div>
            <div class="login-wrapper--pw">
                <div class="pw__text">비밀번호</div>
                <input type="password"
                       placeholder="비밀번호를 입력해 주세요"
                       class="common-input"
                       th:classappend="${param.error} ? 'common-input-error' : ''"
                       autocomplete="current-password"
                       name="password"/>
                <div class="common-text--error"
                     th:classappend="${param.error} ? 'is-visible' : ''">
                    이메일 또는 비밀번호가 틀렸습니다. 다시 한번 시도해주세요.
                </div>
            </div>
            <button class="btn btn--sm btn--disabled" id="btnLogin">로그인</button>
        </form>

        <div class="login-wrapper--sns">
            <div class="sns__hr"></div>
            <div class="sns__text">SNS 계정으로 간편 가입하기</div>
            <div class="sns__hr"></div>
        </div>

        <div class="login-wrapper--sns-icons">
            <a th:href="@{/oauth2/authorization/kakao}" class="sns__icon icon__kakao" aria-label="카카오 로그인"></a>
            <a th:href="@{/oauth2/authorization/google}" class="sns__icon icon__google" aria-label="구글 로그인"></a>
            <a th:href="@{/oauth2/authorization/naver}" class="sns__icon icon__naver" aria-label="네이버 로그인"></a>
        </div>

    </div>

    <div class="login-bottom-wrapper">
        <a class="btn btn--sm btn--bold-outline" th:href="@{/join}">이메일로 시작하기</a>

        <div class="login-wrapper--find">
            <a class="find__text" th:href="@{/login/find-id}">아이디 찾기</a>
            <a class="find__text" th:href="@{/login/find-pw}">비밀번호 찾기</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const $loginId = document.querySelector('input[name="loginId"]');
            const $pw = document.querySelector('input[name="password"]');
            const $btn = document.getElementById('btnLogin');

            if (!$loginId || !$pw || !$btn) return;

            /**
             * @date    2026-01-26
             * @author  yongss
             *
             * 처리 과정:
             *  - 이메일, 비밀번호 입력(또는 제거)할 때 마다 실행
             *  - 이메일, 비밀번호가 둘 다 입력되어 있는지 검증
             *  - 입력 상태에 따라 클래스 추가/제거
             *
             * 예외/주의:
             *  - .btn--disabled: 비활성(grey 컬러, 클릭 불가)
             *  - .btn--primary: 활성(black 컬러, 클릭 가능)
             */
            function syncLoginButton() {
                const ok = $loginId.value.trim().length > 0 && $pw.value.trim().length > 0;

                $btn.classList.toggle('btn--disabled', !ok);
                $btn.classList.toggle('btn--primary', ok);

                $btn.disabled = !ok;
            }

            // 로그인 실패 시 이메일 복원
            const hasError = new URLSearchParams(location.search).has('error');
            if (hasError) {
                const saved = sessionStorage.getItem('loginId');
                if (saved) {
                    $loginId.value = saved;
                    __toggleClearBtn($loginId);
                }
                sessionStorage.removeItem('loginId');
            }

            //초기 1회
            syncLoginButton();

            //입력할 때마다 갱신
            $loginId.addEventListener('input', syncLoginButton);
            $pw.addEventListener('input', syncLoginButton);

            // submit 전 이메일 저장
            document.querySelector('.login-form').addEventListener('submit', () => {
                sessionStorage.setItem('loginId', $loginId.value);
            });
        });
    </script>

</section>
</html>
