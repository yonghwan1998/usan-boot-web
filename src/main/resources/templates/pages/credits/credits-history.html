<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">크레딧 내역</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/credits.css(t=${#dates.createNow().time})}">
</th:block>

<section class="credits-page">
    <div class="common-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <div class="common-header__title">크레딧 내역</div>
        <div class="common-header__right"></div>
    </div>

    <div class="credits-history-wrapper">

        <div class="credits-history__filter">
            <a th:href="@{/credits/history(type='USE')}"
               class="credits-history__filter-item"
               th:classappend="${type.name() == 'USE'} ? ' is-active'">사용</a>
            <a th:href="@{/credits/history(type='CHARGE')}"
               class="credits-history__filter-item"
               th:classappend="${type.name() == 'CHARGE'} ? ' is-active'">충전</a>
        </div>

        <div class="credits-history__list">
            <div th:if="${#lists.isEmpty(ledgers)}" class="credits-history__empty">
                내역이 없습니다.
            </div>
            <div th:each="ledger : ${ledgers}" class="credits-history__item">
                <div class="credits-history__left">
                    <div class="credits-history__title-wrapper">
                        <span class="credits-history__title" th:text="${ledger.description}">-</span>
                    </div>
                    <div class="credits-history__info-wrapper">
                        <span class="credits-history__date"
                              th:text="${#temporals.format(ledger.createdAt, 'yyyy.MM.dd')}">-</span>
                        <span class="credits-history__dot">·</span>
                        <span class="credits-history__time"
                              th:text="${#temporals.format(ledger.createdAt, 'HH:mm')}">-</span>
                    </div>
                </div>
                <div class="credits-history__price-tag"
                     th:classappend="${ledger.changeAmount >= 0} ? ' charge-tag' : ' used-tag'"
                     th:text="${ledger.changeAmount >= 0} ? '+' + ${ledger.changeAmount} + 'C' : ${ledger.changeAmount} + 'C'">0C</div>
            </div>
        </div>
    </div>

    <div class="credits-btn__wrapper">
        <div class="credits__bottom-credits">현재 크레딧 :
            <span th:text="${#numbers.formatInteger(balance, 1, 'COMMA')}">0</span> C
        </div>
        <a th:href="@{/credits/charge}" class="credits-btn">크레딧 충전하기</a>
    </div>

</section>
