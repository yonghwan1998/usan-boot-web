<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">결제하기 | 우산</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/credits.css(t=${#dates.createNow().time})}">
</th:block>

<section class="credits-page">
    <div class="common-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <h1 class="common-header__title">결제하기</h1>
        <div class="common-header__right"></div>
    </div>

    <div class="credits-charge-wrapper credits-checkout-wrapper">
        <div id="payment-method"></div>
        <div id="agreement"></div>
    </div>

    <div class="btn__wrapper">
        <button type="button" class="btn btn--next" id="btnPay" disabled>결제하기</button>
    </div>

    <style>
        .credits-checkout-wrapper {
            padding: 0 0 100px;
            overflow-y: auto;
        }
    </style>

    <script src="https://js.tosspayments.com/v2/standard"></script>
    <script th:inline="javascript">
        const productId    = /*[[${productId}]]*/ null;
        const productName  = /*[[${productName}]]*/ '';
        const amount       = /*[[${amount}]]*/ 0;
        const customerKey  = /*[[${customerKey}]]*/ '';
        const customerEmail = /*[[${customerEmail}]]*/ '';
        const customerName  = /*[[${customerName}]]*/ '';
        const clientKey    = /*[[${tossClientKey}]]*/ '';

        const tossPayments = TossPayments(clientKey);
        const widgets = tossPayments.widgets({ customerKey });

        async function init() {
            // 1. 주문 생성
            const orderRes = await fetch('/api/credits/orders?productId=' + productId, { method: 'POST' });
            if (!orderRes.ok) {
                alert('주문 생성에 실패했습니다. 다시 시도해주세요.');
                history.back();
                return;
            }
            const { orderNo } = await orderRes.json();

            // 2. 결제 금액 설정
            await widgets.setAmount({ currency: 'KRW', value: amount });

            // 3. 결제 UI 렌더링
            await Promise.all([
                widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }),
                widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' })
            ]);

            document.getElementById('btnPay').disabled = false;

            // 4. 결제 요청
            document.getElementById('btnPay').addEventListener('click', async () => {
                try {
                    await widgets.requestPayment({
                        orderId: orderNo,
                        orderName: productName,
                        successUrl: window.location.origin + '/credits/toss/success',
                        failUrl: window.location.origin + '/credits/toss/fail',
                        customerEmail: customerEmail || undefined,
                        customerName: customerName || undefined
                    });
                } catch (e) {
                    if (e.code !== 'USER_CANCEL') {
                        alert('결제 중 오류가 발생했습니다: ' + e.message);
                    }
                }
            });
        }

        init();
    </script>
</section>
</html>
