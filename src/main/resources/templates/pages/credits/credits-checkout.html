<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">결제하기 | 우산</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/credits.css(t=${#dates.createNow().time})}">
</th:block>

<section class="credits-page">
    <div class="common-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <h1 class="common-header__title">결제하기</h1>
        <div class="common-header__right"></div>
    </div>

    <form id="kcpMockForm" action="/credits/kcp/mock/pay" method="post">
        <input type="hidden" name="orderNo" id="orderNo">
    </form>

    <div class="credits-charge-wrapper credits-checkout-wrapper">

        <div class="checkout-product-info">
            <div class="checkout-product-info__label">상품명</div>
            <div class="checkout-product-info__value" th:text="${productName}">크레딧</div>
        </div>

        <div class="checkout-product-info">
            <div class="checkout-product-info__label">결제 금액</div>
            <div class="checkout-product-info__value"
                 th:text="${#numbers.formatInteger(amount, 1, 'COMMA')} + '원'">0원</div>
        </div>

        <div class="checkout-product-info">
            <div class="checkout-product-info__label">구매자</div>
            <div class="checkout-product-info__value" th:text="${customerName}"></div>
        </div>

        <div class="checkout-mock-notice">
            [테스트] 헥토파이낸셜 결제 Mock — 실제 결제가 발생하지 않습니다.
        </div>

    </div>

    <div class="btn__wrapper">
        <button type="button" class="btn btn--next" id="btnPay">결제하기</button>
    </div>

    <style>
        .credits-checkout-wrapper {
            padding: 24px 20px 100px;
            gap: 0;
        }

        .checkout-product-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .checkout-product-info__label {
            font-size: 15px;
            font-weight: 500;
            color: #8b8b8b;
        }

        .checkout-product-info__value {
            font-size: 15px;
            font-weight: 600;
            color: #222222;
        }

        .checkout-mock-notice {
            margin-top: 24px;
            padding: 14px 16px;
            background: #fff8e1;
            border: 1px solid #ffe082;
            border-radius: 10px;
            font-size: 13px;
            color: #795548;
            line-height: 1.5;
        }
    </style>

    <script th:inline="javascript">
        const productId = /*[[${productId}]]*/ null;

        document.getElementById('btnPay').addEventListener('click', async () => {
            const btn = document.getElementById('btnPay');
            btn.disabled = true;
            btn.textContent = '처리 중...';

            try {
                const res = await fetch('/api/credits/orders?productId=' + productId, { method: 'POST' });
                if (!res.ok) {
                    alert('주문 생성에 실패했습니다. 다시 시도해주세요.');
                    btn.disabled = false;
                    btn.textContent = '결제하기';
                    return;
                }
                const { orderNo } = await res.json();
                document.getElementById('orderNo').value = orderNo;
                document.getElementById('kcpMockForm').submit();
            } catch (e) {
                alert('오류가 발생했습니다: ' + e.message);
                btn.disabled = false;
                btn.textContent = '결제하기';
            }
        });
    </script>
</section>
</html>
