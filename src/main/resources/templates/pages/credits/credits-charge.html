<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">크레딧 충전하기</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/credits.css(t=${#dates.createNow().time})}">
</th:block>

<section class="credits-page">
    <div class="common-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <div class="common-header__title">크레딧 충전하기</div>
        <div class="common-header__right"></div>
    </div>

    <div class="credits-charge-wrapper">

        <div class="credits-charge__selector-wrapper">
            <div class="credits-charge__own-wrapper">
                <div class="credits-charge__top">
                    <span class="credits-charge__semi-title">보유 크레딧</span>
                    <span class="credits-charge__caption">* 1C = 1건 발송</span>
                </div>
                <div class="credits-charge__bottom">
                    <div class="credits-charge__own" th:text="${balance}">0</div>
                    <img src="/img/24x24-icon-U.png">
                </div>
            </div>
            <div class="credits-charge__charge-wrapper">
                <div class="credits-charge__title">충전 금액 선택</div>
                <div class="credits-charge__price-wrapper">
                    <div th:each="product, stat : ${products}"
                         class="credits-charge__item"
                         th:classappend="${stat.first} ? 'is-active'"
                         th:data-product-id="${product.id}"
                         th:data-total-credit="${product.totalCreditAmount}"
                         th:data-price="${product.priceAmount}">
                        <div class="credits-charge__left">
                            <div class="credits-charge__credits" th:text="${product.totalCreditAmount} + ' C'">0 C</div>
                            <div class="credits-charge__won" th:text="${#numbers.formatInteger(product.priceAmount, 1, 'COMMA')} + '원'">0원</div>
                        </div>
                        <span class="credits-charge__check"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="credits-charge__selected-wrapper">
            <div class="credits-charge__selected-top">
                <span class="credits-charge__selected-text">선택한 크레딧</span>
                <span class="credits-charge__selected-credits" id="selectedCredits">0 C</span>
            </div>
            <div class="credits-charge__selected-bottom">
                <span class="credits-charge__expected-text">결제 예정 금액</span>
                <span class="credits-charge__expected-won" id="selectedPrice">0원</span>
            </div>
        </div>

        <div class="credits-charge__refund">
            <span class="credits-charge__desc">*위 상품의 최대 이용기간은 1년입니다.</span>
            <span class="credits-charge__refund-link">
                <a th:href="@{/policy/refund}" class="refund-link__text">환불 규정 안내</a>
                <span class="refund-link__icon"></span>
            </span>
        </div>

        <div class="credits-charge__method-wrapper">
            <div class="credits-charge__method-title">결제 수단</div>
            <div class="credits-charge__method-container">
                <div class="credits-charge__method-item">
                    <div class="credits-charge__method-left">
                        <img src="/img/24x24-credit-card.png">
                        <span class="credits-charge__method-text">신용/체크카드</span>
                    </div>
                    <div class="method__icon">화살표</div>
                </div>
                <div class="credits-charge__method-item">
                    <div class="credits-charge__method-left">
                        <img src="/img/24x24-bill-paper.png">
                        <span class="credits-charge__method-text">계좌이체</span>
                    </div>
                    <div class="method__icon">화살표</div>
                </div>
                <div class="credits-charge__method-item">
                    <div class="credits-charge__method-left">
                        <img src="/img/74x29-kakao-pay.png">
                        <span class="credits-charge__method-text">카카오페이</span>
                    </div>
                    <div class="method__icon">화살표</div>
                </div>
                <div class="credits-charge__method-item">
                    <div class="credits-charge__method-left">
                        <img src="/img/71x24-naver-pay.png">
                        <span class="credits-charge__method-text">네이버페이</span>
                    </div>
                    <div class="method__icon">화살표</div>
                </div>
                <div class="credits-charge__method-item">
                    <div class="credits-charge__method-left">
                        <img src="/img/79x24-toss-pay.png">
                        <span class="credits-charge__method-text">토스페이</span>
                    </div>
                    <div class="method__icon">화살표</div>
                </div>
            </div>
        </div>

        <div class="credits-charge__method-caption">결제 과정에서 외부 결제창으로 이동할 수 있습니다.</div>

    </div>

    <div class="btn__wrapper">
        <button type="button" class="btn btn--next" id="btnNext" disabled>충전하기</button>
    </div>

    <script>
        const items = document.querySelectorAll('.credits-charge__item');
        const selectedCredits = document.getElementById('selectedCredits');
        const selectedPrice = document.getElementById('selectedPrice');
        const btnNext = document.getElementById('btnNext');

        function formatNumber(n) {
            return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function selectItem(item) {
            items.forEach(el => el.classList.remove('is-active'));
            item.classList.add('is-active');

            const credit = item.dataset.totalCredit;
            const price = item.dataset.price;

            selectedCredits.textContent = formatNumber(credit) + ' C';
            selectedPrice.textContent = formatNumber(price) + '원';
            btnNext.dataset.productId = item.dataset.productId;
            btnNext.disabled = false;
        }

        // 초기 선택 (첫 번째 상품)
        const firstItem = document.querySelector('.credits-charge__item.is-active');
        if (firstItem) selectItem(firstItem);

        items.forEach(item => {
            item.addEventListener('click', () => selectItem(item));
        });

        btnNext.addEventListener('click', () => {
            const productId = btnNext.dataset.productId;
            if (!productId) return;
            window.location.href = '/credits/checkout?productId=' + productId;
        });
    </script>

</section>
