<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">매물 등록하기 | 우산</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/listing.css(t=${#dates.createNow().time})}">
</th:block>

<section class="listing-page">

    <div class="common-header listing-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <h1 class="common-header__title">매물 등록하기</h1>
        <div class="common-header__right"></div>
    </div>

    <div class="common-step__bar listing-step" th:with="listingStep=${listingStep} ? ${listingStep} : 1">

        <div class="common-step__step">
            <div class="common-step__num">1</div>
            <div class="common-step__caption">주소 선택</div>
        </div>

        <div class="common-step__line"></div>

        <div class="common-step__step">
            <div class="common-step__num">2</div>
            <div class="common-step__caption">상세주소</div>
        </div>

        <div class="common-step__line"></div>

        <div class="common-step__step">
            <div class="common-step__num">3</div>
            <div class="common-step__caption">매물 정보</div>
        </div>

    </div>

    <div class="listing-text" id="listingText">등록하시려는 매물의 주소를 입력해주세요.</div>

    <form th:action="@{/listings}" method="post" th:object="${listingRequest}" id="listingForm" enctype="multipart/form-data">

        <input type="hidden" th:field="*{addressName}" />
        <input type="hidden" th:field="*{roadAddress}" />
        <input type="hidden" th:field="*{jibunAddress}" />
        <input type="hidden" th:field="*{sido}" />
        <input type="hidden" th:field="*{sigungu}" />
        <input type="hidden" th:field="*{emd}" />
        <input type="hidden" th:field="*{lat}" />
        <input type="hidden" th:field="*{lng}" />

        <div class="listing-wrapper--address pr_16 pl_16">

            <div class="common-input-wrapper">
                <input type="text"
                       placeholder="주소를 입력해 주세요"
                       class="common-input listing-address__input"
                       name="addressKeyword"/>
                <button type="button"
                        class="common-input-btn common-input__magnifier-btn"></button>
            </div>

            <div class="address-list-wrapper">
            </div>

        </div>

        <div class="listing-wrapper--detail pr_16 pl_16" hidden>
            <div class="selected-address-wrapper">
                <div class="selected-address__top">
                    <span class="selected-address__title listing-detail__address-summary">건물명</span>
                </div>
                <div class="selected-address__bottom">
                    <span class="selected-address__jibun">지번</span>
                    <span class="selected-address__address">지번 주소</span>
                </div>
            </div>
            <div class="common-input-wrapper">
                <input type="text"
                       placeholder="상세주소를 입력해 주세요"
                       class="common-input"
                       th:field="*{addressDetail}"/>
            </div>
        </div>

        <div class="listing-wrapper--info" hidden>
            <div class="listing-edit__section-wrapper pr_16 pl_16">

                <div class="listing-edit__section">

                    <div class="selected-address-new-wrapper">
                        <div class="selected-address__left">
                            <span class="selected-address__title">건물명</span>
                            <div class="selected-address__bottom">
                                <span class="selected-address__jibun">지번</span>
                                <span class="selected-address__address">지번 주소</span>
                            </div>
                        </div>
                        <div class="selected-address__right">
                            <button type="button" class="listing-edit__edit-button">수정</button>
                        </div>
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">소유주 이름</div>
                    <div class="common-input-wrapper">
                        <input type="text"
                               placeholder="이름 입력"
                               class="common-input"
                               th:field="*{ownerName}" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">통신사</div>
                    <div class="common-select" data-name="carrier">
                        <div class="common-input-wrapper">
                            <input type="text"
                                   placeholder="해당하는 것을 선택해 주세요."
                                   class="common-input common-select__input"
                                   readonly />
                            <button type="button"
                                    class="common-input-btn common-input__expand-btn"></button>
                        </div>

                        <ul class="common-select__options">
                            <li data-value="SKT">SKT</li>
                            <li data-value="KT">KT</li>
                            <li data-value="LGU">LGU+</li>
                            <li data-value="MVNO_SKT">알뜰폰 SKT</li>
                            <li data-value="MVNO_KT">알뜰폰 KT</li>
                            <li data-value="MVNO_LGU">알뜰폰 LGU+</li>
                        </ul>

                        <input type="hidden" th:field="*{carrier}" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">소유주 휴대폰 번호</div>
                    <div class="common-input-wrapper">
                        <input type="text"
                               placeholder="소유주 휴대폰 번호 입력"
                               class="common-input"
                               th:field="*{ownerPhone}" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">거래 유형</div>
                    <div class="common-select" data-name="tradeType">
                        <div class="common-input-wrapper">
                            <input type="text"
                                   placeholder="해당하는 것을 선택해 주세요."
                                   class="common-input common-select__input"
                                   readonly />
                            <button type="button"
                                    class="common-input-btn common-input__expand-btn"></button>
                        </div>

                        <ul class="common-select__options">
                            <li data-value="SALE">매매</li>
                            <li data-value="JEONSE">전세</li>
                            <li data-value="MONTHLY">월세</li>
                            <li data-value="SEMI_JEONSE">반전세</li>
                            <li data-value="SHORT">단기임대</li>
                            <li data-value="COMMERCIAL">임대(상가/사무실 등)</li>
                        </ul>

                        <input type="hidden" th:field="*{tradeType}">
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">보증금</div>
                    <div class="common-input-wrapper">
                        <input type="number"
                               min="0"
                               step="1"
                               class="common-input"
                               th:field="*{depositManwon}"
                               placeholder="보증금(만원) 입력" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">월세</div>
                    <div class="common-input-wrapper">
                        <input type="number"
                               min="0"
                               step="1"
                               class="common-input"
                               th:field="*{rentManwon}"
                               placeholder="월세(만원) 입력" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">매매가</div>
                    <div class="common-input-wrapper">
                        <input type="number"
                               min="0"
                               step="1"
                               class="common-input"
                               th:field="*{priceManwon}"
                               placeholder="매매가(만원) 입력" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">동·호수</div>
                    <div class="common-input-wrapper">
                        <input type="text"
                               class="common-input"
                               th:field="*{dongho}"
                               placeholder="동·호수 입력" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">층</div>
                    <div class="common-input-wrapper">
                        <input type="text"
                               class="common-input"
                               th:field="*{floorInfo}"
                               placeholder="층수 입력" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">면적</div>
                    <div class="common-input-wrapper">
                        <input type="number"
                               step="0.01"
                               min="0"
                               class="common-input"
                               th:field="*{areaM2}"
                               placeholder="면적(㎡) 입력" />
                    </div>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">사진첨부</div>

                    <label class="common-upload" for="photoFiles">
                        <input id="photoFiles"
                               name="photoFiles"
                               type="file"
                               class="common-upload__input"
                               accept="png,.jpg,.jpeg,.pdf"
                               multiple
                        />

                        <span class="common-upload__icon" aria-hidden="true"></span>

                        <span class="common-upload__text">
                            여기를 눌러 사진을 첨부해 주세요.
                        </span>

                        <span class="common-upload__hint">
                            첨부 가능한 확장자 - PNG, JPG, PDF
                        </span>
                    </label>
                </div>

                <div class="listing-edit__section">
                    <div class="listing-edit__section-title">상세정보</div>
                    <div class="common-input-wrapper">
                        <textarea class="common-input"
                                  th:field="*{description}"
                                  placeholder="상세정보 입력"></textarea>
                    </div>
                </div>

            </div>

            <div class="section-divider">
                <span class="section-divider__line"></span>
                <span class="section-divider__text">기본정보</span>
                <span class="section-divider__line"></span>
            </div>

            <div class="listing-wrapper--listing pr_16 pl_16">

                <div class="listing-edit__section-wrapper">
                    <div class="listing-edit__section">
                        <div class="listing-edit__section-title">소유 관계</div>

                        <div class="role-toggle" role="radiogroup" aria-label="역할 선택">
                            <input type="radio" name="role" id="role-owner" value="OWNER">
                            <label for="role-owner" class="listing-pill role-pill">집주인</label>

                            <input type="radio" name="role" id="role-tenant" value="TENANT">
                            <label for="role-tenant" class="listing-pill role-pill">세입자</label>

                            <input type="radio" name="role" id="role-manager" value="MANAGER">
                            <label for="role-manager" class="listing-pill role-pill">관리인</label>
                        </div>
                    </div>
                    <div class="listing-edit__section">
                        <div class="listing-edit__section-title">매물종류</div>

                        <div class="type-toggle" role="radiogroup" aria-label="매물 종류 선택">
                            <input type="radio" name="type" id="type-apt" value="APT">
                            <label for="type-apt" class="listing-pill type-pill">아파트</label>

                            <input type="radio" name="type" id="type-officetel" value="OFFICETEL">
                            <label for="type-officetel" class="listing-pill type-pill">오피스텔</label>

                            <input type="radio" name="type" id="type-villa" value="VILLA">
                            <label for="type-villa" class="listing-pill type-pill">빌라/연립</label>

                            <input type="radio" name="type" id="type-oneroom" value="ONEROOM">
                            <label for="type-oneroom" class="listing-pill type-pill">원룸</label>

                            <input type="radio" name="type" id="type-tworoom" value="TWOROOM">
                            <label for="type-tworoom" class="listing-pill type-pill">투룸</label>

                            <input type="radio" name="type" id="type-detached" value="DETACHED">
                            <label for="type-detached" class="listing-pill type-pill">단독/다가구</label>

                            <input type="radio" name="type" id="type-rural" value="RURAL">
                            <label for="type-rural" class="listing-pill type-pill">전원주택</label>

                            <input type="radio" name="type" id="type-mixedhouse" value="MIXEDHOUSE">
                            <label for="type-mixedhouse" class="listing-pill type-pill">상가주택</label>

                            <input type="radio" name="type" id="type-hanok" value="HANOK">
                            <label for="type-hanok" class="listing-pill type-pill">한옥주택</label>

                            <input type="radio" name="type" id="type-store" value="STORE">
                            <label for="type-store" class="listing-pill type-pill">상가</label>

                            <input type="radio" name="type" id="type-office" value="OFFICE">
                            <label for="type-office" class="listing-pill type-pill">사무실</label>

                            <input type="radio" name="type" id="type-building" value="BUILDING">
                            <label for="type-building" class="listing-pill type-pill">건물</label>

                            <input type="radio" name="type" id="type-factory" value="FACTORY">
                            <label for="type-factory" class="listing-pill type-pill">공장/창고</label>

                            <input type="radio" name="type" id="type-knowledge" value="KNOWLEDGE">
                            <label for="type-knowledge" class="listing-pill type-pill">지식산업센터</label>

                            <input type="radio" name="type" id="type-land" value="LAND">
                            <label for="type-land" class="listing-pill type-pill">토지</label>

                            <input type="radio" name="type" id="type-apt_sale" value="APT_SALE">
                            <label for="type-apt_sale" class="listing-pill type-pill">아파트분양권</label>

                            <input type="radio" name="type" id="type-officetel_sale" value="OFFICETEL_SALE">
                            <label for="type-officetel_sale" class="listing-pill type-pill">오피스텔분양권</label>

                            <input type="radio" name="type" id="type-redevelopment" value="REDEVELOPMENT">
                            <label for="type-redevelopment" class="listing-pill type-pill">재개발</label>

                            <input type="radio" name="type" id="type-reconstruction" value="RECONSTRUCTION">
                            <label for="type-reconstruction" class="listing-pill type-pill">재건축</label>

                            <input type="radio" name="type" id="type-presale" value="PRESALE">
                            <label for="type-presale" class="listing-pill type-pill">분양중/예정</label>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </form>

    <div class="btn__wrapper pt_36 pr_16 pb_36 pl_16">
        <div class="btn btn--prev" id="btnPrev">이전</div>
        <div class="btn btn--next" id="btnNext">다음</div>
    </div>

    <script>
        const steps = [
            { text: '등록하시려는 매물의 주소를 입력해 주세요.', show: '.listing-wrapper--address' },
            { text: '상세주소를 입력해 주세요.', show: '.listing-wrapper--detail' },
            { text: '', show: '.listing-wrapper--info' },
        ];

        const wrappers = [
            '.listing-wrapper--address',
            '.listing-wrapper--detail',
            '.listing-wrapper--info',
        ];

        function qs(sel){ return document.querySelector(sel); }
        function qsa(sel){ return Array.from(document.querySelectorAll(sel)); }

        /* ================================
           STEP BAR 렌더링 규칙
           - is-current : 현재 step
           - is-next    : 바로 다음 step + line
        ================================= */
        function renderStepBar(step) {
            const stepEls = qsa('.listing-step .common-step__step');
            const lineEls = qsa('.listing-step .common-step__line');

            // 전체 초기화
            stepEls.forEach(el => el.classList.remove('is-current', 'is-next'));
            lineEls.forEach(el => el.classList.remove('is-next'));

            const currentIdx = step - 1;
            const nextIdx = step; // 바로 다음

            // 현재 STEP
            if (stepEls[currentIdx]) {
                stepEls[currentIdx].classList.add('is-current');
            }

            // 바로 다음 STEP
            if (stepEls[nextIdx]) {
                stepEls[nextIdx].classList.add('is-next');
            }

            // 바로 다음 LINE (current → next 사이)
            if (lineEls[currentIdx]) {
                lineEls[currentIdx].classList.add('is-next');
            }
        }

        function setStep(step) {
            // 안내 문구
            const joinText = qs('#listingText');
            if (joinText) joinText.textContent = steps[step - 1].text;

            // 입력 영역 노출
            wrappers.forEach(w => {
                const el = qs(w);
                if (el) el.hidden = true;
            });
            const showEl = qs(steps[step - 1].show);
            if (showEl) showEl.hidden = false;

            // 버튼 상태
            const btnNext = qs('#btnNext');

            if (btnNext) btnNext.textContent =
                (step === steps.length) ? '완료' : '다음';

            // STEP BAR 갱신
            renderStepBar(step);

            // 현재 step 저장
            window.__LISTING_STEP__ = step;
        }

        function validateStep(step) {
            const $ = (sel) => document.querySelector(sel);

            const getByName = (name) => document.querySelector(`[name="${name}"]`);
            const val = (el) => (el?.value ?? '').trim();

            const role = document.querySelector('input[name="role"]:checked')?.value ?? '';
            const type = document.querySelector('input[name="type"]:checked')?.value ?? '';

            const addressDetailEl = getByName('addressDetail');
            const addressDetail = val(addressDetailEl);

            const ownerNameEl = getByName('ownerName');
            const carrierEl = getByName('carrier');
            const ownerPhoneEl = getByName('ownerPhone');
            const tradeTypeEl = getByName('tradeType');

            const ownerName = val(ownerNameEl);
            const carrier = val(carrierEl);
            const ownerPhoneRaw = val(ownerPhoneEl);
            const tradeType = val(tradeTypeEl);

            // 공통: 경고 + 포커스
            const fail = (message, focusEl) => {
                alert(message);
                if (focusEl && typeof focusEl.focus === 'function') {
                    focusEl.focus();
                }
                return false;
            };

            // Step 1
            if (step === 1) {
                if (!window.__SELECTED_ADDRESS__) {
                    alert('주소를 먼저 선택해 주세요.');
                    return false;
                }
                return true;
            }

            // Step 2
            if (step === 2) {
                if (!addressDetail) return fail('상세주소를 입력해 주세요.', addressDetailEl);
                return true;
            }

            // Step 3
            if (step === 3) {
                if (!role) return fail('소유 관계를 선택해 주세요.');
                if (!type) return fail('매물 종류를 선택해 주세요.');
                if (!ownerName) return fail('소유주 이름을 입력해 주세요.', ownerNameEl);
                if (!carrier) return fail('통신사를 선택해 주세요.', $('.common-select[data-name="carrier"] .common-select__input') || carrierEl);

                // 휴대폰: 숫자만 남기고 10~11자리 체크 (01012345678 or 0111234567 등)
                const phoneDigits = ownerPhoneRaw.replace(/\D/g, '');
                if (!phoneDigits) return fail('소유주 휴대폰 번호를 입력해 주세요.', ownerPhoneEl);
                if (!(phoneDigits.length === 10 || phoneDigits.length === 11)) {
                    return fail('휴대폰 번호를 정확히 입력해 주세요. (숫자 10~11자리)', ownerPhoneEl);
                }

                if (!tradeType) return fail('거래 유형을 선택해 주세요.', $('.common-select[data-name="tradeType"] .common-select__input') || tradeTypeEl);

                return true;
            }

            return true;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const initial = Number(qs('.listing-step')?.getAttribute('data-step')) || 1;
            setStep(initial);

            qs('#btnPrev')?.addEventListener('click', () => {
                const step = window.__LISTING_STEP__ || 1;
                if (step > 1) setStep(step - 1);
            });

            qs('#btnNext')?.addEventListener('click', () => {
                const step = window.__LISTING_STEP__ || 1;
                if (!validateStep(step)) return;

                if (step < steps.length) {
                    setStep(step + 1);
                } else {
                    qs('#listingForm')?.submit();
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const list = document.querySelector('.address-list-wrapper');
            if (!list) return;

            list.addEventListener('click', (e) => {
                const item = e.target.closest('.matched-address');
                if (!item) return;

                // 1) 기존 선택 해제
                list.querySelectorAll('.matched-address.is-selected')
                    .forEach(el => el.classList.remove('is-selected'));

                // 2) 현재 선택
                item.classList.add('is-selected');
            });
        });

        function applySelectedAddressToUI(selected) {
            const detailEl = document.querySelector('[name="addressDetail"]');
            const detail = (detailEl?.value ?? '').trim();

            const baseTitle = (selected?.name || '').trim();
            const displayTitle = detail ? `${baseTitle} ${detail}` : baseTitle;

            // 화면 표시(Step2/Step3 공통)
            document.querySelectorAll('.selected-address__title').forEach(el => {
                el.textContent = displayTitle;
            });
            document.querySelectorAll('.listing-detail__address-summary').forEach(el => {
                el.textContent = displayTitle;
            });

            // 주소 라인
            const addressLine = selected.roadAddress || selected.jibunAddress || selected.name || '';
            document.querySelectorAll('.selected-address__address').forEach(el => {
                el.textContent = addressLine;
            });

            // 지번 배지
            const showJibunBadge = !selected.roadAddress && !!selected.jibunAddress;
            document.querySelectorAll('.selected-address__jibun').forEach(el => {
                el.style.display = showJibunBadge ? '' : 'none';
            });

            // hidden addressName에 "주소+상세주소" 저장
            const addressNameHidden = document.querySelector('[name="addressName"]');
            if (addressNameHidden) addressNameHidden.value = displayTitle;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const $input = document.querySelector('.listing-address__input');
            const $list = document.querySelector('.address-list-wrapper');

            window.__SELECTED_ADDRESS__ = null;

            if (!$input || !$list) return;

            // --- debounce ---
            let t = null;
            const debounce = (fn, delay = 250) => (...args) => {
                if (t) clearTimeout(t);
                t = setTimeout(() => fn(...args), delay);
            };

            // --- fetch ---
            async function fetchAddress(keyword) {
                const qs = new URLSearchParams({ q: keyword });
                const res = await fetch(`/listings/api/address/search?${qs.toString()}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                if (!res.ok) throw new Error('address search failed');
                return await res.json(); // { items: [...] }
            }

            // --- render ---
            function renderAddressList(items, keyword) {
                const safeKeyword = keyword || '';

                if (!items || items.length === 0) {
                    $list.innerHTML = `
                        <div class="address-list__empty">검색 결과가 없습니다.</div>
                    `;
                    return;
                }

                $list.innerHTML = items.map(item => {
                    const buildingName = (item.buildingName || '').trim();
                    const road = (item.roadAddress || '').trim();
                    const jibun = (item.jibunAddress || '').trim();

                    const title = buildingName || road || jibun || safeKeyword;
                    const showJibunBadge = !road && !!jibun;
                    const addressText = road || jibun || safeKeyword;

                    return `
                        <div class="matched-address"
                            data-name="${__escapeHtml(title)}"
                            data-building="${__escapeHtml(buildingName)}"
                            data-road="${__escapeHtml(road)}"
                            data-jibun="${__escapeHtml(jibun)}"
                            data-sido="${__escapeHtml(item.sido || '')}"
                            data-sigungu="${__escapeHtml(item.sigungu || '')}"
                            data-emd="${__escapeHtml(item.emd || '')}"
                            data-lat="${item.lat}"
                            data-lng="${item.lng}"
                        >
                            <div class="matched-address__top">
                                <span class="matched-address__icon"></span>
                                <div class="matched-address__title">${__escapeHtml(title)}</div>
                            </div>
                            <div class="matched-address__bottom">
                                <span class="matched-address__jibun" style="display:${showJibunBadge ? 'inline-flex' : 'none'}">지번</span>
                                <span class="matched-address__address">${__escapeHtml(addressText)}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // --- input handler ---
            const onSearch = debounce(async () => {
                const keyword = $input.value.trim();

                // 너무 짧으면 목록 비우기
                if (keyword.length < 2) {
                    $list.innerHTML = '';
                    return;
                }

                try {
                    $list.innerHTML = `<div class="address-list__loading">검색 중...</div>`;
                    const data = await fetchAddress(keyword);
                    renderAddressList(data.items || [], keyword);
                } catch (e) {
                    console.error(e);
                    $list.innerHTML = `<div class="address-list__error">검색 중 오류가 발생했습니다.</div>`;
                }
            }, 250);

            $input.addEventListener('input', onSearch);

            // --- click delegate (리스트 항목 클릭) ---
            $list.addEventListener('click', (e) => {
                const $item = e.target.closest('.matched-address');
                if (!$item) return;

                // 기존 선택 제거
                $list.querySelectorAll('.matched-address.is-selected')
                    .forEach(el => el.classList.remove('is-selected'));
                $item.classList.add('is-selected');

                const selected = {
                    name: $item.dataset.name || '',
                    roadAddress: $item.dataset.road || '',
                    jibunAddress: $item.dataset.jibun || '',
                    sido: $item.dataset.sido || '',
                    sigungu: $item.dataset.sigungu || '',
                    emd: $item.dataset.emd || '',
                    lat: Number($item.dataset.lat),
                    lng: Number($item.dataset.lng),
                };

                window.__SELECTED_ADDRESS__ = selected;

                function setValue(name, value) {
                    const el = document.querySelector(`[name="${name}"]`);
                    if (el) el.value = value ?? '';
                }

                setValue('addressName', selected.name);
                setValue('roadAddress', selected.roadAddress);
                setValue('jibunAddress', selected.jibunAddress);
                setValue('sido', selected.sido);
                setValue('sigungu', selected.sigungu);
                setValue('emd', selected.emd);
                setValue('lat', String(selected.lat ?? ''));
                setValue('lng', String(selected.lng ?? ''));

                applySelectedAddressToUI(selected);

                setStep(2);
            });
        });
    </script>

    <script>
        // 예: 저장 성공 후 호출
        function openListingCompleteModal() {
            window.CommonModal.open({
                title: '매물 등록이 완료되었습니다.',
                bodyHtml: '',
                buttons: [
                    {
                        text: '매물 전송',
                        variant: 'outline',
                        onClick: (close) => { close(); location.href = '/map/listings/share'; }
                    },
                    {
                        text: '매물 관리',
                        variant: 'primary',
                        onClick: (close) => { close(); location.href = '/listings'; }
                    }
                ]
            });
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const detailEl = document.querySelector('[name="addressDetail"]');
            if (!detailEl) return;

            detailEl.addEventListener('input', () => {
                if (!window.__SELECTED_ADDRESS__) return;
                const base = (window.__SELECTED_ADDRESS__.name || '').trim();
                const detail = detailEl.value.trim();
                const addressNameEl = document.querySelector('[name="addressName"]');
                if (addressNameEl) addressNameEl.value = detail ? `${base} ${detail}` : base;
            });
        });
    </script>
