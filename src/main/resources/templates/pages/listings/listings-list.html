<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">매물 관리하기</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/listing.css(t=${#dates.createNow().time})}">
</th:block>

<section class="listing-page">
    <div class="common-header listing-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <div class="common-header__title">매물 관리하기</div>
        <div class="common-header__right"></div>
    </div>

    <div class="listing-list-wrapper">

        <div th:if="${#lists.isEmpty(listings)}" class="listing-list-empty">
            <p>등록된 매물이 없습니다.</p>
        </div>

        <div class="listing-list-container" th:each="listing, stat : ${listings}">
            <div class="listing-list__top">
                <span class="listing-list__label" th:text="'매물 ' + ${stat.count}">매물 1</span>
                <div class="listing-list__title-wrapper">
                    <span class="listing-list__title-icon">icon</span>
                    <span class="listing-list__title" th:text="${listing.addressName}">주소</span>
                </div>
                <div class="listing-list__address" th:text="${listing.addressName}">도로명 주소</div>
            </div>
            <div class="listing-list__bottom">
                <div class="listing-list__buttons">
                    <a class="listing-list__button" th:href="@{/listings/{publicId}/edit(publicId=${listing.publicId})}">수정 및 상세정보</a>
                    <button class="listing-list__button js-delete-btn"
                            th:data-public-id="${listing.publicId}">삭제</button>
                </div>
                <button class="listing-list__send-wrapper">
                    <span class="listing-list__icon"></span>
                    <a class="listing-list__send-text" th:href="@{/map/listings/share}">
                        매물 발송하기
                    </a>
                </button>
            </div>
        </div>

    </div>

    <div class="btn__wrapper pt_36 pr_16 pb_36 pl_16">
        <a th:href="@{/listings/new}" class="btn btn--prev">매물을 더 추가하기겠어요?</a>
    </div>

    <script>
        document.querySelectorAll('.js-delete-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!confirm('매물을 삭제하시겠습니까?')) return;
                const publicId = btn.dataset.publicId;
                const res = await fetch(`/listings/${publicId}`, { method: 'DELETE' });
                if (res.ok) {
                    btn.closest('.listing-list-container').remove();
                } else {
                    alert('삭제에 실패했습니다. 다시 시도해주세요.');
                }
            });
        });
    </script>

</section>
</html>
