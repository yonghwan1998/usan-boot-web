<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">로그인</title>
</head>

<th:block th:fragment="pcSideContent">
    <div class="align_center direction_column pc-side-inner">
        <h1 class="pc-side-title">우리 동네 부동산</h1>
        <p class="pc-side-desc">
            내 주변 중개사, 매물 정보를<br/>
            한 번에 확인하세요.
        </p>
        <img src="/img/side-test.jpeg"
             alt="우리 동네 부동산 소개"
             class="pc-side-img"
             style="width: 50%">
    </div>
</th:block>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/join.css(t=${#dates.createNow().time})}">
</th:block>

<section>
    <div class="common-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <div class="common-header__title" th:text="'STEP.' + ${joinStep}">STEP.1</div>
        <div class="common-header__right btn--X"></div>
    </div>

    <div class="join-step" th:with="joinStep=${joinStep} ? ${joinStep} : 1">
        <div class="common-step__bar">
            <div class="common-step__prev"
                 th:classappend="${joinStep} == 1 ? 'is-hidden' : ''"></div>

            <div class="common-step__line common-step__line--left"
                 th:classappend="${joinStep} == 1 ? 'is-hidden' : ''">
            </div>

            <div class="common-step__current">
                <span class="common-step__circle" th:text="${joinStep}">1</span>
            </div>

            <div class="common-step__line common-step__line--right"
                 th:classappend="${joinStep} == 5 ? 'is-hidden' : ''"></div>

            <div class="common-step__next"
                 th:classappend="${joinStep} == 5 ? 'is-hidden' : ''"></div>
        </div>
    </div>
    <div class="join-text">이메일을 입력해주세요.</div>
    <div class="common-input-wrapper target__clear-wrapper">
        <input type="text" placeholder="아이디를 적어주세요" class="common-input target--clear-input" name="id" oninput="__toggleClearBtn(this)"/>
        <button type="button" class="common-input__clear-btn target--clear-btn" onclick="__clearInput(this)"></button>
    </div>
    <div class="join-bottom-button">
        <div class="btn btn--outline btn--sm">이전</div>
        <div class="btn btn--primary btn--sm">다음</div>
    </div>
</section>
