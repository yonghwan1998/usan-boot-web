<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">회원가입 | 우산</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/join.css(t=${#dates.createNow().time})}">
</th:block>

<section class="join-page">
    <div class="common-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <h1 class="common-header__title">회원가입</h1>
        <div class="common-header__right btn--X"></div>
    </div>

    <div class="common-step__bar join-step" th:with="joinStep=${joinStep} ? ${joinStep} : 1">

        <div class="common-step__step">
            <div class="common-step__num">1</div>
            <div class="common-step__caption">Step 1</div>
        </div>

        <div class="common-step__line"></div>

        <div class="common-step__step">
            <div class="common-step__num">2</div>
            <div class="common-step__caption">Step 2</div>
        </div>

        <div class="common-step__line"></div>

        <div class="common-step__step">
            <div class="common-step__num">3</div>
            <div class="common-step__caption">Step 3</div>
        </div>

    </div>

    <div class="join-text" id="joinText">STEP을 입력해주세요.</div>

    <div th:if="${joinError != null}" class="join-error" th:text="${joinError}"></div>

    <form th:action="@{/join}" method="post" th:object="${joinRequest}" id="joinForm">

        <div class="join-wrapper--email">
            <div class="common-input-wrapper target__clear-wrapper">
                <input type="text"
                       placeholder="이메일을 입력해 주세요."
                       class="common-input target--clear-input join-input--email"
                       th:field="*{email}"
                       oninput="__toggleClearBtn(this)"/>
                <button type="button"
                        class="common-input-btn common-input__clear-btn target--clear-btn"
                        onclick="__clearInput(this)"></button>
            </div>

            <div class="common-text--error join-error-text--email">
                이메일 오류입니다.
            </div>
        </div>

        <div class="join-wrapper--pw" hidden>
            <div class="common-input-wrapper target__view-wrapper">
                <input type="password"
                       placeholder="비밀번호를 적어주세요"
                       class="common-input target--view-input join-input--pw"
                       th:field="*{password}"/>
                <button type="button"
                        class="common-input-btn common-input__eye-slash-btn target--view-btn"
                        onclick="__toggleViewBtn(this)"></button>
            </div>
            <div class="join-error-text--pw pw__caption">영문, 숫자, 특수문자를 조합해 8자 이상 적어주세요.</div>
            <div class="pw-confirm__text">비밀번호 확인</div>
            <div class="common-input-wrapper target__view-wrapper">
                <input type="password"
                       placeholder="비밀번호를 다시 적어주세요"
                       class="common-input target--view-input"
                       th:field="*{passwordConfirm}"/>
                <button type="button"
                        class="common-input-btn common-input__eye-slash-btn target--view-btn"
                        onclick="__toggleViewBtn(this)"></button>
            </div>
        </div>

        <div class="join-wrapper--phone" hidden>
            <div class="common-input-wrapper target__clear-wrapper">
                <input type="text"
                       placeholder="전화번호를 입력해 주세요."
                       class="common-input target--clear-input join-input--phone"
                       th:field="*{phone}"
                       oninput="__toggleClearBtn(this)"/>
                <button type="button"
                        class="common-input-btn common-input__clear-btn target--clear-btn"
                        onclick="__clearInput(this)"></button>
            </div>

            <div class="common-text--error join-error-text--phone">
                전화번호 오류입니다.
            </div>
        </div>

    </form>

    <div class="btn__wrapper">
        <div class="btn btn--prev" id="btnPrev">이전</div>
        <div class="btn btn--next" id="btnNext">다음</div>
    </div>

    <script>
        const steps = [
            { text: '이메일을 입력해 주세요.',   show: '.join-wrapper--email' },
            { text: '비밀번호를 입력해 주세요.', show: '.join-wrapper--pw' },
            { text: '전화번호를 입력해 주세요.', show: '.join-wrapper--phone' },
        ];

        const wrappers = [
            '.join-wrapper--email',
            '.join-wrapper--pw',
            '.join-wrapper--phone',
        ];

        function qs(sel){ return document.querySelector(sel); }
        function qsa(sel){ return Array.from(document.querySelectorAll(sel)); }

        /* ================================
           STEP BAR 렌더링 규칙
           - is-current : 현재 step
           - is-next    : 바로 다음 step + line
        ================================= */
        function renderStepBar(step) {
            const stepEls = qsa('.join-step .common-step__step');
            const lineEls = qsa('.join-step .common-step__line');

            // 전체 초기화
            stepEls.forEach(el => el.classList.remove('is-current', 'is-next'));
            lineEls.forEach(el => el.classList.remove('is-next'));

            const currentIdx = step - 1;
            const nextIdx = step; // 바로 다음

            // 현재 STEP
            if (stepEls[currentIdx]) {
                stepEls[currentIdx].classList.add('is-current');
            }

            // 바로 다음 STEP
            if (stepEls[nextIdx]) {
                stepEls[nextIdx].classList.add('is-next');
            }

            // 바로 다음 LINE (current → next 사이)
            if (lineEls[currentIdx]) {
                lineEls[currentIdx].classList.add('is-next');
            }
        }

        function setStep(step) {
            // 안내 문구
            const joinText = qs('#joinText');
            if (joinText) joinText.textContent = steps[step - 1].text;

            // 입력 영역 노출
            wrappers.forEach(w => {
                const el = qs(w);
                if (el) el.hidden = true;
            });
            const showEl = qs(steps[step - 1].show);
            if (showEl) showEl.hidden = false;

            // 버튼 상태
            const btnNext = qs('#btnNext');

            if (btnNext) btnNext.textContent =
                (step === steps.length) ? '완료' : '다음';

            // STEP BAR 갱신
            renderStepBar(step);

            // 현재 step 저장
            window.__JOIN_STEP__ = step;
        }

        async function validateStep(step){

            if (step === 1) {
                const emailInput = document.querySelector('[name="email"]');
                const email = emailInput ? emailInput.value : '';

                const errorInput = document.querySelector('.common-input.join-input--email');
                const errorText = document.querySelector('.common-text--error.join-error-text--email');

                if (!errorText || !errorInput) return false;

                errorInput.classList.remove('common-input-error');
                errorText.classList.remove('is-visible');
                errorText.textContent = '';

                if (__isBlank(email)) {
                    errorInput.classList.add('common-input-error');
                    errorText.classList.add('is-visible');
                    errorText.textContent = '이메일을 입력해 주세요.';
                    return false;
                }

                if (!__isValidEmail(email)) {
                    errorInput.classList.add('common-input-error');
                    errorText.classList.add('is-visible');
                    errorText.textContent = '이메일 형식을 확인해 주세요.';
                    return false;
                }

                try {
                    const {exists} = await __checkEmailExists(email);
                    if (exists) {
                        errorInput.classList.add('common-input-error');
                        errorText.classList.add('is-visible');
                        errorText.textContent = '이미 가입된 이메일입니다.';
                        return false;
                    }

                } catch (e) {
                    errorInput.classList.add('common-input-error');
                    errorText.classList.add('is-visible');
                    errorText.textContent = '이메일 확인 중 오류가 발생했습니다. 새로고침 후 다시 시도해 주세요.';
                    return false;
                }

                errorInput.classList.remove('common-input-error');
                errorText.classList.remove('is-visible');
                errorText.textContent = '';
            }
            if (step === 2) {
                const passwordInput = document.querySelector('[name="password"]');
                const passwordConfirmInput = document.querySelector('[name="passwordConfirm"]');
                const password = passwordInput ? passwordInput.value : '';
                const passwordConfirm = passwordConfirmInput ? passwordConfirmInput.value : '';

                const errorText = document.querySelector('.join-error-text--pw');

                if (!passwordInput || !passwordConfirmInput || !errorText) return false;

                errorText.classList.remove(
                    'pw__caption',
                    'common-text--error',
                    'is-visible',
                    'pw_condition'
                );
                errorText.textContent = '';

                passwordInput.classList.remove('common-input-error');
                passwordConfirmInput.classList.remove('common-input-error');

                if (!__isValidPassword(password)) {
                    passwordInput.classList.add('common-input-error');

                    errorText.classList.add('common-text--error', 'is-visible');
                    errorText.textContent = '영문, 숫자, 특수문자를 조합해 8자 이상 적어주세요.';
                    return false;
                }

                if (password !== passwordConfirm) {
                    passwordInput.classList.add('common-input-error');
                    passwordConfirmInput.classList.add('common-input-error');

                    errorText.classList.add('common-text--error', 'is-visible');
                    errorText.textContent = '비밀번호와 비밀번호 확인을 검증해 주세요.';
                    return false;
                }

                errorText.classList.add('pw_condition');
                errorText.textContent = '사용 가능한 비밀번호입니다.';

            }
            if (step === 3) {
                const phoneInput = document.querySelector('[name="phone"]');
                const phone = phoneInput ? phoneInput.value : '';

                const errorInput = document.querySelector('.join-input--phone');
                const errorText = document.querySelector('.common-text--error.join-error-text--phone');

                if (!errorInput || !errorText) return false;

                errorInput.classList.remove('common-input-error');
                errorText.classList.remove('is-visible');
                errorText.textContent = '';

                if (!__isValidPhone(phone)) {
                    errorInput.classList.add('common-input-error');
                    errorText.classList.add('is-visible');
                    errorText.textContent = '전화번호 형식을 확인해 주세요. 예) 010-1234-5678';
                    return false;
                }

                try {
                    const { exists } = await __checkPhoneExists(phone);

                    if (exists) {
                        errorInput.classList.add('common-input-error');
                        errorText.classList.add('is-visible');
                        errorText.textContent = '이미 가입된 전화번호입니다.';
                        return false;
                    }

                } catch (e) {
                    errorInput.classList.add('common-input-error');
                    errorText.classList.add('is-visible');
                    errorText.textContent = '전화번호 확인 중 오류가 발생했습니다.';
                    return false;
                }

                errorInput.classList.remove('common-input-error');
                errorText.classList.remove('is-visible');
                errorText.textContent = '';
            }
            return true;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const initial = Number(qs('.join-step')?.getAttribute('data-step')) || 1;
            setStep(initial);

            qs('#btnPrev')?.addEventListener('click', () => {
                const step = window.__JOIN_STEP__ || 1;
                if (step > 1) setStep(step - 1);
            });

            qs('#btnNext')?.addEventListener('click', async () => {
                const step = window.__JOIN_STEP__ || 1;

                const ok = await validateStep(step);
                if (!ok) return;

                if (step < steps.length) {
                    setStep(step + 1);
                } else {
                    qs('#joinForm')?.submit();
                    alert('회원가입이 완료됐습니다!');
                }
            });
        });

        document.querySelector('[name="phone"]')?.addEventListener('input', (e) => {
            e.target.value = __formatPhone(e.target.value);
        });
    </script>

    <script th:if="${joinError != null}" th:inline="javascript">
        /*<![CDATA[*/
        const msg = /*[[${joinError}]]*/ '';
        if (msg) {
            alert(msg);
            window.location.replace('/join');
        }
        /*]]>*/
    </script>
</section>
