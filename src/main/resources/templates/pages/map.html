<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/default :: layout(~{::title}, ~{::section})}">
<head>
    <title>우리 동네 부동산 지도</title>
</head>

<body>
<section>
    <!-- 네이버 지도 API -->
    <script type="text/javascript" th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId}"></script>
    <script type="text/javascript" src="/js/MarkerClustering.js"></script>

    <!-- 지도 영역 -->
    <div class="main-content">
        <div id="map" style="width: 100%; height: 500px"></div>

        <!-- 선택된 중개사 바텀시트 -->
        <div id="broker-sheet" class="bottom-sheet">
            <div class="bottom-sheet__handle"></div>
            <div id="broker-sheet-content"></div>
        </div>
    </div>

    <!-- map control -->
    <script>

        let map;
        let markers = [];
        let markerClustering = null;
        let selectedClusterMarker = null;

        let selectedMarker = null;

        let lastFetchId = 0;

        //줌 단계 규칙(규칙 수정 시 설명 부분도 수정 필요)
        //13 이상: 개별 마커만 보이기
        //11, 12: 클러스터만 보이기
        //10 이하: 아무것도 안 보이기
        const ZOOM_MARKER_ONLY = 13;
        const ZOOM_CLUSTER_MIN = 11;
        const ZOOM_CLUSTER_MAX = 12;
        const ZOOM_NONE_MAX = 10;

        //아이콘 정의
        const WHITE_ICON = {
            url: '/img/marker-agency-white.png',
            size: new naver.maps.Size(56, 56),
            scaledSize: new naver.maps.Size(56, 56),
            origin: new naver.maps.Point(0, 0),
            anchor: new naver.maps.Point(28, 56)
        };

        const ORANGE_ICON = {
            url: '/img/marker-agency-orange.png',
            size: new naver.maps.Size(56, 56),
            scaledSize: new naver.maps.Size(56, 56),
            origin: new naver.maps.Point(0, 0),
            anchor: new naver.maps.Point(28, 56)
        };

        function initMap() {

            const center = new naver.maps.LatLng(33.464933, 126.530862);

            map = new naver.maps.Map('map', {
                center: center,
                zoom: 13
            });

            markerClustering = new MarkerClustering({
                map: map,
                markers: [],
                gridSize: 200,
                minClusterSize: 1,
                icons: [{
                    content: `
                        <div class="usan-cluster">
                            <img src="/img/marker-agency-white.png" class="usan-cluster__img" />
                            <span class="usan-cluster__count"></span>
                        </div>
                    `,
                    size: new naver.maps.Size(56, 56),
                    anchor: new naver.maps.Point(28, 56)
                }],
                indexGenerator: [1],
                stylingFunction: function(clusterMarker, count) {

                    const el = clusterMarker.getElement();
                    if (!el) return;

                    const span = el.querySelector('.usan-cluster__count');
                    if (!span) return;

                    if (count <= 1) {
                        span.style.display = 'none';
                        span.textContent = '';
                    } else {
                        span.style.display = 'flex';
                        span.textContent = String(count);
                    }
                }
            });

            loadBrokersInBounds();

            naver.maps.Event.addListener(map, 'zoom_changed', function () {
                closeBrokerSheet();
                loadBrokersInBounds();
            });

            naver.maps.Event.addListener(map, 'dragend', function () {
                closeBrokerSheet();
                loadBrokersInBounds();
            });

            naver.maps.Event.addListener(map, 'click', function () {
                const sheet = document.getElementById('broker-sheet');
                if (!sheet) return;

                if (sheet.classList.contains('open')) {
                    closeBrokerSheet();
                }
            });

            naver.maps.Event.addListener(markerClustering, 'clusterclick', function(cluster, e) {
                onClusterClick(cluster);
            });
        }

        function loadBrokersInBounds() {

            const bounds = map.getBounds();
            if (!bounds) {
                return;
            }

            const zoom = map.getZoom();

            if (zoom <= ZOOM_NONE_MAX) {
                clearMarkersAndClusters();
                return;
            }

            const sw = bounds.getSW();
            const ne = bounds.getNE();

            const south = sw.lat();
            const north = ne.lat();
            const west = sw.lng();
            const east = ne.lng();

            const url = `/map/api/brokers?south=${south}&north=${north}&west=${west}&east=${east}`;

            const fetchId = ++lastFetchId;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (fetchId !== lastFetchId) {
                        return;
                    }

                    const currentZoom = map.getZoom();

                    if (currentZoom <= ZOOM_NONE_MAX) {
                        clearMarkersAndClusters();
                        return;
                    }

                    renderMarkers(data, currentZoom);
                })
                .catch(err => console.error('[MAP] fetch error:', err));
        }

        function renderMarkers(brokers, zoom) {

            let nextMode;

            if (zoom >= ZOOM_MARKER_ONLY) {
                nextMode = 'MARKER';
            } else if (zoom >= ZOOM_CLUSTER_MIN && zoom <= ZOOM_CLUSTER_MAX) {
                nextMode = 'CLUSTER';
            } else {
                nextMode = 'NONE';
            }

            clearMarkersAndClusters();

            markers = brokers.map(b => {
                const marker = new naver.maps.Marker({
                    position: new naver.maps.LatLng(b.lat, b.lng),
                    icon: WHITE_ICON,
                    title: b.officeName
                });

                marker.__brokerCode = b.brokerCode;

                naver.maps.Event.addListener(marker, 'click', function () {
                   onMarkerClick(marker);
                });

                return marker;
            });

            if (nextMode === 'MARKER') {
                if (markerClustering) {
                    markerClustering.setMarkers([]);
                }

                markers.forEach(m => m.setMap(map));

            } else if (nextMode === 'CLUSTER') {
                markers.forEach(m => m.setMap(null));

                if (markerClustering) {
                    markerClustering.setMarkers(markers);

                    naver.maps.Event.trigger(map, 'idle');
                }
            } else {
                clearMarkersAndClusters();
            }
        }

        async function onClusterClick(cluster) {

            const clusterMarker = cluster._clusterMarker;

            if (clusterMarker && typeof clusterMarker.getElement === 'function') {
                const el = clusterMarker.getElement();
                if (el) {
                    const img = el.querySelector('.usan-cluster__img');

                    if (selectedClusterMarker && selectedClusterMarker !== clusterMarker) {
                        const prevEl = selectedClusterMarker.getElement();
                        if (prevEl) {
                            const prevImg = prevEl.querySelector('.usan-cluster__img');
                            if (prevImg) {
                                prevImg.src = '/img/marker-agency-white.png';
                            }
                        }
                    }

                    if (img) {
                        img.src = '/img/marker-agency-orange.png';
                        selectedClusterMarker = clusterMarker;
                    }
                }
            }

            const members = cluster.getClusterMember() || [];

            let brokerCodes = members
                .map(m => m.__brokerCode)
                .filter(Boolean);

            if (!brokerCodes.length) {
                console.warn('[MAP] cluster has no brokerCodes')
                return;
            }

            try {
                const res = await fetch('/map/api/brokers/cluster', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        brokerCodes: brokerCodes
                    })
                });

                if (!res.ok) {
                    throw new Error('클러스터 중개사 조회 실패');
                }

                const list = await res.json();

                renderClusterSheet(list);
            } catch (e) {
                console.error(e);
            }
        }

        async function onMarkerClick(marker) {

            const brokerCode = marker.__brokerCode;
            if(!brokerCode) {
                return;
            }

            if(selectedMarker && selectedMarker !== marker) {
                selectedMarker.setIcon(WHITE_ICON);
            }

            selectedMarker = marker;
            marker.setIcon(ORANGE_ICON);

            try {
                const res = await fetch(`/map/api/broker/${brokerCode}`);
                if(!res.ok) {
                    throw new Error('상세 조회 실패');
                }

                const detail  = await res.json();
                renderBrokerSheet(detail);
            } catch (e) {
                console.error(e);
                // showBrokerSheetError();
            }
        }

        function renderBrokerSheet(detail) {

            const sheet = document.getElementById('broker-sheet');
            const content = document.getElementById('broker-sheet-content');

            if (!sheet || !content) {
                return;
            }

            const brokerName = detail.brokerName ?? '';
            const officeName = detail.officeName ?? '';
            const addrRoad = detail.addrRoad ?? '';
            const addrJibun = detail.addrJibun ?? '';

            const tags = detail.top5.map(item => `
                <span class="bottom-sheet__tag ${item.cssClass}">
                    <span class="tag-label">${item.label}</span>&nbsp;
                    <span class="tag-count">${item.count}</span>
                </span>
            `).join(' ');

            const html = `
                <div class="bottom-sheet__header">
                    <div class="bottom-sheet__title">${officeName}</div>
                </div>
                <div class="bottom-sheet__tags">
                    ${tags}
                </div>
                <div class="bottom-sheet__addr">${addrJibun}</div>
                <div class="bottom-sheet__meta">
                    ${brokerName ? brokerName + ' 중개사' : ''}
                </div>

                <div class="bottom-sheet__buttons">
                    <button type="button" class="bottom-sheet__btn" onclick="alert('자세히 보기 개발 예정');">
                        자세히 보기
                    </button>
                    <button type="button" class="bottom-sheet__btn bottom-sheet__btn--primary" onclick="alert('매물 보내기 개발 예정');">
                        매물 보내기
                    </button>
                </div>
            `;

            openBrokerSheet(html);
        }

        function renderClusterSheet(brokers) {

            const sheet = document.getElementById('broker-sheet');
            const content = document.getElementById('broker-sheet-content');
            if (!sheet || !content) {
                return;
            }

            const totalCount = brokers.length;

            const itemsHtml = brokers.map(b => {
                const brokerName = b.brokerName ?? '';
                const officeName = b.officeName ?? '';
                const addrRoad = b.addrRoad ?? '';
                const addrJibun = b.addrJibun ?? '';
                const top5 = (b.top5 ?? []);

                const tags = top5.map(item => `
                    <span class="bottom-sheet__tag ${item.cssClass}">
                        <span class="tag-label">${item.label}</span>&nbsp;
                        <span class="tag-count">${item.count}</span>
                    </span>
                `).join(' ');

                return `
                    <div class="cluster-broker-item">
                        <div class="cluster-broker-item__title">${officeName}</div>
                        <div class="cluster-broker-item__meta">
                            ${brokerName ? brokerName + ' 중개사' : ''}<br/>
                            <span class="cluster-broker-item__addr">${addrJibun}</span>
                        </div>
                        <div class="cluster-broker-item__tags">
                            ${tags}
                        </div>
                    </div>
                `;
            }).join('');

            const html = `
                <div class="bottom-sheet__header">
                    <div class="bottom-sheet__title">
                        이 지역 중개사 ${totalCount}곳
                    </div>
                </div>
                <div class="bottom-sheet__cluster-list">
                    ${itemsHtml}
                </div>
            `;

            openBrokerSheet(html);
        }

        function openBrokerSheet(html) {

            const sheet = document.getElementById('broker-sheet');
            const content = document.getElementById('broker-sheet-content');
            if (!sheet || !content) {
                return;
            }

            content.innerHTML = html;

            // 초기 위치(아래로 숨기기)
            sheet.style.transform = 'translate(-50%, 100%)';

            // 다음 프레임에서 open 처리 (애니메이션 자연스럽게)
            requestAnimationFrame(() => {
                sheet.classList.add('open');
                sheet.style.transform = 'translate(-50%, 0)';
            });
        }

        // ================================================
        // 📌 바텀시트 드래그로 닫기
        // ================================================
        (function () {
            const sheet = document.getElementById('broker-sheet');

            if (!sheet) return;

            let startY = 0;          // 터치/마우스 시작 위치
            let currentY = 0;        // 현재 y 위치
            let sheetStartY = 0;     // 시트의 transform Y 값
            let dragging = false;    // 드래그 중 여부
            let threshold = 80;      // 이 값 이상 아래로 끌면 닫힘

            // 현재 translateY(px) 읽기
            function getTranslateY(el) {
                const style = window.getComputedStyle(el);
                const matrix = new WebKitCSSMatrix(style.transform);
                return matrix.m42; // translateY
            }

            function onDragStart(e) {
                dragging = true;
                sheet.classList.add('dragging');

                startY = e.touches ? e.touches[0].clientY : e.clientY;
                sheetStartY = getTranslateY(sheet);
            }

            function onDragMove(e) {
                if (!dragging) return;

                currentY = e.touches ? e.touches[0].clientY : e.clientY;
                const delta = currentY - startY;

                if (delta > 0) {
                    sheet.style.transform = `translate(-50%, ${delta}px)`;
                }
            }

            function onDragEnd() {
                if (!dragging) return;
                dragging = false;

                sheet.classList.remove('dragging');

                const delta = currentY - startY;

                if (delta > threshold) {
                    closeBrokerSheet();
                } else {
                    // 원래 위치로 복귀
                    sheet.style.transform = `translate(-50%, 0)`;
                }
            }

            /** 이벤트 바인딩 **/

            // 모바일 터치
            sheet.addEventListener('touchstart', onDragStart, { passive: true });
            sheet.addEventListener('touchmove', onDragMove, { passive: true });
            sheet.addEventListener('touchend', onDragEnd);

            // PC 마우스
            sheet.addEventListener('mousedown', onDragStart);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
        })();

        function closeBrokerSheet() {

            const sheet = document.getElementById('broker-sheet');
            const content = document.getElementById('broker-sheet-content');

            if (!sheet || !content) return;

            // 닫히는 애니메이션
            sheet.style.transform = 'translate(-50%, 100%)';

            setTimeout(() => {
                sheet.classList.remove('open');
                sheet.style.transform = '';
                content.innerHTML = '';

                content.innerHTML = '';

                // 선택 마커 원복
                if (selectedMarker) {
                    selectedMarker.setIcon(WHITE_ICON);
                    selectedMarker = null;
                }

                resetClusterIcons();
            }, 200);
        }

        function clearMarkersAndClusters() {

            if (markers && markers.length > 0) {
                markers.forEach(m => {
                    if (m) m.setMap(null);
                });
            }
            markers = [];

            if (markerClustering) {
                markerClustering.setMarkers([]);
            }
        }

        function resetClusterIcons() {
            const imgs = document.querySelectorAll('.usan-cluster__img');
            imgs.forEach(img => {
                img.src = '/img/marker-agency-white.png';
            });
        }

        window.onload = initMap;

    </script>

</section>
</body>
</html>
