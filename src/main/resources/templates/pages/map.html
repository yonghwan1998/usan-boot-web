<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/default :: layout(~{::title}, ~{::section})}">
<head>
    <title>우리 동네 부동산 지도</title>
</head>

<body>
<section>
    <script type="text/javascript"  th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId}"></script>
    <div class="main-content">
        <div id="map" style="width: 100%; height: 500px"></div>
    </div>

    <script>

        var mapOptions = {
            center: new naver.maps.LatLng(37.3595704, 127.105399),
            zoom: 10
        };

        var map = new naver.maps.Map('map', mapOptions);
    </script>
</section>
</body>
</html>
