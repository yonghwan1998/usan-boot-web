<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/default :: layout(~{::title}, ~{::section})}">
<head>
    <title>우리 동네 부동산 지도</title>
</head>

<body>
<section>
    <!-- 네이버 지도 API -->
    <script type="text/javascript" th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId}"></script>
    <script type="text/javascript" src="/js/MarkerClustering.js"></script>

    <!-- 지도 영역 -->
    <div class="main-content">
        <div id="map" style="width: 100%; height: 500px"></div>

        <!-- 내 위치 버튼 -->
        <button id="btn-my-location" class="map-button">내 위치</button>

        <!-- 선택된 중개사 바텀시트 -->
        <div id="broker-sheet" class="bottom-sheet">
            <div class="bottom-sheet__handle"></div>
            <div id="broker-sheet-content"></div>
        </div>
    </div>

    <!-- map control -->
    <script>

        let map;
        let markers = [];
        let markerClustering = null;
        let selectedClusterMarker = null;
        let selectedClusterKey = null;

        let myLocationMarker = null;

        let lastFetchId = 0;

        //[zoom 레벨(숫자가 클수록 zoom 확대)]
        //- 20 level: 10m
        //- 19 level: 20m
        //- 18 level: 30m
        //- 17 level: 50m
        //- 16 level: 100m
        //- 15 level: 300m
        //- 14 level: 500m
        //- 13 level: 1km
        //- 12 level: 3km
        //- 11 level: 5km
        //- 10 level: 10km
        //- 9  level: 20km
        //- 8  level: 30km

        //[zoom 단계 변수]
        //(ZOOM_INITIAL)    초기: 13 level (1km)
        //(ZOOM_MAX)        지도 최대: 19 level (20m)
        //(ZOOM_MARKER)     마커 보이기: 19 ~ 17 level (20m ~ 50m)
        //(ZOOM_CLUSTER)    클러스터 보이기: 16 ~ 15 level (100m ~ 300m)
        //(ZOOM_MYUNDONG)   읍면동 보이기: 14 ~ 13 level (500m ~ 1km)
        //(ZOOM_SIGUNGU)    시군구 보이기: 12 ~ 11 level (3km ~ 5km)
        //(ZOOM_SIDO)       시도 보이기: 10 ~ 8 level (10km ~ 30km)
        //(ZOOM_MIN)        지도 최소: 8 level (30km)
        const ZOOM_INITIAL = 13;
        const ZOOM_MAX = 19;
        const ZOOM_MARKER_MAX = 19;
        const ZOOM_MARKER_MIN = 17;
        const ZOOM_CLUSTER_MAX = 16;
        const ZOOM_CLUSTER_MIN = 15;
        const ZOOM_MYUNDONG_MAX = 14;
        const ZOOM_MYUNDONG_MIN = 13;
        const ZOOM_SIGUNGU_MAX = 12;
        const ZOOM_SIGUNGU_MIN = 11;
        const ZOOM_SIDO_MAX = 10;
        const ZOOM_SIDO_MIN = 8;
        const ZOOM_MIN = 8;

        function makeClusterKey(members) {
            return members
                .map(m => m.__brokerCode)
                .filter(Boolean)
                .sort()
                .join(',');
        }

        function updateClusterOptionsByZoom(zoom) {

            if (!markerClustering) {
                return;
            }

            let gridSize;

            if (zoom >= ZOOM_MARKER_MIN) {
                gridSize = 56;
            } else if (zoom >= ZOOM_CLUSTER_MIN) {
                gridSize = 120;
            } else if (zoom >= ZOOM_MYUNDONG_MIN) {
                gridSize = 180;
            } else if (zoom >= ZOOM_SIGUNGU_MIN) {
                gridSize = 240;
            } else {
                gridSize = 300;
            }

            markerClustering.setOptions({
                gridSize: gridSize,
            });
        }

        function initMap() {

            const center = new naver.maps.LatLng(33.464933, 126.530862);

            map = new naver.maps.Map('map', {
                center: center,
                zoom: ZOOM_INITIAL,
                maxZoom: ZOOM_MAX,
                mapTypeControl: true,
                zoomControl: true,
                zoomControlOptions: {
                    style: naver.maps.ZoomControlStyle.SMALL,
                    position: naver.maps.Position.TOP_LEFT
                },
            });

            markerClustering = new MarkerClustering({
                map: map,
                markers: [],
                minClusterSize: 1,
                maxZoom: 20,
                icons: [{
                    content: `
                        <div class="usan-cluster">
                            <img src="/img/marker-agency-white.png" class="usan-cluster__img" />
                            <span class="usan-cluster__count"></span>
                        </div>
                    `,
                    size: new naver.maps.Size(56, 56),
                    anchor: new naver.maps.Point(28, 56)
                }],
                indexGenerator: [1],
                stylingFunction: function(clusterMarker, count) {

                    const el = clusterMarker.getElement();
                    const span = el.querySelector('.usan-cluster__count');
                    const img = el.querySelector('.usan-cluster__img');

                    if (!el) return;

                    if (!span) return;
                    if (count <= 1) {
                        span.style.display = 'none';
                        span.textContent = '';
                    } else {
                        span.style.display = 'flex';
                        span.textContent = String(count);
                    }

                    if (!img) return;

                    const members = (typeof clusterMarker.getClusterMember === 'function')
                        ? clusterMarker.getClusterMember()
                        : [];

                    if (!members || members.length === 0) {
                        img.src = '/img/marker-agency-white.png';
                        return;
                    }

                    const key = makeClusterKey(members);

                    if (selectedClusterMarker && key === selectedClusterKey) {
                        img.src = '/img/marker-agency-orange.png';
                    } else {
                        img.src = '/img/marker-agency-white.png';
                    }
                }
            });

            updateClusterOptionsByZoom(map.getZoom());

            loadBrokersInBounds();

            naver.maps.Event.addListener(map, 'zoom_changed', function () {
                updateClusterOptionsByZoom(map.getZoom());
                closeBrokerSheet();
                loadBrokersInBounds();
            });

            naver.maps.Event.addListener(map, 'dragend', function () {

                const sheet = document.getElementById('broker-sheet');

                if (sheet && sheet.classList.contains('open')) {
                    closeBrokerSheet();
                }

                loadBrokersInBounds();
            });

            naver.maps.Event.addListener(map, 'click', function () {
                const sheet = document.getElementById('broker-sheet');
                if (!sheet) return;

                if (sheet.classList.contains('open')) {
                    closeBrokerSheet();
                }
            });

            naver.maps.Event.addListener(markerClustering, 'clusterclick', function(cluster, e) {
                onClusterClick(cluster);
            });

            document.getElementById('btn-my-location').addEventListener('click', goToMyLocation);
        }

        function loadBrokersInBounds() {

            const bounds = map.getBounds();
            if (!bounds) {
                return;
            }

            const zoom = map.getZoom();

            if (zoom <= ZOOM_MIN) {
                clearMarkersAndClusters();
                return;
            }

            const sw = bounds.getSW();
            const ne = bounds.getNE();

            const south = sw.lat();
            const north = ne.lat();
            const west = sw.lng();
            const east = ne.lng();

            const url = `/map/api/brokers?south=${south}&north=${north}&west=${west}&east=${east}`;

            const fetchId = ++lastFetchId;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (fetchId !== lastFetchId) {
                        return;
                    }

                    const currentZoom = map.getZoom();

                    if (currentZoom <= ZOOM_MIN) {
                        clearMarkersAndClusters();
                        return;
                    }

                    renderMarkers(data, currentZoom);
                })
                .catch(err => console.error('[MAP] fetch error:', err));
        }

        function renderMarkers(brokers, zoom) {

            markers = brokers.map(b => {
                const marker = new naver.maps.Marker({
                    position: new naver.maps.LatLng(b.lat, b.lng),
                    title: b.officeName
                });

                marker.__brokerCode = b.brokerCode;

                return marker;
            });

            if (markerClustering) {
                markerClustering.setMarkers(markers);

                naver.maps.Event.trigger(map, 'idle');
            }
        }

        async function onClusterClick(cluster) {

            const clusterMarker = cluster._clusterMarker;

            const members = cluster.getClusterMember() || [];

            let brokerCodes = members
                .map(m => m.__brokerCode)
                .filter(Boolean);

            if (!brokerCodes.length) {
                console.warn('[MAP] cluster has no brokerCodes')
                return;
            }

            selectedClusterKey = makeClusterKey(members);

            if (clusterMarker && typeof clusterMarker.getElement === 'function') {

                resetClusterIcons();

                const el = clusterMarker.getElement();
                if (el) {
                    const img = el.querySelector('.usan-cluster__img');

                    if (img) {
                        img.src = '/img/marker-agency-orange.png';
                        selectedClusterMarker = clusterMarker;
                    }
                }
            }

            try {
                const res = await fetch('/map/api/brokers/cluster', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        brokerCodes: brokerCodes
                    })
                });

                if (!res.ok) {
                    throw new Error('클러스터 중개사 조회 실패');
                }

                const list = await res.json();

                renderClusterSheet(list);
            } catch (e) {
                console.error(e);
            }
        }

        function renderClusterSheet(brokers) {

            const sheet = document.getElementById('broker-sheet');
            const content = document.getElementById('broker-sheet-content');
            if (!sheet || !content) {
                return;
            }

            const totalCount = brokers.length;

            const itemsHtml = brokers.map(b => {
                const brokerName = b.brokerName ?? '';
                const officeName = b.officeName ?? '';
                const addrRoad = b.addrRoad ?? '';
                const addrJibun = b.addrJibun ?? '';
                const top5 = (b.top5 ?? []);

                const tags = top5.map(item => `
                    <span class="bottom-sheet__tag ${item.cssClass}">
                        <span class="tag-label">${item.label}</span>&nbsp;
                        <span class="tag-count">${item.count}</span>
                    </span>
                `).join(' ');

                return `
                    <div class="cluster-broker-item">
                        <div class="cluster-broker-item__title">${officeName}</div>
                        <div class="cluster-broker-item__meta">
                            ${brokerName ? brokerName + ' 중개사' : ''}<br/>
                            <span class="cluster-broker-item__addr">${addrJibun}</span>
                        </div>
                        <div class="cluster-broker-item__tags">
                            ${tags}
                        </div>
                    </div>
                `;
            }).join('');

            const html = `
                <div class="bottom-sheet__header">
                    <div class="bottom-sheet__title">
                        이 지역 중개사 ${totalCount}곳
                    </div>
                </div>
                <div class="bottom-sheet__cluster-list">
                    ${itemsHtml}
                </div>
            `;

            openBrokerSheet(html);
        }

        function goToMyLocation() {
            if (!navigator.geolocation) {
                alert("현재 브라우저에서는 위치 정보를 사용할 수 없습니다.");
                return;
            }

            navigator.geolocation.getCurrentPosition(function (pos) {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const location = new naver.maps.LatLng(lat, lng);

                // 지도 중심 이동
                map.setCenter(location);
                map.setZoom(17);

                // 기존 마커 제거
                if (myLocationMarker) {
                    myLocationMarker.setMap(null);
                }

                // 내 위치 마커 찍기
                myLocationMarker = new naver.maps.Marker({
                    position: location,
                    map: map,
                    icon: {
                        content: `
                    <div style="
                        width:14px;
                        height:14px;
                        background:#4285f4;
                        border-radius:50%;
                        border:3px solid white;
                        box-shadow:0 0 6px rgba(0,0,0,0.3);
                    "></div>
                `,
                        anchor: new naver.maps.Point(7, 7)
                    }
                });

            }, function (err) {
                alert("위치 정보를 불러오지 못했습니다: " + err.message);
            });
        }

        function openBrokerSheet(html) {

            const sheet = document.getElementById('broker-sheet');
            const content = document.getElementById('broker-sheet-content');
            if (!sheet || !content) {
                return;
            }

            if (html) {
                content.innerHTML = html;
            }

            // 다음 프레임에서 open 처리 (애니메이션 자연스럽게)
            requestAnimationFrame(() => {
                sheet.classList.add('open');
                sheet.style.transform = 'translate(-50%, 0)';
            });
        }

        // ================================================
        // 📌 바텀시트 드래그로 닫기
        // ================================================
        (function () {
            const sheet = document.getElementById('broker-sheet');

            if (!sheet) return;

            let startY = 0;          // 터치/마우스 시작 위치
            let currentY = 0;        // 현재 y 위치
            let sheetStartY = 0;     // 시트의 transform Y 값
            let dragging = false;    // 드래그 중 여부
            let threshold = 80;      // 이 값 이상 아래로 끌면 닫힘

            // 현재 translateY(px) 읽기
            function getTranslateY(el) {
                const style = window.getComputedStyle(el);
                const matrix = new WebKitCSSMatrix(style.transform);
                return matrix.m42; // translateY
            }

            function onDragStart(e) {
                dragging = true;
                sheet.classList.add('dragging');

                startY = e.touches ? e.touches[0].clientY : e.clientY;
                sheetStartY = getTranslateY(sheet);
            }

            function onDragMove(e) {
                if (!dragging) return;

                currentY = e.touches ? e.touches[0].clientY : e.clientY;
                const delta = currentY - startY;

                if (delta > 0) {
                    sheet.style.transform = `translate(-50%, ${delta}px)`;
                }
            }

            function onDragEnd() {
                if (!dragging) return;
                dragging = false;

                sheet.classList.remove('dragging');

                const delta = currentY - startY;

                if (delta > threshold) {
                    sheet.style.transform = 'translate(-50%, calc(100% - 60px))';
                    sheet.classList.remove('open');
                } else {
                    sheet.style.transform = `translate(-50%, 0)`;
                }
            }

            /** 이벤트 바인딩 **/

            // 모바일 터치
            sheet.addEventListener('touchstart', onDragStart, { passive: true });
            sheet.addEventListener('touchmove', onDragMove, { passive: true });
            sheet.addEventListener('touchend', onDragEnd);

            // PC 마우스
            sheet.addEventListener('mousedown', onDragStart);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
        })();

        function closeBrokerSheet() {

            const sheet = document.getElementById('broker-sheet');
            const content = document.getElementById('broker-sheet-content');

            if (!sheet || !content) return;

            const hasContent = content.innerHTML.trim().length > 0;

            if (!hasContent) {
                return;
            }

            sheet.style.transform = 'translate(-50%, calc(100% - 60px))';
            sheet.classList.remove('open');
        }

        function clearMarkersAndClusters() {

            if (markers && markers.length > 0) {
                markers.forEach(m => {
                    if (m) m.setMap(null);
                });
            }
            markers = [];

            if (markerClustering) {
                markerClustering.setMarkers([]);
            }
        }

        function resetClusterIcons() {
            const imgs = document.querySelectorAll('.usan-cluster__img');
            imgs.forEach(img => {
                img.src = '/img/marker-agency-white.png';
            });
        }

        window.onload = initMap;

    </script>

</section>
</body>
</html>
