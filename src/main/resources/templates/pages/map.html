<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/default :: layout(~{::title}, ~{::section})}">
<head>
    <title>우리 동네 부동산 지도</title>
</head>

<body>
<section>
    <!-- 네이버 지도 API -->
    <script type="text/javascript" th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId}"></script>
    <script type="text/javascript" src="/js/MarkerClustering.js"></script>

    <!-- 지도 영역 -->
    <div class="main-content">
        <div id="map" style="width: 100%; height: 500px"></div>
    </div>

    <!-- map control -->
    <script>

        let map;
        let markers = [];
        let markerClustering = null;

        //'NONE' | 'CLUSTER' | 'MARKER'
        let currentViewMode = 'NONE';

        //줌 단계 규칙(규칙 수정 시 설명 부분도 수정 필요)
        //13 이상: 개별 마커만 보이기
        //11, 12: 클러스터만 보이기
        //10 이하: 아무것도 안 보이기
        const ZOOM_MARKER_ONLY = 13;
        const ZOOM_CLUSTER_MIN = 11;
        const ZOOM_CLUSTER_MAX = 12;
        const ZOOM_NONE_MAX = 10;

        function initMap() {

            const center = new naver.maps.LatLng(33.464933, 126.530862);

            map = new naver.maps.Map('map', {
                center: center,
                zoom: 13
            });

            markerClustering = new MarkerClustering({
                map: map,
                markers: [],
                gridSize: 100,
                minClusterSize: 1,
            });

            loadBrokersInBounds();

            naver.maps.Event.addListener(map, 'zoom_changed', function () {
                loadBrokersInBounds();
            });

            naver.maps.Event.addListener(map, 'dragend', function () {
                loadBrokersInBounds();
            });
        }

        function loadBrokersInBounds() {

            const bounds = map.getBounds();
            if(!bounds) {
                return;
            }

            const zoom = map.getZoom();

            if (zoom <= ZOOM_NONE_MAX) {
                if (currentViewMode !== 'NONE') {
                    clearMarkersAndClusters();
                    currentViewMode = 'NONE';
                }
                return;
            }

            const sw = bounds.getSW();
            const ne = bounds.getNE();

            const south = sw.lat();
            const north = ne.lat();
            const west = sw.lng();
            const east = ne.lng();

            const url = `/map/api/brokers?south=${south}&north=${north}&west=${west}&east=${east}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const currentZoom = map.getZoom();

                    //응답이 도착하기 전 줌 레벨이 변경될 경우를 재검증
                    if(currentZoom <= ZOOM_NONE_MAX) {
                        if (currentViewMode !== 'NONE') {
                            clearMarkersAndClusters();
                            currentViewMode = 'NONE';
                        }
                        return;
                    }

                    renderMarkers(data, currentZoom);
                })
                .catch(err => console.error(err));
        }

        function renderMarkers(brokers, zoom) {

            let nextMode;

            if (zoom >= ZOOM_MARKER_ONLY) {
                nextMode = 'MARKER';
            } else if(zoom >= ZOOM_CLUSTER_MIN && zoom <= ZOOM_CLUSTER_MAX) {
                nextMode = 'CLUSTER';
            } else {
                nextMode = 'NONE';
            }

            clearMarkersAndClusters();

            markers = brokers.map(b =>
                new naver.maps.Marker({
                    position: new naver.maps.LatLng(b.lat, b.lng),
                    icon: {
                        url: '/img/marker-agency.png',
                        size: new naver.maps.Size(56, 56),
                        scaledSize: new naver.maps.Size(56, 56),
                        origin: new naver.maps.Point(0, 0),
                        anchor: new naver.maps.Point(28, 56)
                    },
                    title: b.officeName
                })
            );

            if (nextMode === 'MARKER') {
                if (markerClustering) {
                    markerClustering.setMarkers([]);
                }

                markers.forEach(m => m.setMap(map));
            } else if(nextMode === 'CLUSTER') {
                markers.forEach(m => m.setMap(null));

                if (markerClustering) {
                    markerClustering.setMarkers(markers);

                    naver.maps.Event.trigger(map, 'idle');
                }
            } else {
                clearMarkersAndClusters();
            }

            currentViewMode = nextMode;
        }

        function clearMarkersAndClusters() {

            if (markers && markers.length > 0) {
                markers.forEach(m => {
                    if (m) m.setMap(null);
                });
            }
            markers = [];

            if (markerClustering) {
                markerClustering.setMarkers([]);
            }
        }

        window.onload = initMap;

    </script>

</section>
</body>
</html>
