<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">우리 동네 부동산 지도 | 우산</title>
</head>

<th:block th:fragment="pcSideContent"></th:block>

<th:block th:fragment="extraCss">
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" th:href="@{/css/broker.css(t=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/map.css(t=${#dates.createNow().time})}">
</th:block>

<section>
    <h1 class="sr-only">동네 부동산 지도</h1>
    <!-- 네이버 지도 API -->
    <script type="text/javascript" th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId}"></script>
    <script type="text/javascript" src="/js/MarkerClustering.js"></script>

    <!-- 지도 영역 -->
    <div class="main-content">
        <div id="map" class="map"></div>

        <!-- 지도 UI 오버레이 -->
        <div class="map-ui">

            <div class="map-ui__top">
                <div class="map-search">
                    <button class="map-temp__btn map-temp__btn--temp" type="button" aria-label="검색" th:onclick="|location.href='@{/}'|"></button>
<!--                    <button class="map-search__btn map-search__btn&#45;&#45;search" type="button" aria-label="검색"></button>// TODO(yongss): 추후 복구(해당 줄 복사하여 전체 롤백)-->
<!--                    <input class="map-search__input" type="text" placeholder="주소 검색" />// TODO(yongss): 추후 복구(해당 줄 복사하여 전체 롤백)-->
                    <div class="map-temp__input">우리 동네 부동산, 우산 ☂️</div>
                </div>

                <button class="map-icon-btn" type="button" aria-label="알림">
                    <span class="map-icon--bell"></span>
                </button>
            </div>

            <div class="map-ui__chips">
                <button class="map-chip" id="btn-my-location" type="button">
                    <span class="map-icon--gps"></span>
                    <span class="map-chip__my-location">내 위치</span>
                </button>
            </div>

            <div class="map-ui__right-bottom">
                <div class="map-zoom">
                    <button type="button" class="map-zoom__btn" id="zoomIn" aria-label="줌인">
                        <span class="map-icon--zoom-in"></span>
                    </button>
                    <button type="button" class="map-zoom__btn" id="zoomOut" aria-label="줌아웃">
                        <span class="map-icon--zoom-out"></span>
                    </button>
                </div>

                <div class="map-send-wrapper">
                    <button th:onclick="|location.href='@{/map/listings/share}'|" class="map-send" type="button" aria-label="매물 보내기">
                        <span class="map-icon--send"></span>
                        <span class="map-send__text">매물 보내기</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- 행정구역 정보 바텀시트 -->
        <div id="info-sheet" class="bottom-sheet">

            <div class="bottom-sheet__handle-wrapper">
                <div class="bottom-sheet__handle"></div>
            </div>

            <div class="bottom-sheet__contents-wrapper">

                <div class="bottom-sheet__options">
                    <div class="bottom-sheet-btn__distance">필터</div>
                    <div class="bottom-sheet-toggle__wrapper">
                        <span class="bottom-sheet-txt">중개사</span>
                        <span class="bottom-sheet-txt is-selected">정보</span>
                    </div>
                </div>

                <div class="bottom-sheet__line"></div>

                <div class="info-sheet__region-tabs" id="info-sheet-tabs"></div>

                <div id="info-sheet-content"></div>
            </div>
        </div>

        <!-- 선택된 중개사 바텀시트 -->
        <div id="broker-sheet" class="bottom-sheet">

            <div class="bottom-sheet__handle-wrapper">
                <div class="bottom-sheet__handle"></div>
            </div>

            <div class="bottom-sheet__contents-wrapper">

                <div class="bottom-sheet__options">
                    <div class="bottom-sheet-btn__distance">필터</div>
                    <div class="bottom-sheet-toggle__wrapper">
                        <span class="bottom-sheet-txt is-selected">중개사</span>
                        <span class="bottom-sheet-txt">정보</span>
                    </div>
                </div>

                <div class="bottom-sheet__line"></div>

                <div id="broker-sheet-content"></div>
            </div>
        </div>

        <!-- 거리 필터 모달 -->
        <div id="filter-modal-overlay" class="filter-modal-overlay">
            <div class="filter-modal">
                <div class="filter-modal__title">필터</div>

                <hr class="filter-modal__hr">

                <div class="filter-modal__section">

                    <div class="filter-modal__section--distance">
                        <div class="filter-modal__section-title">거리 선택</div>
                        <div class="filter-modal__chips">
                            <button type="button" class="filter-chip__distance" data-distance="100">100m</button>
                            <button type="button" class="filter-chip__distance" data-distance="300">300m</button>
                            <button type="button" class="filter-chip__distance" data-distance="500">500m</button>
                            <button type="button" class="filter-chip__distance" data-distance="1000">1km</button>
                        </div>
                    </div>

                </div>

                <div class="filter-modal__footer">
                    <button type="button" class="filter-modal__btn filter-modal__btn--cancel" id="filterModalCancel">취소</button>
                    <button type="button" class="filter-modal__btn filter-modal__btn--apply" id="filterModalApply">적용</button>
                </div>
            </div>
        </div>

        <!-- 중개사 자세히 보기 시트 -->
        <div id="broker-detail-sheet" class="broker-detail-sheet">

            <div class="broker-detail-sheet__header">
                <button type="button" class="broker-detail-sheet__close" id="brokerDetailClose" aria-label="닫기"></button>
                <span class="broker-detail-sheet__title">자세히 보기</span>
                <button type="button" class="broker-detail-sheet__heart" aria-label="찜하기"></button>
            </div>

            <div class="broker-detail-sheet__body" id="brokerDetailBody">
                <!-- JS로 동적 렌더링 -->
            </div>

            <div class="broker-detail-sheet__footer">
                <button type="button" class="action-btn action-btn--call" id="brokerDetailCall" aria-label="전화하기">
                    <span class="action-btn__icon action-btn__icon--call"></span>
                </button>
                <button type="button" class="action-btn action-btn--send" id="brokerDetailSend">
                    <span class="action-btn__icon action-btn__icon--send" aria-hidden="true"></span>
                    <span class="action-btn__text">매물 보내기</span>
                </button>
            </div>

        </div>

    </div>

    <!-- map control -->
    <script>

        let map;

        let lastFetchId = 0;

        //[zoom 레벨(숫자가 클수록 zoom 확대)]
        //- 20 level: 10m
        //- 19 level: 20m
        //- 18 level: 30m
        //- 17 level: 50m
        //- 16 level: 100m
        //- 15 level: 300m
        //- 14 level: 500m
        //- 13 level: 1km
        //- 12 level: 3km
        //- 11 level: 5km
        //- 10 level: 10km
        //- 9  level: 20km
        //- 8  level: 30km

        //[zoom 단계 변수]
        //(ZOOM_INITIAL)    초기: 13 level (1km)
        //(ZOOM_MAX)        지도 최대: 19 level (20m)
        //(ZOOM_MARKER)     마커 보이기: 19 ~ 17 level (20m ~ 50m)
        //(ZOOM_CLUSTER)    클러스터 보이기: 16 ~ 15 level (100m ~ 300m)
        //(ZOOM_EMD)        읍면동 보이기: 14 ~ 13 level (500m ~ 1km)
        //(ZOOM_SIGUNGU)    시군구 보이기: 12 ~ 11 level (3km ~ 5km)
        //(ZOOM_SIDO)       시도 보이기: 10 ~ 8 level (10km ~ 30km)
        //(ZOOM_MIN)        지도 최소: 8 level (30km)
        const ZOOM_INITIAL = 13;
        const ZOOM_MAX = 19;
        const ZOOM_MARKER_MAX = 19;
        const ZOOM_MARKER_MIN = 17;
        const ZOOM_CLUSTER_MAX = 16;
        const ZOOM_CLUSTER_MIN = 15;
        const ZOOM_EMD_MAX = 14;
        const ZOOM_EMD_MIN = 13;
        const ZOOM_SIGUNGU_MAX = 12;
        const ZOOM_SIGUNGU_MIN = 11;
        const ZOOM_SIDO_MAX = 10;
        const ZOOM_SIDO_MIN = 8;
        const ZOOM_MIN = 8;


        async function initMap() {
            let lat = 37.201429248;
            let lng = 127.095487163;

            const center = new naver.maps.LatLng(lat, lng);

            map = new naver.maps.Map('map', {
                center:  center,
                zoom: ZOOM_INITIAL,
                maxZoom: ZOOM_MAX,
                zoomControl: false,
            });

            loadBrokersInBounds();

            naver.maps.Event.addListener(map, 'zoom_changed', function () {
                loadBrokersInBounds();
            });

            naver.maps.Event.addListener(map, 'dragend', function () {
                loadBrokersInBounds();
            });

        }

        function loadBrokersInBounds() {

            const bounds = map.getBounds();
            if (!bounds) return;

            const zoom = map.getZoom();

            // 행정경계만 보여야 하는 구간
            // if (zoom < ZOOM_CLUSTER_MIN) {
            //     clearMarkersAndClusters();
            //     return;
            // }

            const sw = bounds.getSW();
            const ne = bounds.getNE();

            const south = sw.lat();
            const north = ne.lat();
            const west = sw.lng();
            const east = ne.lng();

            const url = `/map/api/brokers?south=${south}&north=${north}&west=${west}&east=${east}`;

            const fetchId = ++lastFetchId;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (fetchId !== lastFetchId) return;

                    const currentZoom = map.getZoom();

                    // if (currentZoom < ZOOM_CLUSTER_MIN) {
                    //     clearMarkersAndClusters();
                    //     return;
                    // }

                    // renderMarkers(data, currentZoom);
                })
                .catch(err => console.error('[MAP] fetch error:', err));
        }

        window.onload = initMap;

    </script>

    <!-- iOS Safari pull-to-refresh 방지 -->
    <script>
        (function () {
            let touchStartY = 0;

            document.addEventListener('touchstart', function (e) {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            document.addEventListener('touchmove', function (e) {
                const scrollable = e.target.closest(
                    '#broker-sheet-content, .broker-detail-sheet__body, .full-panel'
                );

                if (scrollable) {
                    const swipingDown = e.touches[0].clientY > touchStartY;
                    // 최상단에서 아래로 당길 때만 차단 (pull-to-refresh 방지)
                    if (swipingDown && scrollable.scrollTop <= 0) {
                        if (e.cancelable) e.preventDefault();
                    }
                    return;
                }

                // 스크롤 영역 밖(지도, 핸들 등)은 모두 차단
                if (e.cancelable) e.preventDefault();
            }, { passive: false });
        })();
    </script>

</section>
</html>
