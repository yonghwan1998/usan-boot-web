<!-- ✅ pages/map/map-listings-share.html (그대로 갈아끼우기) -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">우리 동네 부동산 지도</title>
</head>

<th:block th:fragment="pcSideContent"></th:block>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/map.css(t=${#dates.createNow().time})}">
</th:block>

<section>
    <!-- 네이버 지도 API -->
    <script type="text/javascript"
            th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId} + '&submodules=gl'"></script>
    <script type="text/javascript" src="/js/MarkerClustering.js"></script>

    <div class="main-content">

        <div class="common-header listing-header">
            <button class="common-header__back" th:onclick="history.back()"></button>
            <div class="common-header__title">매물 보내기</div>
            <div class="common-header__right"></div>
        </div>

        <div id="map" class="map"></div>

        <!-- ✅ SEND SHEET: 접힘 상태에서 지도 클릭 가능(pointer-events) + 중앙 정렬 -->
        <div id="broker-sheet" class="send-sheet">
            <!-- ✅ 접히는 영역(드래그로 열고/닫는 본체) -->
            <div class="send-sheet__collapse">
                <div class="send-sheet__handle-area">
                    <div class="send-sheet__handle"></div>
                </div>

                <div class="send-sheet__body">
                    <button type="button" class="send-sheet__listing-select">
            <span class="send-sheet__listing-left">
              <span class="send-sheet__listing-label">매물 1</span>
              <span class="send-sheet__listing-sep">|</span>
              <span class="send-sheet__listing-title">우산갤러리아아파트</span>
            </span>
                        <span class="send-sheet__chev" aria-hidden="true"></span>
                    </button>

                    <div class="send-sheet__options">
                        <label class="send-sheet__check">
                            <input type="checkbox" checked>
                            <span class="send-sheet__check-ui" aria-hidden="true"></span>
                            <span class="send-sheet__check-text">중개사 전체 선택</span>
                        </label>

                        <button type="button" class="send-sheet__filter">
                            <span class="send-sheet__filter-icon" aria-hidden="true"></span>
                            <span class="send-sheet__filter-text">필터</span>
                        </button>
                    </div>

                    <div class="send-sheet__hint">
                        매물 1 기준으로 <b>100m</b> 이내에 <b>18명</b>의 중개사가 있습니다.
                    </div>

                    <!-- 스크롤 리스트 -->
                    <div class="send-sheet__list" id="broker-sheet-content"></div>
                </div>
            </div>

            <!-- ✅ CTA는 항상 보이게(접히지 않음) -->
            <div class="send-sheet__cta">
                <button type="button" class="send-sheet__send-btn">
                    <span class="send-sheet__send-icon" aria-hidden="true"></span>
                    <span>3개의 중개사에게 매물 보내기</span>
                </button>
            </div>
        </div>

    </div>

    <!-- ✅ MAP + CLUSTER + SHEET OPEN/CLOSE -->
    <script th:inline="javascript">
        let map;
        let markers = [];
        let markerClustering = null;
        let selectedClusterMarker = null;
        let selectedClusterKey = null;

        let myLocationMarker = null;
        let lastFetchId = 0;

        const ZOOM_INITIAL = 13;
        const ZOOM_MAX = 19;
        const ZOOM_MARKER_MIN = 17;
        const ZOOM_CLUSTER_MIN = 15;
        const ZOOM_EMD_MIN = 13;
        const ZOOM_SIGUNGU_MIN = 11;
        const ZOOM_MIN = 8;

        function makeClusterKey(members) {
            return members
                .map(m => m.__brokerCode)
                .filter(Boolean)
                .sort()
                .join(',');
        }

        function updateClusterOptionsByZoom(zoom) {
            if (!markerClustering) return;

            let gridSize;
            if (zoom >= ZOOM_MARKER_MIN) gridSize = 56;
            else if (zoom >= ZOOM_CLUSTER_MIN) gridSize = 120;
            else if (zoom >= ZOOM_EMD_MIN) gridSize = 180;
            else if (zoom >= ZOOM_SIGUNGU_MIN) gridSize = 240;
            else gridSize = 300;

            markerClustering.setOptions({ gridSize });
        }

        function initMap() {
            const center = new naver.maps.LatLng(33.464933, 126.530862);
            const NAVER_DARK_THEME_ID = /*[[${naverDarkThemeId}]]*/ '';

            map = new naver.maps.Map('map', {
                gl: true,
                center: center,
                zoom: ZOOM_INITIAL,
                maxZoom: ZOOM_MAX,
                customStyleId: NAVER_DARK_THEME_ID,
                mapTypeControl: true,
                zoomControl: true,
                zoomControlOptions: {
                    style: naver.maps.ZoomControlStyle.SMALL,
                    position: naver.maps.Position.TOP_LEFT
                },
            });

            markerClustering = new MarkerClustering({
                map: map,
                markers: [],
                minClusterSize: 1,
                maxZoom: 20,
                icons: [{
                    content: `
            <div class="usan-cluster">
              <img src="/img/marker-agency-white.png" class="usan-cluster__img" />
              <span class="usan-cluster__count"></span>
            </div>
          `,
                    size: new naver.maps.Size(56, 56),
                    anchor: new naver.maps.Point(28, 56)
                }],
                indexGenerator: [1],
                stylingFunction: function (clusterMarker, count) {
                    const el = clusterMarker.getElement();
                    if (!el) return;

                    const span = el.querySelector('.usan-cluster__count');
                    const img = el.querySelector('.usan-cluster__img');

                    if (span) {
                        if (count <= 1) {
                            span.style.display = 'none';
                            span.textContent = '';
                        } else {
                            span.style.display = 'flex';
                            span.textContent = String(count);
                        }
                    }

                    if (!img) return;

                    const members = (typeof clusterMarker.getClusterMember === 'function')
                        ? clusterMarker.getClusterMember()
                        : [];

                    if (!members || members.length === 0) {
                        img.src = '/img/marker-agency-white.png';
                        return;
                    }

                    const key = makeClusterKey(members);
                    img.src = (selectedClusterMarker && key === selectedClusterKey)
                        ? '/img/marker-agency-orange.png'
                        : '/img/marker-agency-white.png';
                }
            });

            updateClusterOptionsByZoom(map.getZoom());
            loadBrokersInBounds();

            naver.maps.Event.addListener(map, 'zoom_changed', function () {
                updateClusterOptionsByZoom(map.getZoom());
                if (window.closeSendSheet) window.closeSendSheet();
                loadBrokersInBounds();
            });

            naver.maps.Event.addListener(map, 'dragend', function () {
                const sheet = document.getElementById('broker-sheet');
                if (sheet && sheet.classList.contains('is-open')) {
                    if (window.closeSendSheet) window.closeSendSheet();
                }
                loadBrokersInBounds();
            });

            // ✅ 시트가 "접힘"이면 지도 클릭을 막지 않음 (CSS pointer-events로 해결됨)
            naver.maps.Event.addListener(map, 'click', function () {
                const sheet = document.getElementById('broker-sheet');
                if (!sheet) return;

                if (sheet.classList.contains('is-open')) {
                    if (window.closeSendSheet) window.closeSendSheet();
                }
            });

            naver.maps.Event.addListener(markerClustering, 'clusterclick', function (cluster) {
                onClusterClick(cluster);
            });
        }

        function loadBrokersInBounds() {
            const bounds = map.getBounds();
            if (!bounds) return;

            const zoom = map.getZoom();
            if (zoom <= ZOOM_MIN) {
                clearMarkersAndClusters();
                return;
            }

            const sw = bounds.getSW();
            const ne = bounds.getNE();

            const south = sw.lat();
            const north = ne.lat();
            const west = sw.lng();
            const east = ne.lng();

            const url = `/map/api/brokers?south=${south}&north=${north}&west=${west}&east=${east}`;
            const fetchId = ++lastFetchId;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (fetchId !== lastFetchId) return;

                    const currentZoom = map.getZoom();
                    if (currentZoom <= ZOOM_MIN) {
                        clearMarkersAndClusters();
                        return;
                    }
                    renderMarkers(data);
                })
                .catch(err => console.error('[MAP] fetch error:', err));
        }

        function renderMarkers(brokers) {
            markers = brokers.map(b => {
                const marker = new naver.maps.Marker({
                    position: new naver.maps.LatLng(b.lat, b.lng),
                    title: b.officeName
                });
                marker.__brokerCode = b.brokerCode;
                return marker;
            });

            if (markerClustering) {
                markerClustering.setMarkers(markers);
                naver.maps.Event.trigger(map, 'idle');
            }
        }

        async function onClusterClick(cluster) {
            const clusterMarker = cluster._clusterMarker;
            const members = cluster.getClusterMember() || [];

            const brokerCodes = members.map(m => m.__brokerCode).filter(Boolean);
            if (!brokerCodes.length) return;

            selectedClusterKey = makeClusterKey(members);

            if (clusterMarker && typeof clusterMarker.getElement === 'function') {
                resetClusterIcons();
                const el = clusterMarker.getElement();
                if (el) {
                    const img = el.querySelector('.usan-cluster__img');
                    if (img) {
                        img.src = '/img/marker-agency-orange.png';
                        selectedClusterMarker = clusterMarker;
                    }
                }
            }

            try {
                const res = await fetch('/map/api/brokers/cluster', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brokerCodes })
                });

                if (!res.ok) throw new Error('클러스터 중개사 조회 실패');
                const list = await res.json();
                renderClusterSheet(list);
            } catch (e) {
                console.error(e);
            }
        }

        function renderClusterSheet(brokers) {
            const content = document.getElementById('broker-sheet-content');
            if (!content) return;

            const totalCount = brokers.length;

            const itemsHtml = brokers.map(b => {
                const officeName = b.officeName ?? '';
                const addrJibun = b.addrJibun ?? '';
                const top5 = (b.top5 ?? []);

                // item.cssClass 그대로 쓰고 싶으면 서버에서 send-tag--apt 같은 값을 내려주면 됨
                const tags = top5.map(item => `
          <span class="send-tag ${item.cssClass}">
            ${item.label}<b>${item.count}</b>
          </span>
        `).join('');

                return `
          <div class="send-broker">
            <label class="send-broker__row">
              <input type="checkbox" class="send-broker__checkbox" checked>
              <span class="send-broker__check-ui"></span>

              <div class="send-broker__info">
                <div class="send-broker__name">${officeName}</div>
                <div class="send-broker__tags">${tags}</div>
                <div class="send-broker__addr">${addrJibun}</div>
              </div>

              <div class="send-broker__thumb"></div>
            </label>
          </div>
        `;
            }).join('');

            content.innerHTML = `
        <div class="send-sheet__section-title">이 지역 중개사 ${totalCount}곳</div>
        ${itemsHtml}
      `;

            if (window.openSendSheet) window.openSendSheet();
        }

        function clearMarkersAndClusters() {
            if (markers && markers.length > 0) {
                markers.forEach(m => { if (m) m.setMap(null); });
            }
            markers = [];
            if (markerClustering) markerClustering.setMarkers([]);
        }

        function resetClusterIcons() {
            const imgs = document.querySelectorAll('.usan-cluster__img');
            imgs.forEach(img => { img.src = '/img/marker-agency-white.png'; });
        }

        window.onload = initMap;
    </script>

    <!-- ✅ SEND SHEET DRAG (이거 하나만 쓰기) -->
    <script>
        (function () {
            const sheet = document.getElementById('broker-sheet');
            if (!sheet) return;

            const collapse = sheet.querySelector('.send-sheet__collapse');
            const handleArea = sheet.querySelector('.send-sheet__handle-area');
            if (!collapse || !handleArea) return;

            let startY = 0;
            let currentY = 0;
            let dragging = false;

            const THRESHOLD_OPEN = 80;
            const THRESHOLD_CLOSE = 120;

            function isOpen() { return sheet.classList.contains('is-open'); }

            function openSheet() {
                sheet.classList.add('is-open');
                collapse.style.transform = 'translateY(0)';
            }

            function closeSheet() {
                sheet.classList.remove('is-open');
                collapse.style.transform = 'translateY(calc(100% - 60px))';
            }

            closeSheet();

            function onStart(e) {
                dragging = true;
                sheet.classList.add('is-dragging');
                startY = (e.touches ? e.touches[0].clientY : e.clientY);
                currentY = startY;
            }

            function onMove(e) {
                if (!dragging) return;
                currentY = (e.touches ? e.touches[0].clientY : e.clientY);
                const delta = currentY - startY;

                if (isOpen()) {
                    if (delta > 0) collapse.style.transform = `translateY(${delta}px)`;
                } else {
                    if (delta < 0) collapse.style.transform = `translateY(calc(100% - 60px + ${delta}px))`;
                }
            }

            function onEnd() {
                if (!dragging) return;
                dragging = false;
                sheet.classList.remove('is-dragging');

                const delta = currentY - startY;

                if (isOpen()) {
                    if (delta > THRESHOLD_CLOSE) closeSheet();
                    else openSheet();
                } else {
                    if (-delta > THRESHOLD_OPEN) openSheet();
                    else closeSheet();
                }
            }

            handleArea.addEventListener('touchstart', onStart, { passive: true });
            handleArea.addEventListener('touchmove', onMove, { passive: true });
            handleArea.addEventListener('touchend', onEnd);

            handleArea.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            window.openSendSheet = openSheet;
            window.closeSendSheet = closeSheet;
        })();
    </script>

</section>
</html>
