<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">매물 보내기 | 우산</title>
</head>

<th:block th:fragment="pcSideContent"></th:block>

<th:block th:fragment="extraCss">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/map.css(t=${#dates.createNow().time})}">
</th:block>

<section>
    <script type="text/javascript"
            th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId} + '&submodules=gl'"></script>

    <div class="main-content">

        <div id="map" class="map"></div>

        <div class="map-ui">
            <div class="common-header map-header">
                <button class="common-header__back" onclick="history.back()"></button>
                <h1 class="common-header__title">매물 보내기</h1>
                <div class="common-header__right"></div>
            </div>

            <button type="button" class="map-ui__open-btn" id="open-sheet-btn">
                열기
            </button>
        </div>

        <!-- 바텀시트 -->
        <div id="broker-sheet" class="send-sheet">

            <div class="send-sheet__collapse">
                <div class="send-sheet__handle-area">
                    <div class="send-sheet__handle"></div>
                </div>

                <div class="send-sheet__listing-area">
                    <div class="common-select" id="listing-select">
                        <div class="common-input-wrapper">
                            <button type="button"
                                    class="common-input common-select__input"
                                    id="listing-select-btn"
                                    aria-haspopup="listbox">
                                <span class="send-sheet__listing-left">
                                    <span class="send-sheet__listing-label" id="listing-label-text">매물 선택</span>
                                    <span class="send-sheet__listing-sep" id="listing-sep" style="display:none">|</span>
                                    <span class="send-sheet__listing-title" id="listing-title-text"></span>
                                </span>
                            </button>
                            <span class="common-input-btn common-input__expand-btn" aria-hidden="true"></span>
                            <ul class="common-select__options pointer" id="listing-options" role="listbox"></ul>
                        </div>
                    </div>
                </div>

                <div class="send-sheet__body">
                    <div class="send-sheet__options">
                        <label class="send-sheet__check">
                            <input type="checkbox" id="select-all-checkbox">
                            <span class="send-sheet__check-ui" aria-hidden="true"></span>
                            <span class="send-sheet__check-text">중개사 전체 선택</span>
                        </label>
                        <button type="button" class="send-sheet__filter">
                            <span class="send-sheet__filter-icon" aria-hidden="true"></span>
                            <span class="send-sheet__filter-text">필터</span>
                        </button>
                    </div>

                    <div class="send-sheet__hint" id="broker-hint" style="display:none"></div>

                    <div class="send-sheet__list" id="send-sheet-content">
                        <p class="send-sheet__empty-msg">지도에서 중개사 마커를 선택하면<br>목록이 표시됩니다.</p>
                    </div>
                </div>

                <div class="send-sheet__cta">
                    <button type="button" id="send-btn" class="send-sheet__send-btn" disabled>
                        <span class="send-sheet__send-icon" aria-hidden="true"></span>
                        <span id="send-btn-text" class="send-sheet__send-text">중개사를 선택해주세요</span>
                    </button>
                </div>
            </div>

        </div>

        <div id="filter-modal-overlay" class="filter-modal-overlay">
            <div class="filter-modal">
                <div class="filter-modal__title">필터</div>

                <hr class="filter-modal__hr">

                <div class="filter-modal__section">

                    <div class="filter-modal__section--distance">
                        <div class="filter-modal__section-title">거리 선택</div>
                        <div class="filter-modal__chips">
                            <button type="button" class="filter-chip__distance" data-distance="100">100m</button>
                            <button type="button" class="filter-chip__distance" data-distance="300">300m</button>
                            <button type="button" class="filter-chip__distance" data-distance="500">500m</button>
                            <button type="button" class="filter-chip__distance" data-distance="1000">1km</button>
                        </div>
                    </div>

                    <div class="filter-modal__section--type">
                        <div class="filter-modal__section-title">매물 타입</div>
                        <div class="filter-modal__chips">
                            <button type="button" class="filter-chip__type" data-type="아파트">아파트</button>
                            <button type="button" class="filter-chip__type" data-type="오피스텔">오피스텔</button>
                            <button type="button" class="filter-chip__type" data-type="빌라/연립">빌라/연립</button>
                            <button type="button" class="filter-chip__type" data-type="원룸">원룸</button>
                            <button type="button" class="filter-chip__type" data-type="투룸">투룸</button>
                            <button type="button" class="filter-chip__type" data-type="단독/다가구">단독/다가구</button>
                            <button type="button" class="filter-chip__type" data-type="전원주택">전원주택</button>
                            <button type="button" class="filter-chip__type" data-type="상가주택">상가주택</button>
                            <button type="button" class="filter-chip__type" data-type="한옥주택">한옥주택</button>
                            <button type="button" class="filter-chip__type" data-type="상가">상가</button>
                            <button type="button" class="filter-chip__type" data-type="사무실">사무실</button>
                            <button type="button" class="filter-chip__type" data-type="건물">건물</button>
                            <button type="button" class="filter-chip__type" data-type="공장/창고">공장/창고</button>
                            <button type="button" class="filter-chip__type" data-type="지식산업센터">지식산업센터</button>
                            <button type="button" class="filter-chip__type" data-type="토지">토지</button>
                            <button type="button" class="filter-chip__type" data-type="아파트분양권">아파트분양권</button>
                            <button type="button" class="filter-chip__type" data-type="오피스텔분양권">오피스텔분양권</button>
                            <button type="button" class="filter-chip__type" data-type="재개발">재개발</button>
                            <button type="button" class="filter-chip__type" data-type="재건축">재건축</button>
                            <button type="button" class="filter-chip__type" data-type="분양중/예정">분양중/예정</button>
                        </div>
                    </div>

                </div>

                <div class="filter-modal__footer">
                    <button type="button" class="filter-modal__btn filter-modal__btn--cancel" id="filterModalCancel">취소</button>
                    <button type="button" class="filter-modal__btn filter-modal__btn--apply" id="filterModalApply">적용</button>
                </div>
            </div>
        </div>

    </div>

    <!-- =============================================
         JS 1: 상태 관리 / 매물 / 보내기
    ============================================== -->
    <script th:inline="javascript">

        let myListings              = [];
        let selectedListing         = null;
        let selectedDistanceM       = null;
        let selectedListingTypes    = new Set();
        let lastFetchedBrokerCodes  = [];
        const selectedBrokers       = new Map();

        /* ---- 내 매물 로드 ---- */
        async function loadMyListings() {
            try {
                const res = await fetch('/map/api/listings/my-listings');

                if (res.status === 401) {
                    location.href = '/login';
                    return;
                }
                if (!res.ok) throw new Error('매물 목록을 불러올 수 없습니다.');

                myListings = await res.json();
                renderListingOptions();
                if (!myListings.length) { updateCtaInfo(); return; }

                const paramId = new URLSearchParams(location.search).get('listingId');
                const target  = myListings.find(l => String(l.listingId) === paramId) ?? myListings[0];
                selectListing(target);
            } catch (e) {
                console.error('[MY-LISTINGS]', e);
            }
        }

        async function resolveInitialCenter() {
            // 1순위: 가장 최근 ACTIVE 매물
            try {
                const res = await fetch('/map/api/listings/my-listings');
                if (res.ok) {
                    const listings = await res.json();
                    const paramId  = new URLSearchParams(location.search).get('listingId');
                    const target   = listings.find(l => String(l.listingId) === paramId) ?? listings[0];
                    if (target?.lat && target?.lng) return { lat: target.lat, lng: target.lng };
                }
            } catch {}

            // 2순위: user_region
            try {
                const res = await fetch('/map/api/user-region');
                if (res.ok) {
                    const region = await res.json();
                    if (region?.lat && region?.lng) return { lat: region.lat, lng: region.lng };
                }
            } catch {}

            // 3순위: 기본 좌표
            return { lat: 33.464933, lng: 126.530862 };
        }

        function selectListing(listing) {
            selectedListing = listing;
            const label = document.getElementById('listing-label-text');
            const sep   = document.getElementById('listing-sep');
            const title = document.getElementById('listing-title-text');
            if (!listing) {
                label.textContent = '매물 선택';
                sep.style.display = 'none';
                title.textContent = '';
            } else {
                label.textContent = `매물 ${myListings.indexOf(listing) + 1}`;
                sep.style.display = '';
                title.textContent = listing.addressName;
            }
            updateCtaInfo();
            if (typeof renderListingMarkers === 'function') renderListingMarkers();
            if (listing?.lat && listing?.lng && typeof map !== 'undefined') {
                map.panTo(new naver.maps.LatLng(listing.lat, listing.lng));
            }
        }

        function updateCtaInfo() {
            const cnt     = selectedBrokers.size;
            const btn     = document.getElementById('send-btn');
            const btnText = document.getElementById('send-btn-text');
            const canSend = selectedListing !== null && cnt > 0;
            btn.disabled  = !canSend;
            btnText.textContent = canSend
                ? `${cnt}명의 중개사에게 매물 보내기`
                : cnt > 0 ? '매물을 선택해주세요' : '중개사를 선택해주세요';
        }

        /* ---- 매물 드롭다운 렌더링 ---- */
        function renderListingOptions() {
            const ul = document.getElementById('listing-options');
            if (!ul) return;
            ul.innerHTML = myListings.length === 0
                ? '<li class="send-sheet__no-listing">등록된 매물이 없습니다.</li>'
                : myListings.map((l, i) => {
                    return `<li data-id="${l.listingId}" role="option">
                                <span class="bold">매물 ${i + 1}</span>
                                <span class="send-sheet__listing-list">${l.addressName}</span>
                            </li>`;
                }).join('');

            ul.querySelectorAll('li[data-id]').forEach(li => {
                li.addEventListener('click', e => {
                    e.stopPropagation(); // listing-select 핸들러로 버블링 방지
                    const found = myListings.find(l => l.listingId === Number(li.dataset.id));
                    if (found) {
                        selectListing(found);
                        document.getElementById('listing-select')?.classList.remove('is-open');
                    }
                });
            });
        }

        /* ---- 중개사 전체선택 ---- */
        function bindSelectAll() {
            document.getElementById('select-all-checkbox')?.addEventListener('change', e => {
                document.querySelectorAll('.send-broker__checkbox').forEach(cb => {
                    cb.checked = e.target.checked;
                    if (e.target.checked) selectedBrokers.set(cb.dataset.brokerCode, { brokerCode: cb.dataset.brokerCode, officeName: cb.dataset.officeName, addrJibun: cb.dataset.addrJibun ?? '' });
                    else                  selectedBrokers.delete(cb.dataset.brokerCode);
                });
                updateCtaInfo();
            });
        }

        /* ---- 중개사 시트 렌더링 ---- */
        function renderBrokerSheet(brokers) {
            const content = document.getElementById('send-sheet-content');
            const hint    = document.getElementById('broker-hint');
            const allCb   = document.getElementById('select-all-checkbox');
            if (!content) return;

            selectedBrokers.clear();

            brokers.forEach(b => {
                const code = String(b.brokerCode);
                selectedBrokers.set(code, { brokerCode: code, officeName: b.officeName ?? '', addrJibun: b.addrJibun ?? '' });
            });

            if (hint) {
                const listingLabel = selectedListing
                    ? `매물 ${myListings.indexOf(selectedListing) + 1} 기준으로 `
                    : '';
                const distanceLabel = selectedDistanceM
                    ? `${selectedDistanceM >= 1000 ? (selectedDistanceM / 1000) + 'km' : selectedDistanceM + 'm'} 거리에 `
                    : '';
                hint.textContent   = `${listingLabel}${distanceLabel}${brokers.length}명의 중개사가 있습니다.`;
                hint.style.display = 'block';
            }

            content.innerHTML = `
                ${brokers.map(b => {
                    const tags      = (b.top5 ?? []).map(t =>
                        `<span class="send-tag ${t.cssClass ?? ''}"><span class="tag-label">${t.label}</span><span class="tag-count">${t.count}</span></span>`
                    ).join('');
                    const isChecked = selectedBrokers.has(String(b.brokerCode));
                    return `
                        <div class="send-broker">
                            <label class="send-broker__row">
                                <input type="checkbox"
                                       class="send-broker__checkbox"
                                       data-broker-code="${b.brokerCode}"
                                       data-office-name="${b.officeName ?? ''}"
                                       data-addr-jibun="${b.addrJibun ?? ''}"
                                       ${isChecked ? 'checked' : ''}>
                                <span class="send-broker__check-ui"></span>
                                <div class="send-broker__info">
                                    <div class="send-broker__name">${b.officeName ?? ''}</div>
                                    <div class="send-broker__tags">${tags}</div>
                                    <div class="send-broker__addr">${b.addrJibun ?? ''}</div>
                                </div>
                                <div class="send-broker__thumb"></div>
                            </label>
                        </div>`;
                }).join('')}`;

            content.querySelectorAll('.send-broker__checkbox').forEach(cb => {
                cb.addEventListener('change', () => {
                    if (cb.checked) selectedBrokers.set(cb.dataset.brokerCode, { brokerCode: cb.dataset.brokerCode, officeName: cb.dataset.officeName, addrJibun: cb.dataset.addrJibun ?? '' });
                    else            selectedBrokers.delete(cb.dataset.brokerCode);

                    const all = [...content.querySelectorAll('.send-broker__checkbox')];
                    if (allCb) allCb.checked = all.length > 0 && all.every(c => c.checked);
                    updateCtaInfo();
                });
            });

            const all = [...content.querySelectorAll('.send-broker__checkbox')];
            if (allCb) allCb.checked = all.length > 0 && all.every(c => c.checked);

            updateCtaInfo();
            if (window.openSendSheet) window.openSendSheet();
        }

        /* ---- 보내기 ---- */
        async function sendListing() {
            if (!selectedListing) {
                CommonPopup.open({
                    contentHtml: `
                        <p class="common-popup__title">매물 선택 필요</p>
                        <p class="common-popup__desc">보낼 매물을 선택해주세요.</p>
                    `,
                    actionsHtml: `
                        <button class="btn btn--primary btn--sm" onclick="CommonPopup.close()">확인</button>
                    `
                });
                return;
            }
            if (selectedBrokers.size === 0) {
                CommonPopup.open({
                    contentHtml: `
                        <p class="common-popup__title">중개사 선택 필요</p>
                        <p class="common-popup__desc">중개사를 선택해주세요.</p>
                    `,
                    actionsHtml: `
                        <button class="btn btn--primary btn--sm" onclick="CommonPopup.close()">확인</button>
                    `
                });
                return;
            }

            const btn = document.getElementById('send-btn');
            btn.disabled = true;

            try {
                const res = await fetch('/map/api/listings/share', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        listingId:   selectedListing.listingId,
                        brokerCodes: Array.from(selectedBrokers.keys())
                    })
                });
                if (res.status === 401) {
                    location.href = '/login';
                    return;
                }

                const body = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(body.message ?? '전송에 실패했습니다.');

                CommonPopup.open({
                    contentHtml: `
                        <p class="common-popup__title">전송 완료</p>
                        <p class="common-popup__desc">${selectedBrokers.size}명의 중개사에게 전송했습니다.</p>
                    `,
                    actionsHtml: `
                        <button class="btn btn--primary btn--sm" onclick="CommonPopup.close()">확인</button>
                    `
                });
                selectedBrokers.clear();
                document.querySelectorAll('.send-broker__checkbox').forEach(cb => cb.checked = false);
                const allCb = document.getElementById('select-all-checkbox');
                if (allCb) allCb.checked = false;
                updateCtaInfo();
                if (window.closeSendSheet) window.closeSendSheet();
            } catch (e) {
                sessionStorage.setItem('USAN_PENDING_SHARE', JSON.stringify({
                    listingId:   selectedListing.listingId,
                    listingName: selectedListing.addressName,
                    brokers:     Array.from(selectedBrokers.values())
                }));
            } finally {
                updateCtaInfo();
            }
        }

        /* ---- 미전송 매물 재발송 ---- */
        async function checkPendingShare() {
            const raw = sessionStorage.getItem('USAN_PENDING_SHARE');
            if (!raw) return;

            let pending;
            try { pending = JSON.parse(raw); } catch { sessionStorage.removeItem('USAN_PENDING_SHARE'); return; }

            const { listingId, brokers } = pending;
            if (!listingId || !brokers?.length) { sessionStorage.removeItem('USAN_PENDING_SHARE'); return; }

            const lines = brokers.map((b, i) => `${i + 1}. ${b.officeName}${b.addrJibun ? ' ' + b.addrJibun : ''}`).join('<br>');

            sessionStorage.removeItem('USAN_PENDING_SHARE');

            CommonPopup.open({
                contentHtml: `
                    <p class="common-popup__title">미발송 매물 재전송</p>
                    <p class="common-popup__desc">${brokers.length}명의 중개사에게 다시 전송하시겠습니까?
                    <br><br>${lines}
                    </p>
                `,
                actionsHtml: `
                    <button class="btn btn--outline btn--sm" onclick="CommonPopup.close()">취소</button>
                    <button class="btn btn--primary btn--sm" id="pending-share-confirm-btn">확인</button>`
            });

            document.getElementById('pending-share-confirm-btn')?.addEventListener('click', async () => {
                CommonPopup.close();
                try {
                    const res = await fetch('/map/api/listings/share', {
                        method:  'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify({ listingId, brokerCodes: brokers.map(b => b.brokerCode) })
                    });
                    if (res.status === 401) { location.href = '/login'; return; }
                    const body = await res.json().catch(() => ({}));
                    if (!res.ok) throw new Error(body.message ?? '전송에 실패했습니다.');
                    CommonPopup.open({
                        contentHtml: `
                            <p class="common-popup__title">전송 완료</p>
                            <p class="common-popup__desc">${brokers.length}명의 중개사에게 전송했습니다.</p>
                        `,
                        actionsHtml: `
                            <button class="btn btn--primary btn--sm" onclick="CommonPopup.close()">확인</button>
                        `
                    });
                } catch (e) {
                    CommonPopup.open({
                        contentHtml: `
                            <p class="common-popup__title">전송 실패</p><p class="common-popup__desc">${e.message}</p>
                        `,
                        actionsHtml: `
                            <button class="btn btn--primary btn--sm" onclick="CommonPopup.close()">확인</button>
                        `
                    });
                }
            });
        }

    </script>

    <!-- =============================================
         JS 2: 지도
    ============================================== -->
    <script th:inline="javascript">

        let map;
        let listingMarkers = [];
        let listingCircles = [];
        let circleOverlays = [];

        const ZOOM_INITIAL = 13;
        const ZOOM_MAX     = 19;

        function initMap(initialCenter) {
            const center              = new naver.maps.LatLng(initialCenter.lat, initialCenter.lng);
            const NAVER_DARK_THEME_ID = /*[[${naverDarkThemeId}]]*/ '';

            map = new naver.maps.Map('map', {
                gl: true,
                center,
                zoom:     ZOOM_INITIAL,
                maxZoom:  ZOOM_MAX,
                customStyleId: NAVER_DARK_THEME_ID,
                // mapTypeControl: true, // TODO(yongss): 위성, 로드뷰 기능 추가 시 롤백
                zoomControl: false,
            });

            naver.maps.Event.addListener(map, 'zoom_changed', () => {
                if (window.closeSendSheet) window.closeSendSheet();
            });
            naver.maps.Event.addListener(map, 'dragend', () => {
                if (document.getElementById('broker-sheet')?.classList.contains('is-open')) {
                    if (window.closeSendSheet) window.closeSendSheet();
                }
            });
            naver.maps.Event.addListener(map, 'click', () => {
                document.getElementById('listing-select')?.classList.remove('is-open');
                if (document.getElementById('broker-sheet')?.classList.contains('is-open')) {
                    if (window.closeSendSheet) window.closeSendSheet();
                }
            });
        }

        async function fetchAndShowBrokers(brokerCodes) {
            lastFetchedBrokerCodes = brokerCodes;
            try {
                const hasDistance = selectedDistanceM && selectedListing?.lat && selectedListing?.lng;
                const res = await fetch('/map/api/brokers/cluster', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({
                        brokerCodes,
                        lat:          hasDistance ? selectedListing.lat : null,
                        lng:          hasDistance ? selectedListing.lng : null,
                        distanceM:    hasDistance ? selectedDistanceM   : null,
                        listingTypes: selectedListingTypes.size > 0 ? Array.from(selectedListingTypes) : null
                    })
                });
                if (!res.ok) throw new Error('중개사 조회 실패');
                renderBrokerSheet(await res.json());
            } catch (e) {
                console.error(e);
                CommonPopup.open({
                    contentHtml: `
                        <p class="common-popup__title">오류</p>
                        <p class="common-popup__desc">중개사 정보를 불러올 수 없습니다.</p>
                    `,
                    actionsHtml: `
                        <button class="btn btn--primary btn--sm" onclick="CommonPopup.close()">확인</button>
                    `
                });
            }
        }

        function renderListingMarkers() {
            listingMarkers.forEach(m => m?.setMap(null));
            listingMarkers = [];
            if (!map || !myListings.length) return;

            listingMarkers = myListings
                .filter(l => l.lat && l.lng)
                .map((l, i) => {
                    const isSelected = selectedListing?.listingId === l.listingId;
                    const iconSrc    = isSelected ? '/img/marker-listing-blue.svg' : '/img/marker-listing-red.svg';
                    return new naver.maps.Marker({
                        map,
                        position: new naver.maps.LatLng(l.lat, l.lng),
                        icon: {
                            content: `<div class="listing-marker${isSelected ? ' is-selected' : ''}">
                                          <span class="listing-marker__label">매물 ${i + 1}</span>
                                          <img src="${iconSrc}" class="listing-marker__icon"/>
                                      </div>`,
                            size:   new naver.maps.Size(60, 60),
                            anchor: new naver.maps.Point(30, 60)
                        },
                        zIndex: isSelected ? 200 : 100
                    });
                });
            renderListingCircles();
            loadCircleCounts();
        }

        const CIRCLE_RADII = [
            { m: 500,  label: '0.5km' },
            { m: 1000, label: '1km'   },
            { m: 2000, label: '2km'   },
            { m: 3000, label: '3km'   },
        ];

        function renderListingCircles() {
            listingCircles.forEach(c => c?.setMap(null));
            circleOverlays.forEach(o => o?.setMap(null));
            listingCircles  = [];
            circleOverlays  = [];
            if (!map || !selectedListing?.lat || !selectedListing?.lng) return;

            const lat    = selectedListing.lat;
            const lng    = selectedListing.lng;
            const center = new naver.maps.LatLng(lat, lng);

            CIRCLE_RADII.forEach(({ m, label }) => {
                listingCircles.push(new naver.maps.Circle({
                    map,
                    center,
                    radius:        m,
                    strokeColor:   '#FFFFFF',
                    strokeOpacity: 0.3,
                    strokeWeight:  1,
                    fillColor:     '#FF5900',
                    fillOpacity:   0.12
                }));

                const latOff = (m * 0.7071) / 111320;
                const lngOff = (m * 0.7071) / (111320 * Math.cos(lat * Math.PI / 180));

                const overlay = new naver.maps.Marker({
                    map,
                    position: new naver.maps.LatLng(lat + latOff, lng - lngOff),
                    icon: {
                        content: `<div class="circle-label">
                                      <div class="circle-label__info">
                                          <span class="circle-label__distance">${label}</span>
                                          <span class="circle-label__count" data-radius="${m}">-</span>
                                      </div>
                                      <button type="button" class="circle-label__btn" onclick="handleRadiusSelect(this, ${m})">선택</button>
                                  </div>`,
                        anchor: new naver.maps.Point(0, 0)
                    },
                    zIndex: 150
                });
                circleOverlays.push(overlay);
            });
        }

        async function loadCircleCounts() {
            if (!selectedListing?.lat || !selectedListing?.lng) return;
            try {
                const res = await fetch(`/map/api/brokers/count-by-radius?lat=${selectedListing.lat}&lng=${selectedListing.lng}`);
                if (!res.ok) return;
                const counts = await res.json();
                Object.entries(counts).forEach(([radius, count]) => {
                    const el = document.querySelector(`.circle-label__count[data-radius="${radius}"]`);
                    if (el) el.textContent = count;
                });
            } catch (e) {
                console.error('[CIRCLE-COUNTS]', e);
            }
        }

        async function selectBrokersInRadius(radiusM) {
            if (!selectedListing?.lat || !selectedListing?.lng) {
                CommonPopup.open({
                    contentHtml: `
                        <p class="common-popup__title">매물 선택 필요</p>
                        <p class="common-popup__desc">매물을 먼저 선택해주세요.</p>
                    `,
                    actionsHtml: `
                        <button class="btn btn--primary btn--sm" onclick="CommonPopup.close()">확인</button>
                    `
                });
                return;
            }
            selectedDistanceM = radiusM;
            try {
                const res = await fetch(`/map/api/brokers/in-radius?lat=${selectedListing.lat}&lng=${selectedListing.lng}&radiusM=${radiusM}`);
                if (!res.ok) throw new Error('중개사 조회 실패');
                const brokers = await res.json();
                lastFetchedBrokerCodes = brokers.map(b => String(b.brokerCode));
                renderBrokerSheet(brokers);
            } catch (e) {
                console.error('[IN-RADIUS]', e);
                CommonPopup.open({
                    contentHtml: `
                        <p class="common-popup__title">오류</p>
                        <p class="common-popup__desc">중개사 정보를 불러올 수 없습니다.</p>
                    `,
                    actionsHtml: `
                        <button class="btn btn--primary btn--sm" onclick="CommonPopup.close()">확인</button>
                    `
                });
            }
        }

        function toggleLabelStyle(btn) {
            document.querySelectorAll('.circle-label').forEach(el => {
               el.classList.remove('is-active')
            });

            btn.closest('.circle-label').classList.add('is-active');
        }

        async function handleRadiusSelect(btn, radiusM) {
            toggleLabelStyle(btn);
            await selectBrokersInRadius(radiusM);
        }

        /* ---- 초기화 ---- */
        window.onload = async function () {
            const initialCenter = await resolveInitialCenter();
            initMap(initialCenter);
            await loadMyListings();
            await checkPendingShare();

            // 매물 없을 때 대상 요소에 클래스 부여
            if (!myListings.length) {
                document.getElementById('listing-select')?.classList.add('is-no-listings');
                document.querySelector('.send-sheet__filter')?.classList.add('is-no-listings');
            }

            // is-no-listings 클릭 시 매물 등록 유도 (캡처 단계에서 가로채 하위 핸들러 차단)
            document.addEventListener('click', e => {
                if (!e.target.closest('.is-no-listings')) return;
                e.stopPropagation();
                CommonPopup.open({
                    contentHtml: `
                        <p class="common-popup__title">등록된 매물 없음</p>
                        <p class="common-popup__desc">매물을 등록하러 이동하시겠습니까?</p>
                    `,
                    actionsHtml: `
                        <button class="btn btn--outline btn--sm" onclick="CommonPopup.close()">취소</button>
                        <button class="btn btn--primary btn--sm" onclick="location.href=\'/listings/new\'">이동</button>
                    `
                });
            }, true);

            // layout.html의 common-select 핸들러가 is-open을 토글하므로 MutationObserver로 감지
            const listingSelect = document.getElementById('listing-select');
            if (listingSelect) {
                new MutationObserver(() => {
                    const sheet = document.getElementById('broker-sheet');
                    if (listingSelect.classList.contains('is-open') && sheet && !sheet.classList.contains('is-open')) {
                        if (window.openSendSheet) window.openSendSheet();
                    }
                }).observe(listingSelect, { attributes: true, attributeFilter: ['class'] });
            }

            // 시트 열기 버튼
            document.getElementById('open-sheet-btn')?.addEventListener('click', () => {
                if (window.openSendSheet) window.openSendSheet();
            });

            document.getElementById('send-btn')?.addEventListener('click', sendListing);
            bindSelectAll();

            // 필터 모달 열기/닫기
            const filterOverlay = document.getElementById('filter-modal-overlay');
            document.querySelector('.send-sheet__filter')?.addEventListener('click', () => {
                // 현재 선택 상태 동기화
                filterOverlay?.querySelectorAll('.filter-chip__distance').forEach(c => {
                    c.classList.toggle('is-active', Number(c.dataset.distance) === selectedDistanceM);
                });
                filterOverlay?.querySelectorAll('.filter-chip__type').forEach(c => {
                    c.classList.toggle('is-active', selectedListingTypes.has(c.dataset.type));
                });
                filterOverlay?.classList.add('is-open');
            });
            document.getElementById('filterModalCancel')?.addEventListener('click', () => {
                filterOverlay?.classList.remove('is-open');
            });
            filterOverlay?.addEventListener('click', e => {
                if (e.target === filterOverlay) filterOverlay.classList.remove('is-open');
            });

            // 거리 칩 단일 선택 (이미 선택된 칩 재클릭 시 해제)
            filterOverlay?.addEventListener('click', e => {
                const chip = e.target.closest('.filter-chip__distance');
                if (!chip) return;
                const wasActive = chip.classList.contains('is-active');
                filterOverlay.querySelectorAll('.filter-chip__distance').forEach(c => c.classList.remove('is-active'));
                if (!wasActive) chip.classList.add('is-active');
            });

            // 매물 타입 칩 다중 선택 토글
            filterOverlay?.addEventListener('click', e => {
                const chip = e.target.closest('.filter-chip__type');
                if (!chip) return;
                chip.classList.toggle('is-active');
            });

            // 적용
            document.getElementById('filterModalApply')?.addEventListener('click', () => {
                const activeDistance = filterOverlay?.querySelector('.filter-chip__distance.is-active');
                selectedDistanceM = activeDistance ? Number(activeDistance.dataset.distance) : null;

                selectedListingTypes.clear();
                filterOverlay?.querySelectorAll('.filter-chip__type.is-active').forEach(c => {
                    selectedListingTypes.add(c.dataset.type);
                });

                const filterText = document.querySelector('.send-sheet__filter-text');
                if (filterText) {
                    const parts = [];
                    if (activeDistance) parts.push(activeDistance.textContent);
                    if (selectedListingTypes.size > 0) parts.push(`${selectedListingTypes.size}개 타입`);
                    filterText.textContent = parts.length > 0 ? parts.join(' · ') : '필터';
                }

                filterOverlay?.classList.remove('is-open');
                if (lastFetchedBrokerCodes.length) fetchAndShowBrokers(lastFetchedBrokerCodes);
            });
        };

    </script>

    <!-- =============================================
         JS 3: 드래그 시트 열기/닫기
    ============================================== -->
    <script>
        (function () {
            const sheet    = document.getElementById('broker-sheet');
            const collapse = sheet?.querySelector('.send-sheet__collapse');
            const handle   = sheet?.querySelector('.send-sheet__handle-area');
            if (!sheet || !collapse || !handle) return;

            let startY = 0, currentY = 0, dragging = false;
            const OPEN_TH = 80, CLOSE_TH = 120;

            const isOpen = () => sheet.classList.contains('is-open');

            function openSheet() {
                sheet.classList.add('is-open');
                collapse.style.transform = 'translateY(0)';
            }
            function closeSheet() {
                sheet.classList.remove('is-open');
                collapse.style.transform = 'translateY(calc(100% - 32px))';
            }

            closeSheet();

            function onStart(e) {
                // 드롭다운 닫기
                document.getElementById('listing-select')?.classList.remove('is-open');
                dragging = true;
                sheet.classList.add('is-dragging');
                startY = currentY = e.touches ? e.touches[0].clientY : e.clientY;
            }
            function onMove(e) {
                if (!dragging) return;
                if (e.cancelable) e.preventDefault(); // pull-to-refresh 방지
                currentY    = e.touches ? e.touches[0].clientY : e.clientY;
                const delta = currentY - startY;
                if (isOpen()) { if (delta > 0)  collapse.style.transform = `translateY(${delta}px)`; }
                else          { if (delta < 0)  collapse.style.transform = `translateY(calc(100% - 108px + ${delta}px))`; }
            }
            function onEnd() {
                if (!dragging) return;
                dragging = false;
                sheet.classList.remove('is-dragging');
                const delta = currentY - startY;
                if (isOpen()) { delta > CLOSE_TH ? closeSheet() : openSheet(); }
                else          { -delta > OPEN_TH ? openSheet()  : closeSheet(); }
            }

            handle.addEventListener('touchstart', onStart, { passive: true });
            handle.addEventListener('touchmove',  onMove,  { passive: false });
            handle.addEventListener('touchend',   onEnd);
            handle.addEventListener('mousedown',  onStart);
            window.addEventListener('mousemove',  onMove);
            window.addEventListener('mouseup',    onEnd);

            window.openSendSheet  = openSheet;
            window.closeSendSheet = closeSheet;
        })();
    </script>

    <!-- pull-to-refresh 방지 (iOS Safari) -->
    <script>
        (function () {
            let touchStartY = 0;
            document.addEventListener('touchstart', function (e) {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            document.addEventListener('touchmove', function (e) {
                const scrollable = e.target.closest('#send-sheet-content');
                if (scrollable) {
                    const swipingDown = e.touches[0].clientY > touchStartY;
                    if (swipingDown && scrollable.scrollTop <= 0) {
                        if (e.cancelable) e.preventDefault();
                    }
                    return;
                }
                if (e.cancelable) e.preventDefault();
            }, { passive: false });
        })();
    </script>
