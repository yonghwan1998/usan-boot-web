<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">매물 보내기</title>
</head>

<th:block th:fragment="pcSideContent"></th:block>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/map.css(t=${#dates.createNow().time})}">
</th:block>

<section>
    <script type="text/javascript"
            th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId} + '&submodules=gl'"></script>
    <script type="text/javascript" src="/js/MarkerClustering.js"></script>

    <div class="main-content">

        <div id="map" class="map"></div>

        <div class="map-ui">
            <div class="common-header map-header">
                <button class="common-header__back" onclick="history.back()"></button>
                <div class="common-header__title">매물 보내기</div>
                <div class="common-header__right"></div>
            </div>

            <!-- 항상 보이는 시트 열기 버튼 -->
            <div class="map-ui__send-fab">
                <button type="button" class="map-send-fab" id="open-sheet-btn">
                    <span class="map-send-fab__icon" aria-hidden="true"></span>
                    매물 보내기
                </button>
            </div>
        </div>

        <!-- 토스트 -->
        <div id="send-toast" class="send-toast" aria-live="polite"></div>

        <!-- 바텀시트 -->
        <div id="broker-sheet" class="send-sheet">

            <!-- 접히는 영역: 핸들 + 매물선택 + 중개사 목록 -->
            <div class="send-sheet__collapse">
                <div class="send-sheet__handle-area">
                    <div class="send-sheet__handle"></div>
                </div>

                <!-- 매물 선택 (항상 보임, collapse 상단 고정) -->
                <div class="send-sheet__listing-area">
                    <div class="common-select" id="listing-select">
                        <div class="common-input-wrapper">
                            <button type="button"
                                    class="common-input common-select__input"
                                    id="listing-select-btn"
                                    aria-haspopup="listbox">
                                <span class="send-sheet__listing-left">
                                    <span class="send-sheet__listing-label" id="listing-label-text">매물 선택</span>
                                    <span class="send-sheet__listing-sep" id="listing-sep" style="display:none">|</span>
                                    <span class="send-sheet__listing-title" id="listing-title-text"></span>
                                </span>
                            </button>
                            <span class="common-input-btn common-input__expand-btn" aria-hidden="true"></span>
                            <ul class="common-select__options" id="listing-options" role="listbox"></ul>
                        </div>
                    </div>
                </div>

                <div class="send-sheet__body">
                    <!-- 전체선택 + 필터 -->
                    <div class="send-sheet__options">
                        <label class="send-sheet__check">
                            <input type="checkbox" id="select-all-checkbox">
                            <span class="send-sheet__check-ui" aria-hidden="true"></span>
                            <span class="send-sheet__check-text">중개사 전체 선택</span>
                        </label>
                        <button type="button" class="send-sheet__filter">
                            <span class="send-sheet__filter-icon" aria-hidden="true"></span>
                            <span class="send-sheet__filter-text">필터</span>
                        </button>
                    </div>

                    <!-- 힌트 -->
                    <div class="send-sheet__hint" id="broker-hint" style="display:none"></div>

                    <!-- 중개사 목록 -->
                    <div class="send-sheet__list" id="broker-sheet-content">
                        <p class="send-sheet__empty-msg">지도에서 중개사 마커를 선택하면<br>목록이 표시됩니다.</p>
                    </div>
                </div>
            </div>

            <!-- 항상 보이는 하단: 보내기 버튼 -->
            <div class="send-sheet__cta">
                <!-- 보내기 버튼 -->
                <button type="button" id="send-btn" class="send-sheet__send-btn" disabled>
                    <span class="send-sheet__send-icon" aria-hidden="true"></span>
                    <span id="send-btn-text" class="send-sheet__send-text">중개사를 선택해주세요</span>
                </button>
            </div>
        </div>

        <!-- 거리 필터 모달 -->
        <div id="filter-modal-overlay" class="filter-modal-overlay">
            <div class="filter-modal">
                <div class="filter-modal__title">필터</div>

                <hr class="filter-modal__hr">

                <div class="filter-modal__section">

                    <div class="filter-modal__section--distance">
                        <div class="filter-modal__section-title">거리 선택</div>
                        <div class="filter-modal__chips">
                            <button type="button" class="filter-chip__distance" data-distance="100">100m</button>
                            <button type="button" class="filter-chip__distance" data-distance="300">300m</button>
                            <button type="button" class="filter-chip__distance" data-distance="500">500m</button>
                            <button type="button" class="filter-chip__distance" data-distance="1000">1km</button>
                        </div>
                    </div>

                    <div class="filter-modal__section--type">
                        <div class="filter-modal__section-title">매물 타입</div>
                        <div class="filter-modal__chips">
                            <button type="button" class="filter-chip__type" data-distance="아파트">아파트</button>
                            <button type="button" class="filter-chip__type" data-distance="오피스텔">오피스텔</button>
                            <button type="button" class="filter-chip__type" data-distance="빌라/연립">빌라/연립</button>
                            <button type="button" class="filter-chip__type" data-distance="원룸">원룸</button>
                            <button type="button" class="filter-chip__type" data-distance="투룸">투룸</button>
                            <button type="button" class="filter-chip__type" data-distance="단독/다가구">단독/다가구</button>
                            <button type="button" class="filter-chip__type" data-distance="전원주택">전원주택</button>
                            <button type="button" class="filter-chip__type" data-distance="상가주택">상가주택</button>
                            <button type="button" class="filter-chip__type" data-distance="한옥주택">한옥주택</button>
                            <button type="button" class="filter-chip__type" data-distance="상가">상가</button>
                            <button type="button" class="filter-chip__type" data-distance="사무실">사무실</button>
                            <button type="button" class="filter-chip__type" data-distance="건물">건물</button>
                            <button type="button" class="filter-chip__type" data-distance="공장/창고">공장/창고</button>
                            <button type="button" class="filter-chip__type" data-distance="지식산업센터">지식산업센터</button>
                            <button type="button" class="filter-chip__type" data-distance="토지">토지</button>
                            <button type="button" class="filter-chip__type" data-distance="아파트분양권">아파트분양권</button>
                            <button type="button" class="filter-chip__type" data-distance="오피스텔분양권">오피스텔분양권</button>
                            <button type="button" class="filter-chip__type" data-distance="재개발">재개발</button>
                            <button type="button" class="filter-chip__type" data-distance="재건축">재건축</button>
                            <button type="button" class="filter-chip__type" data-distance="분양중/예정">분양중/예정</button>
                        </div>
                    </div>

                </div>

                <div class="filter-modal__footer">
                    <button type="button" class="filter-modal__btn filter-modal__btn--cancel" id="filterModalCancel">취소</button>
                    <button type="button" class="filter-modal__btn filter-modal__btn--apply" id="filterModalApply">적용</button>
                </div>
            </div>
        </div>

    </div>

    <!-- =============================================
         JS 1: 상태 관리 / 매물 / 보내기 / 토스트
    ============================================== -->
    <script th:inline="javascript">

        /* ---- 상태 ---- */
        let myListings        = [];
        let selectedListing   = null;
        let selectedDistanceM = null;
        const selectedBrokers = new Map(); // brokerCode → {brokerCode, officeName}

        /* ---- 내 매물 로드 ---- */
        async function loadMyListings() {
            try {
                const res = await fetch('/map/api/listings/my-listings');
                if (res.status === 401) { location.href = '/login'; return; }
                if (!res.ok) throw new Error('매물 목록을 불러올 수 없습니다.');

                myListings = await res.json();
                renderListingOptions();
                if (!myListings.length) { updateCtaInfo(); return; }

                const paramId = new URLSearchParams(location.search).get('listingId');
                const target  = myListings.find(l => String(l.listingId) === paramId) ?? myListings[0];
                selectListing(target);
            } catch (e) {
                console.error('[MY-LISTINGS]', e);
                showToast(e.message, true);
            }
        }

        function selectListing(listing) {
            selectedListing = listing;
            const label = document.getElementById('listing-label-text');
            const sep   = document.getElementById('listing-sep');
            const title = document.getElementById('listing-title-text');
            if (!listing) {
                label.textContent = '매물 선택';
                sep.style.display = 'none';
                title.textContent = '';
            } else {
                label.textContent = `매물 ${myListings.indexOf(listing) + 1}`;
                sep.style.display = '';
                title.textContent = listing.addressName;
            }
            updateCtaInfo();
            if (typeof renderListingMarkers === 'function') renderListingMarkers();
        }

        function updateCtaInfo() {
            const cnt     = selectedBrokers.size;
            const btn     = document.getElementById('send-btn');
            const btnText = document.getElementById('send-btn-text');
            const canSend = selectedListing !== null && cnt > 0;
            btn.disabled  = !canSend;
            btnText.textContent = canSend
                ? `${cnt}명의 중개사에게 매물 보내기`
                : cnt > 0 ? '매물을 선택해주세요' : '중개사를 선택해주세요';
        }

        /* ---- 매물 드롭다운 렌더링 ---- */
        function renderListingOptions() {
            const ul = document.getElementById('listing-options');
            if (!ul) return;
            ul.innerHTML = myListings.length === 0
                ? '<li style="color:#8b8b8b;cursor:default;pointer-events:none">등록된 매물이 없습니다.</li>'
                : myListings.map((l, i) => {
                    const active = selectedListing?.listingId === l.listingId;
                    return `<li data-id="${l.listingId}" role="option"
                                style="${active ? 'font-weight:700;background:#f7f7f7;' : ''}">
                                <span style="font-weight:700">매물 ${i + 1}</span>
                                <span style="margin-left:8px;color:#595959;font-size:14px">${l.addressName}</span>
                            </li>`;
                }).join('');

            ul.querySelectorAll('li[data-id]').forEach(li => {
                li.addEventListener('click', e => {
                    e.stopPropagation(); // listing-select 핸들러로 버블링 방지
                    const found = myListings.find(l => l.listingId === Number(li.dataset.id));
                    if (found) {
                        selectListing(found);
                        document.getElementById('listing-select')?.classList.remove('is-open');
                    }
                });
            });
        }

        /* ---- 중개사 전체선택 ---- */
        function bindSelectAll() {
            document.getElementById('select-all-checkbox')?.addEventListener('change', e => {
                document.querySelectorAll('.send-broker__checkbox').forEach(cb => {
                    cb.checked = e.target.checked;
                    if (e.target.checked) selectedBrokers.set(cb.dataset.brokerCode, { brokerCode: cb.dataset.brokerCode, officeName: cb.dataset.officeName });
                    else                  selectedBrokers.delete(cb.dataset.brokerCode);
                });
                updateCtaInfo();
            });
        }

        /* ---- 중개사 시트 렌더링 ---- */
        function renderBrokerSheet(brokers) {
            const content = document.getElementById('broker-sheet-content');
            const hint    = document.getElementById('broker-hint');
            const allCb   = document.getElementById('select-all-checkbox');
            if (!content) return;

            selectedBrokers.clear();

            brokers.forEach(b => {
                const code = String(b.brokerCode);
                selectedBrokers.set(code, { brokerCode: code, officeName: b.officeName ?? '' });
            });

            if (hint) {
                const listingLabel = selectedListing
                    ? `매물 ${myListings.indexOf(selectedListing) + 1} 기준으로 `
                    : '';
                hint.textContent   = `${listingLabel}${brokers.length}명의 중개사가 있습니다.`;
                hint.style.display = 'block';
            }

            content.innerHTML = `
                ${brokers.map(b => {
                    const tags      = (b.top5 ?? []).map(t =>
                        `<span class="send-tag ${t.cssClass ?? ''}"><span class="tag-label">${t.label}</span><span class="tag-count">${t.count}</span></span>`
                    ).join('');
                    const isChecked = selectedBrokers.has(String(b.brokerCode));
                    return `
                        <div class="send-broker">
                            <label class="send-broker__row">
                                <input type="checkbox"
                                       class="send-broker__checkbox"
                                       data-broker-code="${b.brokerCode}"
                                       data-office-name="${b.officeName ?? ''}"
                                       ${isChecked ? 'checked' : ''}>
                                <span class="send-broker__check-ui"></span>
                                <div class="send-broker__info">
                                    <div class="send-broker__name">${b.officeName ?? ''}</div>
                                    <div class="send-broker__tags">${tags}</div>
                                    <div class="send-broker__addr">${b.addrJibun ?? ''}</div>
                                </div>
                                <div class="send-broker__thumb"></div>
                            </label>
                        </div>`;
                }).join('')}`;

            content.querySelectorAll('.send-broker__checkbox').forEach(cb => {
                cb.addEventListener('change', () => {
                    if (cb.checked) selectedBrokers.set(cb.dataset.brokerCode, { brokerCode: cb.dataset.brokerCode, officeName: cb.dataset.officeName });
                    else            selectedBrokers.delete(cb.dataset.brokerCode);

                    const all = [...content.querySelectorAll('.send-broker__checkbox')];
                    if (allCb) allCb.checked = all.length > 0 && all.every(c => c.checked);
                    updateCtaInfo();
                });
            });

            const all = [...content.querySelectorAll('.send-broker__checkbox')];
            if (allCb) allCb.checked = all.length > 0 && all.every(c => c.checked);

            updateCtaInfo();
            if (window.openSendSheet) window.openSendSheet();
        }

        /* ---- 보내기 ---- */
        async function sendListing() {
            if (!selectedListing)           { showToast('보낼 매물을 선택해주세요.', true); return; }
            if (selectedBrokers.size === 0) { showToast('중개사를 선택해주세요.', true);    return; }

            const btn = document.getElementById('send-btn');
            btn.disabled = true;

            try {
                const res = await fetch('/map/api/listings/share', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        listingId:   selectedListing.listingId,
                        brokerCodes: Array.from(selectedBrokers.keys())
                    })
                });
                if (res.status === 401) { location.href = '/login'; return; }

                const body = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(body.message ?? '전송에 실패했습니다.');

                showToast(`${selectedBrokers.size}명의 중개사에게 전송했습니다.`);
                selectedBrokers.clear();
                document.querySelectorAll('.send-broker__checkbox').forEach(cb => cb.checked = false);
                const allCb = document.getElementById('select-all-checkbox');
                if (allCb) allCb.checked = false;
                updateCtaInfo();
                if (window.closeSendSheet) window.closeSendSheet();
            } catch (e) {
                showToast(e.message, true);
            } finally {
                updateCtaInfo();
            }
        }

        /* ---- 토스트 ---- */
        let _toastTimer = null;
        function showToast(msg, isError = false) {
            const el = document.getElementById('send-toast');
            if (!el) return;
            el.textContent = msg;
            el.className   = 'send-toast' + (isError ? ' send-toast--error' : '');
            el.classList.add('is-visible');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('is-visible'), 3000);
        }

    </script>

    <!-- =============================================
         JS 2: 지도 / 마커 / 클러스터
    ============================================== -->
    <script th:inline="javascript">

        let map;
        let markers               = [];
        let listingMarkers        = [];
        let markerClustering      = null;
        let selectedClusterMarker = null;
        let selectedClusterKey    = null;
        let lastFetchId           = 0;

        const ZOOM_INITIAL     = 13;
        const ZOOM_MAX         = 19;
        const ZOOM_MARKER_MIN  = 17;
        const ZOOM_CLUSTER_MIN = 15;
        const ZOOM_EMD_MIN     = 13;
        const ZOOM_SIGUNGU_MIN = 11;
        const ZOOM_MIN         = 8;

        function makeClusterKey(members) {
            return members.map(m => m.__brokerCode).filter(Boolean).sort().join(',');
        }

        function updateClusterOptionsByZoom(zoom) {
            if (!markerClustering) return;
            let g;
            if      (zoom >= ZOOM_MARKER_MIN)  g = 56;
            else if (zoom >= ZOOM_CLUSTER_MIN) g = 120;
            else if (zoom >= ZOOM_EMD_MIN)     g = 180;
            else if (zoom >= ZOOM_SIGUNGU_MIN) g = 240;
            else                               g = 300;
            markerClustering.setOptions({ gridSize: g });
        }

        function initMap() {
            const center              = new naver.maps.LatLng(33.464933, 126.530862);
            const NAVER_DARK_THEME_ID = /*[[${naverDarkThemeId}]]*/ '';

            map = new naver.maps.Map('map', {
                gl: true,
                center,
                zoom:     ZOOM_INITIAL,
                maxZoom:  ZOOM_MAX,
                customStyleId: NAVER_DARK_THEME_ID,
                // mapTypeControl: true, // TODO(yongss): 위성, 로드뷰 기능 추가 시 롤백
                zoomControl: true,
                zoomControlOptions: {
                    style:    naver.maps.ZoomControlStyle.SMALL,
                    position: naver.maps.Position.TOP_LEFT
                }
            });

            markerClustering = new MarkerClustering({
                map,
                markers:        [],
                minClusterSize: 1,
                maxZoom:        20,
                icons: [{
                    content: `<div class="usan-cluster">
                                  <img src="/img/marker-agency-white.svg" class="usan-cluster__img"/>
                                  <span class="usan-cluster__count"></span>
                              </div>`,
                    size:   new naver.maps.Size(56, 56),
                    anchor: new naver.maps.Point(28, 56)
                }],
                indexGenerator: [1],
                stylingFunction(clusterMarker, count) {
                    const el   = clusterMarker.getElement();
                    if (!el) return;
                    const span = el.querySelector('.usan-cluster__count');
                    const img  = el.querySelector('.usan-cluster__img');
                    if (span) {
                        span.style.display = count <= 1 ? 'none' : 'flex';
                        span.textContent   = count <= 1 ? '' : String(count);
                    }
                    if (!img) return;
                    const members = typeof clusterMarker.getClusterMember === 'function'
                        ? clusterMarker.getClusterMember() : [];
                    const key = members.length ? makeClusterKey(members) : null;
                    img.src = (selectedClusterMarker && key === selectedClusterKey)
                        ? '/img/marker-agency-orange.svg'
                        : '/img/marker-agency-white.svg';
                }
            });

            updateClusterOptionsByZoom(map.getZoom());
            loadBrokersInBounds();

            naver.maps.Event.addListener(map, 'zoom_changed', () => {
                updateClusterOptionsByZoom(map.getZoom());
                if (window.closeSendSheet) window.closeSendSheet();
                loadBrokersInBounds();
            });
            naver.maps.Event.addListener(map, 'dragend', () => {
                if (document.getElementById('broker-sheet')?.classList.contains('is-open')) {
                    if (window.closeSendSheet) window.closeSendSheet();
                }
                loadBrokersInBounds();
            });
            naver.maps.Event.addListener(map, 'click', () => {
                document.getElementById('listing-select')?.classList.remove('is-open');
                if (document.getElementById('broker-sheet')?.classList.contains('is-open')) {
                    if (window.closeSendSheet) window.closeSendSheet();
                }
            });
            naver.maps.Event.addListener(markerClustering, 'clusterclick', onClusterClick);
        }

        function loadBrokersInBounds() {
            const bounds = map.getBounds();
            if (!bounds) return;
            const zoom = map.getZoom();
            if (zoom <= ZOOM_MIN) { clearMarkersAndClusters(); return; }

            const sw  = bounds.getSW(), ne = bounds.getNE();
            const url = `/map/api/brokers?south=${sw.lat()}&north=${ne.lat()}&west=${sw.lng()}&east=${ne.lng()}`;
            const fid = ++lastFetchId;

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    if (fid !== lastFetchId) return;
                    if (map.getZoom() <= ZOOM_MIN) { clearMarkersAndClusters(); return; }
                    renderMarkers(data);
                })
                .catch(e => console.error('[MAP]', e));
        }

        function renderMarkers(brokers) {
            clearMarkersAndClusters();
            markers = brokers.map(b => {
                const marker = new naver.maps.Marker({
                    position: new naver.maps.LatLng(b.lat, b.lng),
                    title:    b.officeName
                });
                marker.__brokerCode = b.brokerCode;

                naver.maps.Event.addListener(marker, 'click', () => {
                    fetchAndShowBrokers([String(b.brokerCode)]);
                });

                return marker;
            });
            if (markerClustering) {
                markerClustering.setMarkers(markers);
                naver.maps.Event.trigger(map, 'idle');
            }
        }

        async function fetchAndShowBrokers(brokerCodes) {
            try {
                const hasDistance = selectedDistanceM && selectedListing?.lat && selectedListing?.lng;
                const res = await fetch('/map/api/brokers/cluster', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({
                        brokerCodes,
                        lat:       hasDistance ? selectedListing.lat : null,
                        lng:       hasDistance ? selectedListing.lng : null,
                        distanceM: hasDistance ? selectedDistanceM   : null
                    })
                });
                if (!res.ok) throw new Error('중개사 조회 실패');
                renderBrokerSheet(await res.json());
            } catch (e) {
                console.error(e);
                showToast('중개사 정보를 불러올 수 없습니다.', true);
            }
        }

        function onClusterClick(cluster) {
            const members     = cluster.getClusterMember() || [];
            const brokerCodes = members.map(m => m.__brokerCode).filter(Boolean);
            if (!brokerCodes.length) return;

            selectedClusterKey = makeClusterKey(members);
            resetClusterIcons();

            const el  = cluster._clusterMarker?.getElement?.();
            const img = el?.querySelector('.usan-cluster__img');
            if (img) { img.src = '/img/marker-agency-orange.svg'; selectedClusterMarker = cluster._clusterMarker; }

            fetchAndShowBrokers(brokerCodes.map(String));
        }

        function renderListingMarkers() {
            listingMarkers.forEach(m => m?.setMap(null));
            listingMarkers = [];
            if (!map || !myListings.length) return;

            listingMarkers = myListings
                .filter(l => l.lat && l.lng)
                .map((l, i) => {
                    const isSelected = selectedListing?.listingId === l.listingId;
                    const iconSrc    = isSelected ? '/img/marker-listing-blue.svg' : '/img/marker-listing-red.svg';
                    return new naver.maps.Marker({
                        map,
                        position: new naver.maps.LatLng(l.lat, l.lng),
                        icon: {
                            content: `<div class="listing-marker${isSelected ? ' is-selected' : ''}">
                                          <span class="listing-marker__label">매물 ${i + 1}</span>
                                          <img src="${iconSrc}" class="listing-marker__icon"/>
                                      </div>`,
                            size:   new naver.maps.Size(60, 60),
                            anchor: new naver.maps.Point(30, 60)
                        },
                        zIndex: isSelected ? 200 : 100
                    });
                });
        }

        function clearMarkersAndClusters() {
            markers.forEach(m => m?.setMap(null));
            markers = [];
            if (markerClustering) markerClustering.setMarkers([]);
        }

        function resetClusterIcons() {
            document.querySelectorAll('.usan-cluster__img').forEach(img => {
                img.src = '/img/marker-agency-white.svg';
            });
            selectedClusterMarker = null;
        }

        /* ---- 초기화 ---- */
        window.onload = async function () {
            initMap();
            await loadMyListings();

            // 매물 없을 때 대상 요소에 클래스 부여
            if (!myListings.length) {
                document.getElementById('listing-select')?.classList.add('is-no-listings');
                document.querySelector('.send-sheet__filter')?.classList.add('is-no-listings');
            }

            // is-no-listings 클릭 시 매물 등록 유도 (캡처 단계에서 가로채 하위 핸들러 차단)
            document.addEventListener('click', e => {
                if (!e.target.closest('.is-no-listings')) return;
                e.stopPropagation();
                if (confirm('등록된 매물이 없습니다.\n매물을 등록하러 이동하시겠습니까?')) location.href = '/listings/new';
            }, true);

            // 매물 드롭다운 토글 (.common-select 전체 클릭 시 열림)
            document.getElementById('listing-select')?.addEventListener('click', e => {
                e.stopPropagation();
                document.getElementById('listing-select')?.classList.toggle('is-open');
            });

            // 드롭다운 외부 클릭 시 닫기
            document.addEventListener('click', () => {
                document.getElementById('listing-select')?.classList.remove('is-open');
            });

            // 시트 열기 버튼
            document.getElementById('open-sheet-btn')?.addEventListener('click', () => {
                if (window.openSendSheet) window.openSendSheet();
            });

            document.getElementById('send-btn')?.addEventListener('click', sendListing);
            bindSelectAll();

            // 필터 모달 열기/닫기
            const filterOverlay = document.getElementById('filter-modal-overlay');
            document.querySelector('.send-sheet__filter')?.addEventListener('click', () => {
                // 현재 선택된 거리로 칩 상태 동기화
                filterOverlay?.querySelectorAll('.filter-chip__distance').forEach(c => {
                    c.classList.toggle('is-active', Number(c.dataset.distance) === selectedDistanceM);
                });
                filterOverlay?.classList.add('is-open');
            });
            document.getElementById('filterModalCancel')?.addEventListener('click', () => {
                filterOverlay?.classList.remove('is-open');
            });
            filterOverlay?.addEventListener('click', e => {
                if (e.target === filterOverlay) filterOverlay.classList.remove('is-open');
            });

            // 거리 칩 단일 선택
            filterOverlay?.addEventListener('click', e => {
                const chip = e.target.closest('.filter-chip__distance');
                if (!chip) return;
                filterOverlay.querySelectorAll('.filter-chip__distance').forEach(c => c.classList.remove('is-active'));
                chip.classList.add('is-active');
            });

            // 적용
            document.getElementById('filterModalApply')?.addEventListener('click', () => {
                const active = filterOverlay?.querySelector('.filter-chip__distance.is-active');
                selectedDistanceM = active ? Number(active.dataset.distance) : null;
                const filterText = document.querySelector('.send-sheet__filter-text');
                if (filterText) filterText.textContent = active ? active.textContent : '필터';
                filterOverlay?.classList.remove('is-open');
            });
        };

    </script>

    <!-- =============================================
         JS 3: 드래그 시트 열기/닫기
    ============================================== -->
    <script>
        (function () {
            const sheet    = document.getElementById('broker-sheet');
            const collapse = sheet?.querySelector('.send-sheet__collapse');
            const handle   = sheet?.querySelector('.send-sheet__handle-area');
            if (!sheet || !collapse || !handle) return;

            let startY = 0, currentY = 0, dragging = false;
            const OPEN_TH = 80, CLOSE_TH = 120;

            const isOpen = () => sheet.classList.contains('is-open');

            function openSheet() {
                sheet.classList.add('is-open');
                collapse.style.transform = 'translateY(0)';
            }
            function closeSheet() {
                sheet.classList.remove('is-open');
                collapse.style.transform = 'translateY(calc(100% - 108px))';
            }

            closeSheet();

            function onStart(e) {
                // 드롭다운 닫기
                document.getElementById('listing-select')?.classList.remove('is-open');
                dragging = true;
                sheet.classList.add('is-dragging');
                startY = currentY = e.touches ? e.touches[0].clientY : e.clientY;
            }
            function onMove(e) {
                if (!dragging) return;
                if (e.cancelable) e.preventDefault(); // pull-to-refresh 방지
                currentY    = e.touches ? e.touches[0].clientY : e.clientY;
                const delta = currentY - startY;
                if (isOpen()) { if (delta > 0)  collapse.style.transform = `translateY(${delta}px)`; }
                else          { if (delta < 0)  collapse.style.transform = `translateY(calc(100% - 108px + ${delta}px))`; }
            }
            function onEnd() {
                if (!dragging) return;
                dragging = false;
                sheet.classList.remove('is-dragging');
                const delta = currentY - startY;
                if (isOpen()) { delta > CLOSE_TH ? closeSheet() : openSheet(); }
                else          { -delta > OPEN_TH ? openSheet()  : closeSheet(); }
            }

            handle.addEventListener('touchstart', onStart, { passive: true });
            handle.addEventListener('touchmove',  onMove,  { passive: false });
            handle.addEventListener('touchend',   onEnd);
            handle.addEventListener('mousedown',  onStart);
            window.addEventListener('mousemove',  onMove);
            window.addEventListener('mouseup',    onEnd);

            window.openSendSheet  = openSheet;
            window.closeSendSheet = closeSheet;
        })();
    </script>

    <!-- pull-to-refresh 방지 (iOS Safari) -->
    <script>
        (function () {
            let touchStartY = 0;
            document.addEventListener('touchstart', function (e) {
                touchStartY = e.touches[0].clientY;
            }, { passive: true });
            document.addEventListener('touchmove', function (e) {
                const scrollable = e.target.closest('#broker-sheet-content');
                if (scrollable) {
                    const swipingDown = e.touches[0].clientY > touchStartY;
                    if (swipingDown && scrollable.scrollTop <= 0) {
                        if (e.cancelable) e.preventDefault();
                    }
                    return;
                }
                if (e.cancelable) e.preventDefault();
            }, { passive: false });
        })();
    </script>
