<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">우리 동네 부동산 지도 | 우산</title>
</head>

<th:block th:fragment="pcSideContent"></th:block>

<th:block th:fragment="extraCss">
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" th:href="@{/css/broker.css(t=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/map.css(t=${#dates.createNow().time})}">
</th:block>

<section>
    <h1 class="sr-only">동네 부동산 지도</h1>
    <!-- 네이버 지도 API -->
    <script type="text/javascript" th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId}"></script>
    <script type="text/javascript" src="/js/MarkerClustering.js"></script>

    <!-- 지도 영역 -->
    <div class="main-content">
        <div id="map" class="map"></div>

        <!-- 지도 UI 오버레이 -->
        <div class="map-ui">

            <div class="map-ui__top">
                <div class="map-search">
                    <button class="map-temp__btn map-temp__btn--temp" type="button" aria-label="검색" th:onclick="|location.href='@{/}'|"></button>
<!--                    <button class="map-search__btn map-search__btn&#45;&#45;search" type="button" aria-label="검색"></button>// TODO(yongss): 추후 복구(해당 줄 복사하여 전체 롤백)-->
<!--                    <input class="map-search__input" type="text" placeholder="주소 검색" />// TODO(yongss): 추후 복구(해당 줄 복사하여 전체 롤백)-->
                    <div class="map-temp__input">우리 동네 부동산, 우산 ☂️</div>
                </div>

                <button class="map-icon-btn" type="button" aria-label="알림">
                    <span class="map-icon--bell"></span>
                </button>
            </div>

            <div class="map-ui__chips">
                <button class="map-chip" id="btn-my-location" type="button">
                    <span class="map-icon--gps"></span>
                    <span class="map-chip__my-location">내 위치</span>
                </button>
                <button class="map-chip" type="button" data-lat="33.497234" data-lng="126.513691">신사</button>
                <button class="map-chip" type="button">이태원</button>
                <button class="map-chip" type="button" data-lat="33.253912" data-lng="126.528928">테스트 주소</button>
            </div>

            <div class="map-ui__right-bottom">
                <div class="map-zoom">
                    <button type="button" class="map-zoom__btn" id="zoomIn" aria-label="줌인">
                        <span class="map-icon--zoom-in"></span>
                    </button>
                    <button type="button" class="map-zoom__btn" id="zoomOut" aria-label="줌아웃">
                        <span class="map-icon--zoom-out"></span>
                    </button>
                </div>

                <div class="map-send-wrapper">
                    <button th:onclick="|location.href='@{/map/listings/share}'|" class="map-send" type="button" aria-label="매물 보내기">
                        <span class="map-icon--send"></span>
                        <span class="map-send__text">매물 보내기</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- 행정구역 정보 바텀시트 -->
        <div id="info-sheet" class="bottom-sheet">

            <div class="bottom-sheet__handle-wrapper">
                <div class="bottom-sheet__handle"></div>
            </div>

            <div class="bottom-sheet__contents-wrapper">

                <div class="bottom-sheet__options">
                    <div class="bottom-sheet-btn__distance">필터</div>
                    <div class="bottom-sheet-toggle__wrapper">
                        <span class="bottom-sheet-txt">중개사</span>
                        <span class="bottom-sheet-txt is-selected">정보</span>
                    </div>
                </div>

                <div class="bottom-sheet__line"></div>

                <div class="info-sheet__region-tabs" id="info-sheet-tabs"></div>

                <div id="info-sheet-content"></div>
            </div>
        </div>

        <!-- 선택된 중개사 바텀시트 -->
        <div id="broker-sheet" class="bottom-sheet">

            <div class="bottom-sheet__handle-wrapper">
                <div class="bottom-sheet__handle"></div>
            </div>

            <div class="bottom-sheet__contents-wrapper">

                <div class="bottom-sheet__options">
                    <div class="bottom-sheet-btn__distance">필터</div>
                    <div class="bottom-sheet-toggle__wrapper">
                        <span class="bottom-sheet-txt is-selected">중개사</span>
                        <span class="bottom-sheet-txt">정보</span>
                    </div>
                </div>

                <div class="bottom-sheet__line"></div>

                <div id="broker-sheet-content"></div>
            </div>
        </div>

        <!-- 거리 필터 모달 -->
        <div id="filter-modal-overlay" class="filter-modal-overlay">
            <div class="filter-modal">
                <div class="filter-modal__title">필터</div>

                <hr class="filter-modal__hr">

                <div class="filter-modal__section">

                    <div class="filter-modal__section--distance">
                        <div class="filter-modal__section-title">거리 선택</div>
                        <div class="filter-modal__chips">
                            <button type="button" class="filter-chip__distance" data-distance="100">100m</button>
                            <button type="button" class="filter-chip__distance" data-distance="300">300m</button>
                            <button type="button" class="filter-chip__distance" data-distance="500">500m</button>
                            <button type="button" class="filter-chip__distance" data-distance="1000">1km</button>
                        </div>
                    </div>

                </div>

                <div class="filter-modal__footer">
                    <button type="button" class="filter-modal__btn filter-modal__btn--cancel" id="filterModalCancel">취소</button>
                    <button type="button" class="filter-modal__btn filter-modal__btn--apply" id="filterModalApply">적용</button>
                </div>
            </div>
        </div>

        <!-- 중개사 자세히 보기 시트 -->
        <div id="broker-detail-sheet" class="broker-detail-sheet">

            <div class="broker-detail-sheet__header">
                <button type="button" class="broker-detail-sheet__close" id="brokerDetailClose" aria-label="닫기"></button>
                <span class="broker-detail-sheet__title">자세히 보기</span>
                <button type="button" class="broker-detail-sheet__heart" aria-label="찜하기"></button>
            </div>

            <div class="broker-detail-sheet__body" id="brokerDetailBody">
                <!-- JS로 동적 렌더링 -->
            </div>

            <div class="broker-detail-sheet__footer">
                <button type="button" class="action-btn action-btn--call" id="brokerDetailCall" aria-label="전화하기">
                    <span class="action-btn__icon action-btn__icon--call"></span>
                </button>
                <button type="button" class="action-btn action-btn--send" id="brokerDetailSend">
                    <span class="action-btn__icon action-btn__icon--send" aria-hidden="true"></span>
                    <span class="action-btn__text">매물 보내기</span>
                </button>
            </div>

        </div>

    </div>

    <!-- Thymeleaf 인라인 변수 -->
    <script th:inline="javascript">
        const IS_LOGGED_IN = /*[[${login.authenticated}]]*/ false;
    </script>

    <!-- map control -->
    <script>

        let boundaryFeatures = [];
        let boundaryCache = new Map();
        let currentBoundaryKey = null;
        let lastBoundaryRequestId = 0;
        let regionCodeCache = new Map();

        let regionLabelOverlays = [];
        let selectedBoundaryFeature = null;

        let lastInfoData = null;

        //[zoom 레벨(숫자가 클수록 zoom 확대)]
        //- 20 level: 10m
        //- 19 level: 20m
        //- 18 level: 30m
        //- 17 level: 50m
        //- 16 level: 100m
        //- 15 level: 300m
        //- 14 level: 500m
        //- 13 level: 1km
        //- 12 level: 3km
        //- 11 level: 5km
        //- 10 level: 10km
        //- 9  level: 20km
        //- 8  level: 30km

        //[zoom 단계 변수]
        //(ZOOM_INITIAL)    초기: 13 level (1km)
        //(ZOOM_MAX)        지도 최대: 19 level (20m)
        //(ZOOM_MARKER)     마커 보이기: 19 ~ 17 level (20m ~ 50m)
        //(ZOOM_CLUSTER)    클러스터 보이기: 16 ~ 15 level (100m ~ 300m)
        //(ZOOM_EMD)        읍면동 보이기: 14 ~ 13 level (500m ~ 1km)
        //(ZOOM_SIGUNGU)    시군구 보이기: 12 ~ 11 level (3km ~ 5km)
        //(ZOOM_SIDO)       시도 보이기: 10 ~ 8 level (10km ~ 30km)
        //(ZOOM_MIN)        지도 최소: 8 level (30km)
        const ZOOM_INITIAL = 13;
        const ZOOM_MAX = 19;
        const ZOOM_MARKER_MAX = 19;
        const ZOOM_MARKER_MIN = 17;
        const ZOOM_CLUSTER_MAX = 16;
        const ZOOM_CLUSTER_MIN = 15;
        const ZOOM_EMD_MAX = 14;
        const ZOOM_EMD_MIN = 13;
        const ZOOM_SIGUNGU_MAX = 12;
        const ZOOM_SIGUNGU_MIN = 11;
        const ZOOM_SIDO_MAX = 10;
        const ZOOM_SIDO_MIN = 8;
        const ZOOM_MIN = 8;

        const btnZoomIn = document.getElementById('zoomIn');
        const btnZoomOut = document.getElementById('zoomOut');

        function updateClusterOptionsByZoom(zoom) {

            if (!markerClustering) {
                return;
            }

            let gridSize;

            if (zoom >= ZOOM_MARKER_MIN) {
                gridSize = 56;
            } else if (zoom >= ZOOM_CLUSTER_MIN) {
                gridSize = 120;
            } else if (zoom >= ZOOM_EMD_MIN) {
                gridSize = 180;
            } else if (zoom >= ZOOM_SIGUNGU_MIN) {
                gridSize = 240;
            } else {
                gridSize = 300;
            }

            markerClustering.setOptions({
                gridSize: gridSize,
            });
        }

        function getBoundaryLevelByZoom(zoom) {
            if (zoom >= ZOOM_EMD_MIN && zoom <= ZOOM_EMD_MAX) {
                return 'EMD';
            }

            if (zoom >= ZOOM_SIGUNGU_MIN && zoom <= ZOOM_SIGUNGU_MAX) {
                return 'SIGUNGU';
            }

            if (zoom >= ZOOM_SIDO_MIN && zoom <= ZOOM_SIDO_MAX) {
                return 'SIDO';
            }

            return null;
        }

        function createRegionLabelOverlay(lat, lng, name) {
            function Overlay() {
                this._position = new naver.maps.LatLng(lat, lng);
                this._name = name;
                this._div = null;
            }

            Overlay.prototype = new naver.maps.OverlayView();

            Overlay.prototype.onAdd = function () {
                const div = document.createElement('div');
                div.className = 'region-pill';
                div.textContent = this._name;
                this.getPanes().floatPane.appendChild(div);
                this._div = div;
            };

            Overlay.prototype.draw = function () {
                if (!this._div) return;
                const pos = this.getProjection().fromCoordToOffset(this._position);
                this._div.style.left = pos.x + 'px';
                this._div.style.top = pos.y + 'px';
            };

            Overlay.prototype.onRemove = function () {
                if (this._div && this._div.parentNode) {
                    this._div.parentNode.removeChild(this._div);
                    this._div = null;
                }
            };

            return new Overlay();
        }

        function clearRegionLabels() {
            regionLabelOverlays.forEach(o => o.setMap(null));
            regionLabelOverlays = [];
            selectedBoundaryFeature = null;
            closeInfoSheet();
        }

        async function loadRegionLabels(level) {
            clearRegionLabels();

            const bounds = map.getBounds();
            if (!bounds) return;

            const sw = bounds.getSW();
            const ne = bounds.getNE();

            const url = `/map/api/region-labels?level=${level}&south=${sw.lat()}&north=${ne.lat()}&west=${sw.lng()}&east=${ne.lng()}`;

            try {
                const res = await fetch(url);
                if (!res.ok) return;

                const labels = await res.json();

                labels.forEach(label => {
                    const overlay = createRegionLabelOverlay(label.lat, label.lng, label.name);
                    overlay.setMap(map);
                    regionLabelOverlays.push(overlay);
                });
            } catch (e) {
                console.error('[MAP] region labels load error:', e);
            }
        }

        function clearBoundaryFeatures() {
            if (!map || !map.data) return;

            clearRegionLabels();

            boundaryFeatures.forEach(feature => {
                map.data.removeFeature(feature);
            });

            boundaryFeatures = [];
            currentBoundaryKey = null;
        }

        async function fetchGeoJson(url) {
            if (boundaryCache.has(url)) {
                return boundaryCache.get(url);
            }

            const res = await fetch(url);
            if (!res.ok) {
                throw new Error(`GeoJSON 로딩 실패: ${url}`);
            }

            const data = await res.json();
            boundaryCache.set(url, data);
            return data;
        }

        async function fetchRegionCodeByCenter() {
            if (!map) {
                throw new Error('map is not initialized');
            }

            const center = map.getCenter();
            const lat = center.lat();
            const lng = center.lng();

            const cacheKey = `${lat.toFixed(5)},${lng.toFixed(5)}`;

            if (regionCodeCache.has(cacheKey)) {
                return regionCodeCache.get(cacheKey);
            }

            const res = await fetch(`/map/api/region-code?lat=${lat}&lng=${lng}`);
            if (!res.ok) {
                throw new Error('행정구역 코드 조회 실패');
            }

            const data = await res.json();

            /**
             * 기대 응답 예시
             * {
             *   "sidoCode": "41",
             *   "sigunguCode": "41131",
             *   "emdCode": "4113110200"
             * }
             */
            regionCodeCache.set(cacheKey, data);
            return data;
        }

        async function resolveBoundaryRequest() {
            const zoom = map.getZoom();
            const level = getBoundaryLevelByZoom(zoom);

            if (!level) {
                return null;
            }

            if (level === 'SIDO') {
                return {
                    level: 'SIDO',
                    key: 'SIDO_ALL',
                    url: '/geo/sido.geo.json'
                };
            }

            const region = await fetchRegionCodeByCenter();

            if (level === 'SIGUNGU') {
                if (!region?.sidoCode) {
                    return null;
                }

                return {
                    level: 'SIGUNGU',
                    key: `SIGUNGU_${region.sidoCode}`,
                    url: `/geo/sigungu/${region.sidoCode}.geo.json`
                };
            }

            if (level === 'EMD') {
                if (!region?.sigunguCode) {
                    return null;
                }

                return {
                    level: 'EMD',
                    key: `EMD_${region.sigunguCode}`,
                    url: `/geo/emd/${region.sigunguCode}.geo.json`
                };
            }

            return null;
        }

        function applyBoundaryStyle() {
            map.data.setStyle(function(feature) {
                const level = feature.getProperty('level');

                if (level === 'SIDO') {
                    return {
                        fillColor: '#a4a4a4',
                        fillOpacity: 0,
                        strokeColor: '#475569',
                        strokeWeight: 2,
                        strokeOpacity: 0.8,
                        clickable: true
                    };
                }

                if (level === 'SIGUNGU') {
                    return {
                        fillColor: '#a4a4a4',
                        fillOpacity: 0,
                        strokeColor: '#475569',
                        strokeWeight: 2,
                        strokeOpacity: 0.75,
                        clickable: true
                    };
                }

                return {
                    fillColor: '#a4a4a4',
                    fillOpacity: 0,
                    strokeColor: '#475569',
                    strokeWeight: 1,
                    strokeOpacity: 0.7,
                    clickable: true
                };
            });
        }

        async function loadAdministrativeBoundaries() {
            try {
                const requestId = ++lastBoundaryRequestId;
                const request = await resolveBoundaryRequest();

                if (requestId !== lastBoundaryRequestId) {
                    return;
                }

                if (!request) {
                    clearBoundaryFeatures();
                    return;
                }

                if (currentBoundaryKey === request.key) {
                    loadRegionLabels(request.level);
                    return;
                }

                clearBoundaryFeatures();

                const geojson = await fetchGeoJson(request.url);

                if (requestId !== lastBoundaryRequestId) {
                    return;
                }

                boundaryFeatures = map.data.addGeoJson(geojson);
                currentBoundaryKey = request.key;

                applyBoundaryStyle();
                loadRegionLabels(request.level);
            } catch (e) {
                console.error('[MAP] boundary load error:', e);
                clearBoundaryFeatures();
            }
        }

        function closeInfoSheet() {
            const sheet = document.getElementById('info-sheet');
            sheet.classList.remove('is-half', 'is-full');
        }

        function renderInfoSheet(data) {
            lastInfoData = data;
            const tabs = [data.sidoName, data.sigunguName, data.emdName].filter(Boolean);
            const regionName = tabs[tabs.length - 1] ?? '';

            document.getElementById('info-sheet-tabs').innerHTML = tabs
                .map((name, i) => `<span class="info-sheet__tab${i === tabs.length - 1 ? ' is-active' : ''}">${name}</span>`)
                .join('');

            const statsHtml = data.propertyStats.map(stat => {
                const barClass = stat.cssClass.replace('listing__tag--', 'info-sheet__stat-bar--');
                const pctClass = stat.cssClass.replace('listing__tag--', 'info-sheet__stat-pct--');
                return `
                    <div class="info-sheet__stat-item">
                        <div class="info-sheet__stat-header">
                            <div class="listing__tag ${stat.cssClass}">
                                <span class="tag-label">${stat.label}</span>
                                <span class="tag-count">${stat.count}</span>
                            </div>
                            <span class="info-sheet__stat-pct ${pctClass}">${stat.percentage} %</span>
                        </div>
                        <div class="info-sheet__stat-bar-wrap">
                            <div class="info-sheet__stat-bar ${barClass}" style="width:${stat.percentage}%"></div>
                        </div>
                    </div>`;
            }).join('');

            const selectedListingName = document.querySelector('.map-ui__chips .map-chip.is-on:not(#btn-my-location)')?.textContent ?? null;

            document.getElementById('info-sheet-content').innerHTML = `
                <p class="bottom-sheet__caption">
                    ${IS_LOGGED_IN && selectedListingName ? `<span class="bottom-sheet__bold">${selectedListingName}</span> 기준으로 ${selectedDistance ? `<span class="bottom-sheet__bold">${selectedDistance}</span> 이내에` : ''}` : ''}
                    <span class="bottom-sheet__bold">${data.brokerCount}명</span>의 중개사가 있습니다.
                </p>
                <div class="info-sheet__stat-list">${statsHtml}</div>`;
        }

        async function openInfoSheet(feature) {
            closeBrokerSheet();

            const admCd = feature.getProperty('admCd');
            if (!admCd) return;

            const url = `/map/api/region-info?admCd=${admCd}`;

            try {
                const res = await fetch(url);
                if (!res.ok) return;
                const data = await res.json();
                renderInfoSheet(data);
                document.getElementById('info-sheet').classList.add('is-half');
            } catch (e) {
                console.error('[MAP] region info load error:', e);
            }
        }

        const BOUNDARY_HOVER_STYLE = {
            fillColor: '#98adff',
            fillOpacity: 0.2,
            strokeColor: '#475569',
            strokeWeight: 3,
            strokeOpacity: 1
        };

        function selectBoundaryFeature(feature) {
            // 이전 선택 해제
            if (selectedBoundaryFeature) {
                map.data.revertStyle(selectedBoundaryFeature);
                const prevOverlay = regionLabelOverlays.find(o => o._name === selectedBoundaryFeature.getProperty('name'));
                if (prevOverlay?._div) prevOverlay._div.classList.remove('region-pill--selected');
            }

            // 새 선택 적용
            selectedBoundaryFeature = feature;
            map.data.overrideStyle(feature, BOUNDARY_HOVER_STYLE);

            const overlay = regionLabelOverlays.find(o => o._name === feature.getProperty('name'));
            if (overlay?._div) overlay._div.classList.add('region-pill--selected');
        }

        function bindBoundaryEvents() {
            map.data.addListener('mouseover', function (e) {
                if (e.feature === selectedBoundaryFeature) return;
                map.data.overrideStyle(e.feature, BOUNDARY_HOVER_STYLE);
            });

            map.data.addListener('mouseout', function (e) {
                if (e.feature === selectedBoundaryFeature) return;
                map.data.revertStyle(e.feature);
            });

            map.data.addListener('click', function (e) {
                selectBoundaryFeature(e.feature);
                openInfoSheet(e.feature);
            });
        }

        async function initMap() {

            map = new naver.maps.Map('map', {
                center:  center,
                zoom:    saved?.zoom ?? ZOOM_INITIAL,
                maxZoom: ZOOM_MAX,
                zoomControl: false,
            });

            updateClusterOptionsByZoom(map.getZoom());
            bindBoundaryEvents();

            loadAdministrativeBoundaries();

            naver.maps.Event.addListener(map, 'zoom_changed', function () {
                updateClusterOptionsByZoom(map.getZoom());
                loadAdministrativeBoundaries();
            });

            naver.maps.Event.addListener(map, 'dragend', function () {
                loadAdministrativeBoundaries();
            });

        }

        btnZoomIn.addEventListener('click', () => {
            const zoom = map.getZoom();
            if (zoom < ZOOM_MAX) {
                map.setZoom(zoom + 1, true);
            }
        });

        btnZoomOut.addEventListener('click', () => {
            const zoom = map.getZoom();
            if (zoom > ZOOM_MIN) {
                map.setZoom(zoom - 1, true);
            }
        });

        // 거리 필터 모달
        (function () {
            const overlay = document.getElementById('filter-modal-overlay');
            const btnCancel = document.getElementById('filterModalCancel');
            const btnApply = document.getElementById('filterModalApply');

            function openFilterModal() {
                overlay.classList.add('is-open');
            }

            function closeFilterModal() {
                overlay.classList.remove('is-open');
            }

            // .bottom-sheet-btn__distance 클릭 시 모달 열기
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.bottom-sheet-btn__distance')) return;

                if (!IS_LOGGED_IN) {
                    if (confirm('로그인이 필요한 기능입니다.\n로그인 페이지로 이동하시겠습니까?')) {
                        location.href = '/login';
                    }
                    return;
                }

                const listingChips = Array.from(
                    document.querySelectorAll('.map-ui__chips .map-chip:not(#btn-my-location)')
                );

                // 1. 매물 없음
                if (listingChips.length === 0) {
                    if (confirm('등록된 매물이 없습니다.\n매물을 등록하시겠습니까?')) {
                        location.href = '/listings/new';
                    }
                    return;
                }

                // 2. 매물은 있지만 선택된 칩 없음
                const hasSelected = listingChips.some(c => c.classList.contains('is-on'));
                if (!hasSelected) {
                    alert('매물을 먼저 선택해 주세요.');
                    return;
                }

                openFilterModal();
            });

            // 거리 칩 단일 선택 (이미 선택된 칩 재클릭 시 해제)
            overlay.addEventListener('click', (e) => {
                const chip = e.target.closest('.filter-chip__distance');
                if (!chip) return;
                const wasActive = chip.classList.contains('is-active');
                overlay.querySelectorAll('.filter-chip__distance').forEach(c => c.classList.remove('is-active'));
                if (!wasActive) chip.classList.add('is-active');
            });

            // 오버레이 바깥 클릭 닫기
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeFilterModal();
            });

            btnCancel.addEventListener('click', closeFilterModal);

            btnApply.addEventListener('click', () => {
                const active = overlay.querySelector('.filter-chip__distance.is-active');
                selectedDistance = active?.textContent ?? null;
                document.querySelectorAll('.bottom-sheet-btn__distance').forEach(el => {
                    el.textContent = selectedDistance ?? '필터';
                });
                closeFilterModal();

                const infoSheet = document.getElementById('info-sheet');
                const brokerSheet = document.getElementById('broker-sheet');
                if (infoSheet.classList.contains('is-half') || infoSheet.classList.contains('is-full')) {
                    if (lastInfoData) renderInfoSheet(lastInfoData);
                } else if (brokerSheet.classList.contains('is-half') || brokerSheet.classList.contains('is-full')) {
                    if (lastClusterBrokerCodes.length) fetchClusterBrokers(lastClusterBrokerCodes);
                }
            });
        })();

    </script>

</section>
</html>
