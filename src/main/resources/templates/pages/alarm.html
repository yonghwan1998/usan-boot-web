<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">알림 센터</title>
</head>

<th:block th:fragment="pcSideContent">
    <div class="align_center direction_column pc-side-inner">
        <h1 class="pc-side-title">우리 동네 부동산</h1>
        <p class="pc-side-desc">
            내 주변 중개사, 매물 정보를<br/>
            한 번에 확인하세요.
        </p>
        <img src="/img/side-test.jpeg"
             alt="우리 동네 부동산 소개"
             class="pc-side-img"
             style="width: 50%">
    </div>
</th:block>

<th:block th:fragment="extraCss">
    <link rel="stylesheet" th:href="@{/css/alarm.css(t=${#dates.createNow().time})}">
</th:block>

<section class="alarm-page">
    <div class="common-header alarm-header">
        <button class="common-header__back" th:onclick="history.back()"></button>
        <div class="common-header__title">알림 센터</div>
        <div class="common-header__right btn--setting"></div>
    </div>

    <div class="alarm-wrapper non-existing">

        <div class="alarm__non-existing-wrapper">
            <img src="/img/170x81-alarm-face.png" class="icon__alarm-face">
            <div class="non-existing__text-wrapper">
                <div class="non-existing__title">알림이 아직 없어요!</div>
                <div class="non-existing__text">새 매물이나 중요한 소식이 오면<br>여기에서 알려드려요!</div>
            </div>
        </div>



    </div>

</section>
