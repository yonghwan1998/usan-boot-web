<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/default :: layout(~{::title}, ~{::section})}">
<head>
    <title>중개사무소 Mock 지도</title>
    <style>
        #map {
            width: 100%;
            height: 600px;
        }
        .info-window {
            padding: 6px 10px;
            font-size: 13px;
            line-height: 1.5;
            max-width: 220px;
        }
        .info-title {
            font-weight: 700;
            margin-bottom: 4px;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            background: #0f766e;
            color: #fff;
            font-size: 11px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
<section>
    <!-- 네이버 지도 API -->
    <script type="text/javascript"  th:src="'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + ${naverClientId}"></script>

    <!-- 지도 영역 -->
    <div class="main-content">
        <div id="map" style="width: 100%; height: 500px"></div>
    </div>

    <!-- map control -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        var agencies = /*[[${agencies}]]*/ [];

        document.addEventListener("DOMContentLoaded", function () {

            // 1) 지도 기본 생성 (제주시 근처)
            var map = new naver.maps.Map('map', {
                center: new naver.maps.LatLng(33.4996, 126.5312),
                zoom: 11
            });

            // 2) 마커 찍기
            agencies.forEach(function (item) {
                if (!item.latitude || !item.longitude) {
                    return;
                }

                var latlng = new naver.maps.LatLng(item.latitude, item.longitude);

                var marker = new naver.maps.Marker({
                    position: latlng,
                    map: map,
                    icon: {
                        url: '/img/marker-agency.png',
                        size: new naver.maps.Size(56, 56),
                        scaledSize: new naver.maps.Size(56, 56),
                        origin: new naver.maps.Point(0, 0),
                        anchor: new naver.maps.Point(28, 56)
                    }
                });

                // 인포윈도우 내용
                var html = ''
                    + '<div class="info-window">'
                    +   '<div class="badge">' + (item.type || '') + '</div>'
                    +   '<div class="info-title">' + (item.officeName || '') + '</div>'
                    +   '<div>' + (item.address || '') + '</div>'
                    +   '<div>' + (item.tel ? '☎ ' + item.tel : (item.mobile || '')) + '</div>'
                    +   '<div style="margin-top:4px;color:#666;font-size:11px;">' + (item.regNo || '') + '</div>'
                    + '</div>';

                var infoWindow = new naver.maps.InfoWindow({
                    content: html
                });

                naver.maps.Event.addListener(marker, "mouseover", function () {
                    infoWindow.open(map, marker);
                });

                naver.maps.Event.addListener(marker, "mouseout", function () {
                    infoWindow.close();
                });
            });
        });
        /*]]>*/
    </script>
</section>
</body>
</html>
