<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(
        ~{::title},
        ~{::pcSideContent},
        ~{::section},
        ~{::extraCss}
      )}">

<head>
    <title th:fragment="title">오류가 발생했습니다 | 우산</title>
</head>

<th:block th:fragment="pcSideContent">
    <th:block th:replace="~{fragments/pc-side :: pcSideContent}"></th:block>
</th:block>

<th:block th:fragment="extraCss">
</th:block>

<section class="error-page">
    <div class="common-header">
        <button class="common-header__back" onclick="history.back()"></button>
        <h1 class="common-header__title">오류</h1>
        <div class="common-header__right"></div>
    </div>

    <div class="error-body">
        <div class="error-body__code" th:text="${status}">오류</div>
        <div class="error-body__title" th:text="${status == 404} ? '존재하지 않는 페이지예요' : '오류가 발생했습니다'">오류가 발생했습니다</div>
        <div class="error-body__desc" th:if="${status == 404}">
            요청하신 페이지를 찾을 수 없어요.<br>
            주소를 다시 확인해 주세요.
        </div>
        <div class="error-body__desc" th:unless="${status == 404}">
            일시적인 오류가 발생했어요.<br>
            잠시 후 다시 시도해 주세요.
        </div>
        <a href="/" class="btn btn--primary error-body__btn">홈으로 가기</a>
    </div>
</section>

</html>
