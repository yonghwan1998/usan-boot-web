<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:fragment="layout(
          title,
          pcSideContent,
          content,
          extraCss
      )">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>

    <!-- 페이지별 제목 -->
    <title th:replace="${title}">우산 - 우리동네 부동산</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/reset.css(t=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/common.css(t=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/layout.css(t=${#dates.createNow().time})}">

    <!-- 페이지 추가 CSS -->
    <th:block th:if="${extraCss != null}"
              th:replace="${extraCss}"></th:block>
</head>

<body class="usan-body">

<div class="usan-layout">

    <!-- PC 왼쪽 영역 -->
    <aside class="pc-side-section"
           th:if="${pcSideContent != null}"
           th:insert="${pcSideContent}">
    </aside>

    <!-- 모바일 메인 프레임 -->
    <div class="mobile-frame-outer">
        <main class="mobile-frame">
            <!-- 모바일 헤더 공통 -->
            <th:block th:replace="~{fragments/header :: header}"></th:block>

            <!-- 페이지별 본문 -->
            <section id="contents" th:replace="${content}"></section>

            <!-- 모바일 하단 네비 공통 -->
            <th:block th:replace="~{fragments/bottom-nav :: bottomNav}"></th:block>
        </main>
    </div>

</div>

<!-- 공통 JS -->
<!--<script th:src="@{/js/common.js}"></script>-->

<script>
    function updateScale() {
        const baseWidth = 430;
        const outer = document.querySelector('.mobile-frame-outer');
        const frame = document.querySelector('.mobile-frame');
        if (!outer || !frame) return;

        const vw = window.innerWidth;
        const scale = Math.min(vw / baseWidth, 1); // 430보다 크면 1, 작으면 비율 축소

        frame.style.transform = `scale(${scale})`;

        // 스케일된 실제 높이에 맞춰서 outer 높이도 맞춰주기
        const scaledHeight = frame.offsetHeight * scale;
        outer.style.height = `${scaledHeight}px`;
    }

    window.addEventListener('resize', updateScale);
    window.addEventListener('DOMContentLoaded', updateScale);
</script>

</body>
</html>
