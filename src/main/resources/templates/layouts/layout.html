<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:fragment="layout(
          title,
          pcSideContent,
          content,
          extraCss
      )">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:replace="${title}">우산 - 우리동네 부동산</title>

    <meta name="robots" content="index, follow">

    <!-- favicon -->
    <link rel="icon" type="image/png" href="/img/24x24-icon-U.png">
    <link rel="apple-touch-icon" href="/img/24x24-icon-U.png">

    <meta property="og:site_name" content="우산 - 우리동네 부동산">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:image" content="https://usanmap.com/img/og-default.png">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@usanmap">

    <meta name="naver-site-verification" content="">

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/reset.css(t=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/common.css(t=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/layout.css(t=${#dates.createNow().time})}">

    <th:block th:if="${extraCss != null}"
              th:replace="${extraCss}"></th:block>
</head>

<body class="usan-body">

<div class="usan-layout">

    <!-- PC 왼쪽 영역 -->
    <aside class="pc-side-section"
           th:if="${showPcSideContent}"
           th:insert="${pcSideContent}">
    </aside>

    <!-- 메인 프레임 -->
    <div class="mobile-shell" th:classappend="${currentUri eq '/'} ? 'bg_f2f2f2' : ''">

        <!-- 고정 헤더 -->
        <th:block th:if="${showHeader}">
            <th:block th:replace="~{fragments/header :: header}"></th:block>
        </th:block>
        <th:block th:if="${showSearchHeader}">
            <th:block th:replace="~{fragments/search-header :: search-header}"></th:block>
        </th:block>

        <!-- 페이지별 본문 -->
        <main class="mobile-frame">
            <section id="contents" th:replace="${content}"></section>
        </main>

        <!-- 더보기 모달 -->
        <th:block th:replace="~{fragments/more-panel :: morePanel}"></th:block>

        <!-- 공통 모달 -->
        <div class="common-modal" aria-hidden="true">
            <div class="common-modal__backdrop" data-modal-close></div>

            <div class="common-modal__card" role="dialog" aria-modal="true" aria-labelledby="common-modal-title">
                <div class="common-modal__content">
                    <div class="common-modal__title" id="common-modal-title">제목</div>
                    <div class="common-modal__body"></div>
                </div>

                <div class="common-modal__actions">
                </div>
            </div>
        </div>

        <!-- 고정 하단 네비 -->
        <th:block th:if="${showBottomNav}">
            <th:block th:replace="~{fragments/bottom-nav :: bottomNav}"></th:block>
        </th:block>

    </div>

</div>

<!-- 공통 JS -->
<script th:src="@{/js/common.js(t=${#dates.createNow().time})}"></script>

<script>
    function bindPcSideScrollProxy() {
        const side = document.querySelector('.pc-side-section');
        const inner = document.querySelector('.mobile-frame');

        if (!side || !inner) return;

        side.addEventListener('wheel', function (e) {
            e.preventDefault();
            inner.scrollTop += e.deltaY;
        }, { passive: false });
    }

    window.addEventListener('DOMContentLoaded', () => {
        bindPcSideScrollProxy();
    });
</script>

<script>
    function isMoreOpen() {
        const panel = document.getElementById('more-panel');
        return panel && panel.classList.contains('is-open');
    }

    function openMorePanel() {
        const panel = document.getElementById('more-panel');
        if (!panel) return;

        if (panel.classList.contains('is-open')) return;

        panel.classList.add('is-open');

        history.pushState({ modal: 'more' }, '');

        if (document.querySelector('.card__credit-credit')) {
            loadCreditSummary('ALL');
        }
    }

    function loadCreditSummary(type) {
        fetch('/api/credits/summary?type=' + type)
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(data) {
                if (!data) return;
                const balanceEl = document.querySelector('.card__credit-credit');
                if (balanceEl) balanceEl.textContent = Number(data.balance).toLocaleString('ko-KR') + 'C';
                const countEl = document.querySelector('.card__credit-count');
                if (countEl) countEl.textContent = '/ ' + Number(data.balance).toLocaleString('ko-KR') + '건';
                const totalSpan = document.querySelector('.credit__total-text .point_b');
                if (totalSpan) totalSpan.textContent = data.total;
                renderCreditItems(data.items);
            })
            .catch(function() {});
    }

    function renderCreditItems(items) {
        const wrapper = document.querySelector('.credit__bottom-wrapper');
        if (!wrapper) return;
        if (!items || items.length === 0) {
            wrapper.innerHTML = '<div class="credit__empty">내역이 없습니다.</div>';
            return;
        }
        wrapper.innerHTML = items.map(function(item) {
            return '<div class="credit__item">'
                + '<div class="credit__item-top">'
                + '<div class="credit__item-left">'
                + '<span class="credit__item-date">' + item.date + '</span>'
                + '<span class="credit__item-title">' + item.title + '</span>'
                + '</div>'
                + '<span class="credit__item-right ' + item.amountClass + '">' + item.amountText + '</span>'
                + '</div>'
                + '<div class="credit__item-bottom">' + item.bottomText + '</div>'
                + '</div>';
        }).join('');
    }

    function closeMorePanel() {
        const panel = document.getElementById('more-panel');
        if (!panel) return;

        if (!panel.classList.contains('is-open')) return;

        panel.classList.remove('is-open');

        if (history.state && history.state.modal === 'more') {
            window.__closingMoreByCode = true;
            history.back();
        }
    }

    function toggleMorePanel(e) {
        if (e) e.preventDefault();
        if (isMoreOpen()) closeMorePanel();
        else openMorePanel();
    }

    window.addEventListener('popstate', function (e) {
        if (window.__closingMoreByCode) {
            window.__closingMoreByCode = false;
            return;
        }

        if (isMoreOpen()) {
            const panel = document.getElementById('more-panel');
            panel.classList.remove('is-open');
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        const panel = document.getElementById('more-panel');
        if (!panel) return;

        panel.addEventListener('click', function (e) {
            if (e.target.closest('.btn--modal-close')) {
                closeMorePanel();
            }
        });

        panel.addEventListener('click', function (e) {
            const btn = e.target.closest('.credit__btn');
            if (!btn) return;
            panel.querySelectorAll('.credit__btn').forEach(function(b) { b.classList.remove('is-selected'); });
            btn.classList.add('is-selected');
            loadCreditSummary(btn.dataset.type);
        });
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        const selects = document.querySelectorAll('.common-select');

        selects.forEach(select => {
            const input   = select.querySelector('.common-select__input');
            const hidden  = select.querySelector('input[type="hidden"]');
            const options = select.querySelector('.common-select__options');

            const toggleSelect = (e) => {
                e.stopPropagation();

                const isOpen = select.classList.contains('is-open');

                closeAllSelects();

                if (!isOpen) {
                    select.classList.add('is-open');
                }
            };

            input.addEventListener('click', toggleSelect);
            select.querySelector('.common-input__expand-btn')
                ?.addEventListener('click', toggleSelect);

            options.querySelectorAll('li').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();

                    input.value = item.textContent.trim();
                    hidden.value = item.dataset.value || '';

                    select.classList.remove('is-open');
                });
            });
        });

        document.addEventListener('click', () => {
            closeAllSelects();
        });

        function closeAllSelects() {
            document.querySelectorAll('.common-select.is-open')
                .forEach(el => el.classList.remove('is-open'));
        }
    });
</script>

</body>
</html>
