<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:fragment="layout(
          title,
          pcSideContent,
          content,
          extraCss
      )">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>

    <!-- 페이지별 제목 -->
    <title th:replace="${title}">우산 - 우리동네 부동산</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">

    <!-- 페이지 추가 CSS -->
    <th:block th:if="${extraCss != null}"
              th:replace="${extraCss}"></th:block>
</head>

<body class="usan-body">

<div class="usan-layout">

    <!-- PC 왼쪽 영역 -->
    <aside class="pc-side-section"
           th:if="${pcSideContent != null}"
           th:replace="${pcSideContent}">
    </aside>

    <!-- 모바일 메인 프레임 -->
    <main class="mobile-frame">
        <!-- 모바일 헤더 공통 -->
        <th:block th:replace="~{fragments/header :: header}"></th:block>

        <!-- 페이지별 본문 -->
        <section id="contents" th:replace="${content}"></section>

        <!-- 모바일 하단 네비 공통 -->
        <th:block th:replace="~{fragments/bottom-nav :: bottomNav}"></th:block>
    </main>

</div>

<!-- 공통 JS -->
<!--<script th:src="@{/js/common.js}"></script>-->

</body>
</html>
